<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新聞圖譜 2026-08-02｜INFOFLASK</title><style>
:root{--bg:#0A0C10;--surface:#12151C;--surface-2:#171B24;--surface-3:#1D2330;
--border:#232936;--border-strong:#2E3646;--text:#E7EBF2;--text-2:#9AA4B2;--text-3:#5C6675;
--accent:#E8C158;--accent-soft:rgba(232,193,88,0.10);--link:#6CA8FF;
--up:#F0544C;--dn:#3FBF7F;--warn:#F5A524}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Inter","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.35rem;margin-bottom:4px}
.sub{color:var(--text-3);font-size:.85rem;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s}
.card:hover{background:var(--surface-3);border-color:var(--border-strong)}
.card.visited{opacity:.45}
.card h3{font-size:.95rem;font-weight:600;margin-bottom:4px}
.meta{color:var(--text-3);font-size:.75rem;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:1px 9px;font-size:.72rem;color:var(--text-2)}
.chip.et{color:var(--accent);border-color:rgba(232,193,88,.3)}
#reader{display:none}
.rcard{background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:20px 22px;margin-bottom:14px}
.rcard h2{font-size:1.2rem;margin-bottom:8px;color:var(--accent)}
.syn{margin:10px 0;color:var(--text)}
.facts{margin:12px 0;padding-left:2px}
.facts li{list-style:none;padding:3px 0 3px 18px;position:relative;color:var(--text-2);font-size:.9rem}
.facts li:before{content:"▪";position:absolute;left:2px;color:var(--accent)}
.watch{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:10px 0}
.arts{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
.arts h4{font-size:.8rem;color:var(--text-3);margin-bottom:6px;font-weight:500}
.arts a{display:block;padding:4px 0;font-size:.88rem}
.subev{margin:8px 0 12px}
.subev h5{font-size:.82rem;color:var(--accent);font-weight:600;margin-bottom:2px}
.arts .src{color:var(--text-3);font-size:.75rem;margin-left:6px}
.next h4{font-size:.85rem;color:var(--text-2);margin:16px 0 8px}
.nextbtn{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;color:var(--text);cursor:pointer;font-size:.9rem;font-family:inherit;transition:.15s}
.nextbtn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.nextbtn .rel{color:var(--accent);font-size:.75rem;margin-right:8px;border:1px solid rgba(232,193,88,.35);border-radius:20px;padding:1px 8px}
.nextbtn .why{color:var(--text-3);font-size:.78rem;margin-left:6px}
.nextbtn.visited{opacity:.5}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.85rem;font-family:inherit}
.btn:hover{background:var(--surface-3);color:var(--text)}
.datecard{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.datecard:hover{background:var(--surface-3);text-decoration:none}
.datecard b{color:var(--text)}
</style></head><body>
<div class="wrap">
<h1>📰 新聞圖譜 <span style="color:var(--accent)">2026-08-02</span></h1>
<div class="sub">2 個主題｜2 篇｜點一個開始，沿關係連貫閱讀（AI 整合＋子事件結構，原始連結附於卡片內）</div>
<div class="topbar"><a class="btn" href="index.html">← 日期列表</a></div>
<div id="overview"><div class="grid" id="grid"></div></div>
<div id="reader"></div>
</div>
<script type="application/json" id="data">{"clusters": {"0": {"id": 0, "title": "富旺國際超青安兩月成交近30戶", "synthesis": "富旺國際（6219）8月2日表示，自6月1日推出「富旺超青安」後，兩個月全台成交近30戶。該方案前36期房貸利息最高補貼2.5％，貸款成數最高達8成。旗下「艾美莊園－市鎮香榭」全案銷售率也已逼近4成，顯示該建案銷售進度與優惠方案成交表現同步受到關注。", "facts": ["6月1日推出富旺超青安", "兩個月全台成交近30戶", "前36期利息最高補貼2.5％", "貸款成數最高達8成", "艾美莊園銷售率逼近4成"], "watch": "留意「富旺超青安」推出滿兩個月後的成交戶數與「艾美莊園－市鎮香榭」銷售率變化。", "etype": "房市", "codes": ["6219"], "n": 1, "subs": [{"t": "富旺超青安成交近30戶", "arts": [{"t": "富旺超青安全台成交近30戶「艾美莊園-市鎮香榭」邀孫淑媚開唱慶落成", "u": "https://money.udn.com/money/story/5621/9666573", "s": "經濟日報", "d": "2026-08-02"}]}]}, "1": {"id": 1, "title": "中國央行第3季可望降準降息", "synthesis": "中國人民銀行於2026年8月1日召開2026年下半年工作會議，提出將綜合運用並適時調整貨幣政策工具，以保持流動性充裕，並降低社會綜合融資成本。根據分析，第3季中國央行可望採取降準、降息措施；惟原文僅稱「可望」，尚未表示相關政策已正式落地。", "facts": ["中國人民銀行8月1日召開下半年工作會議", "將適時調整貨幣政策工具", "政策目標為保持流動性充裕", "政策目標為降低社會綜合融資成本", "分析認為第3季可望降準、降息"], "watch": "留意2026年第3季中國央行是否公布降準或降息措施。", "etype": "總經政策", "codes": [], "n": 1, "subs": [{"t": "中國央行第3季可望降準降息", "arts": [{"t": "中國央行：適時調整貨幣政策工具 保持流動性充裕", "u": "https://money.udn.com/money/story/5603/9666433", "s": "經濟日報", "d": "2026-08-02"}]}]}}, "edges": {}}</script>
<script>const PAGE="2026-08-02";const XDATE={};
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.clusters, E = DATA.edges;
const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
      <span class="chip">已讀 ${seen.size}/${Object.keys(C).length}</span></div>
    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';
  renderGrid();
}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
</body></html>
