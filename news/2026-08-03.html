通報主管機關，僅通知中聯油脂換貨。台中市政府於8月3日依食安法裁處中聯製造、福懋油法定最高額各300萬元，並追查油品流向及回收情形。中央認定粗膠原油非最終食用油品、依法無須強制通報，但曾梓展認為依食安法理論上仍應通報；中聯油脂廠長陳明榮已於8月1日遭羈押禁見。另自7月起，化粧品PIF制度全面適用，上市前須建立涵蓋16項法定文件的產品資訊檔案；未建檔或無法提供查核，限期未改善可處新台幣1萬元以上、100萬元以下罰鍰。", "facts": ["5月18日苯駢芘檢出14.7μg/kg", "中聯製造、福懋油各罰300萬元", "陳明榮8月1日遭羈押禁見", "台中市政府8月3日追查流向回收", "化粧品PIF自7月全面適用", "PIF須涵蓋16項法定文件"], "watch": "留意油品流向及回收情形，以及PIF未建檔或無法提供查核且限期未改善時的處罰。", "etype": "總經政策", "codes": [], "n": 3, "subs": [{"t": "中聯福懋油苯駢芘超標各罰300萬", "arts": [{"t": "未通報台糖採購油品檢出異常 中市府再罰中聯、福懋油各300萬元", "u": "https://money.udn.com/money/story/7307/9668594", "s": "經濟日報", "d": "2026-08-03"}, {"t": "台糖毒油屬半成品無須通報？ 中市衛生局長揭這原因「理應通報」", "u": "https://money.udn.com/money/story/7307/9667587", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "化粧品PIF制度7月全面實施", "arts": [{"t": "PIF上路國際品牌占優勢？鄭圭雯：台灣品牌迎來全新機會", "u": "https://money.udn.com/money/story/11799/9667465", "s": "經濟日報", "d": "2026-08-03"}]}]}, "5": {"id": 5, "title": "力積電轉型、泓德2GW、丸紅獲利增", "synthesis": "力積電（6770）創辦人暨董事長黃崇仁於7月31日辭世，由副董事長謝再居代理董事長，並延續3D AI Foundry、先進封裝等轉型方向。公司後續將處理設備搬遷、產品組合調整、新廠承接先進封裝需求，以及與投資人、客戶和供應鏈溝通，目標在未來三年將3D AI Foundry營收占比提高至兩成。泓德能源（6873）8月3日宣布，澳洲綠能平台ZEBRE引進ZEF Holding為新投資人並完成股東結構調整，將結合星星電力拓展約2GW資料中心電力與碳管理方案；ZEN Energy股權移轉仍在辦理中，兩篇報導分別稱對營運、財務結構及主要業務無重大影響，以及既定計畫不受影響。丸紅能源及化學事業4月至6月調整後淨利由90億日圓增至310億日圓，住友商事天然氣和電力交易事業獲利成長70%。", "facts": ["力積電3D AI營收占比拚兩成", "黃崇仁7月31日辭世", "泓德能源拓展約2GW方案", "ZEBRE引進ZEF Holding", "丸紅淨利增至310億日圓", "住友商事獲利成長70%"], "watch": "留意ZEN Energy股權移轉完成進度，以及力積電未來三年3D AI Foundry營收占比是否達兩成。", "etype": "公司治理", "codes": ["6770", "6873"], "n": 5, "subs": [{"t": "泓德能源推進澳洲2GW方案", "arts": [{"t": "泓德能源強化澳洲在地資本連結 ZEBRE平台引進新投資人推進儲能布局", "u": "https://money.udn.com/money/story/11162/9668098", "s": "經濟日報", "d": "2026-08-03"}, {"t": "泓德能源深化澳洲綠能布局 引進澳洲控股 ZEF Holding 作為新投資人", "u": "https://money.udn.com/money/story/11162/9668003", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "力積電（6770）換帥並拚3D AI營收兩成", "arts": [{"t": "力積電創辦人生前最後一場專訪／謝再居接棒 謹守「黃董哲學」", "u": "https://money.udn.com/money/story/11162/9666398", "s": "經濟日報", "d": "2026-08-0 6-08-03"}]}]}, "7": {"id": 7, "title": "多家公司擴產建廠，欣銓投資285億元", "synthesis": "8月3日，璨揚企業在台南七股科技工業區動土，投資10億元興建自動倉儲，將視營運需求引進機台設備，以因應全球訂單成長、提升商用車燈產能與供應鏈韌性，預計創造約100個在地職缺；完工時間兩篇報導分別稱「2年」及「117年」。路透報導，長鑫科技考慮在北京亦莊興建12吋記憶體晶片晶圓廠，並尋求至少6,000萬元資助，但磋商仍初步，產能與總投資額未定。台達電（2308）公告投資18億元重建桃園一廠，土建由麗明承攬、總價16.55億元，公司今年資本支出上看700億元並啟動全球擴廠以滿足AI客戶需求。欣銓（3264）將投資約285億元擴充先進測試設備與智慧化產線，新增237個本國職缺；中聯資源（9930）投資約18億元增設台中中部研磨廠產線，以提升產能並降低能源成本。", "facts": ["璨揚七股自動倉儲投資10億元", "璨揚完工說法為2年或117年", "長鑫科技北京擬建12吋晶圓廠", "台達電（2308）重建桃園一廠18億元", "欣銓（3264）投資285億元擴產", "中聯資源（9930）投資18億元增設研磨線"], "watch": "留意璨揚視營運需求引進設備，以及長鑫科技北京建廠磋商對產能與總投資額的後續確認。", "etype": "訂單產能", "codes": ["2308", "3264", "9930"], "n": 5, "subs": [{"t": "璨揚企業斥資10億元七股建自動倉儲", "arts": [{"t": "商用車燈龍頭璨揚企業 10億元打造七股新廠", "u": "https://money.udn.com/money/story/5612/9668155", "s": "經濟日報", "d": "2026-08-03"}, {"t": "璨揚企業10億元打造新廠 黃偉哲盼加速完工投產", "u": "https://money.udn.com/money/story/7307/9667108", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "台達電重建桃園一廠18億元", "arts": [{"t": "台達電擬斥資18億元重建桃園一廠", "u": "https://money.udn.com/money/story/11162/9668132", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "欣銓投資285億元", "arts": [{"t": "《熱門族群》欣銓、中聯資分砸285億元、18億元 擴大在台投資拓產線", "u": "https://www.ctee.com.tw/news/20260803701022-430201", "s": "工商時報", "d": "2026-08-03"}]}, {"t": "長鑫科技北京建廠6,000萬元", "arts": [{"t": "長鑫科技據報將在北京新建晶圓廠 尋求北京經開區6,000萬元資助", "u": "https://www.ctee.com.tw/news/20260803701708-430804", "s": "工商時報", "d": "2026-08-03"}]}]}, "8": {"id": 8, "title": "愛普、亞德客獲利增，盛群產品漲價", "synthesis": "愛普（6531）6月淨利3.27億元，年增785%，單月EPS為2.01元，年增784%；摩根士丹利維持「優於大盤」評等，目標價1,555元。標普500指數成分企業第2季獲利預料年增47.4%，創近5年最佳；近9成企業財報優於預期，11大產業中有8個獲利呈兩位數成長。傑霖（8102）上半年合併營收2.24億元，年增2.6％，新一代2300系列將量產，法人看好營收與獲利逐季成長，全年業績雙位數成長。亞德客-KY（1590）第2季營收121.64億元，毛利率49.72％，稅後淨利33.11億元，年增63％，每股盈餘16.55元；美系外資維持買進，全年營收預估成長2成以上，營業利益率上調至34％。盛群（6202）因應成本全面調漲產品報價約一至兩成；上半年營收18.08億元、年增12％，淨利2.16億元、年增92％，公司預期下半年優於上半年，第3季季增、第4季與本季相當。", "facts": ["愛普6月淨利3.27億元、年增785%", "愛普單月EPS2.01元、年增784%", "標普500第2季獲利預增47.4%", "傑霖上半年營收2.24億元、年增2.6％", "亞德客第2季淨利33.11億元、年增63 ", "6275"], "n": 2, "subs": [{"t": "喬山北寧廠投產4億美元", "arts": [{"t": "全球最大健身器材製造基地喬山越南北寧廠落成啟用", "u": "https://money.udn.com/money/story/5612/9667658", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "元山擴產月產60萬台", "arts": [{"t": "元山搶液冷散熱商機", "u": "https://money.udn.com/money/story/11074/9666288", "s": "經濟日報", "d": "2026-08-03"}]}]}, "19": {"id": 19, "title": "統一佳佳停健身、三商美邦下市", "synthesis": "統一集團（1216）於8月3日宣布退出健身市場，旗下統一佳佳董事會決議終止BEING sport與BEING fit的健身俱樂部及健身房服務。多數報導稱停止服務日為9月3日，另有報導 уточ明將營運至9月2日晚間11時；會員可在9月2日前辦理退費，或轉至健身工廠，健身工廠並於8月3日至8月9日提供轉籍方案及協助承接會員。統一佳佳表示資源將轉向Spa，BEING Spa維持營運；公司上半年稅後虧損7351.4萬元，較去年同期擴大約12.5%，該數字涵蓋整體營運。另一方面，三商美邦人壽（2867）將於9月1日下市，透過股份轉換併入玉山金控（2884）；該案已於7月7日獲金融監督管理委員會核准，預計12月1日更名為「玉山人壽」，通知信稱保戶既有權益百分之百保障。", "facts": ["統一佳佳9月3日停止健身服務", "BEING sport、BEING fit結束營運", "健身工廠8月3日至9日承接轉籍", "統一佳佳上半年虧損7351.4萬元", "三商美邦人壽（2867）9月1日下市", "三商美邦併入玉山金控（2884）", "玉山人壽預計12月1日更名"], "watch": "留意9月2日晚間11時健身服務終止、9月1日三商美邦人壽下市及12月1日更名安排。", "etype": "公司治理", "codes": ["1216", "2867", "2884"], "n": 5, "subs": [{"t": "統一佳佳9月3日停健身、轉向Spa", "arts": [{"t": "統一佳佳健身系列BEING sport、BEING fit 下月結束營運", "u": "https://www.ctee.com.tw/news/20260803701308-430503", "s": "工商時報", "d": "2026-08-03"}, {"t": "統一佳佳退出健身房　逾20年品牌9月結束服務", "u": "https://money.udn.com/money/story/5612/9668118", "s": "經濟日報", "d": "2026-08-03"}, {"t": "統一健身事業退場！BEING sport、fit 9月停止服務 會員轉健身工廠", "u": "https://money.udn.com/money/story/5612/9667997", "s": "經濟日報", "d": "2026-08-03"}, {"t": "統一集團退出健身市場 會員可轉至健身工廠", "u": "https://www.ctee.com.tw/news/20260803701806-430503", "s": "工商時報", "d": "2026-08-03"}]}, {"t": "三商美邦人壽9月1日下市", "arts": [{"t": "三商壽9月走入歷史 向保戶發出通知信曝光 12月1日更名「玉山人壽」", "u": "https://money.udn.com/money/story/5613/9667173", "s": "經濟日報", "d": "2026-08-03"}]}]}, "20": {"id": 20, "title": "伊朗限縮荷莫茲海峽，OPEC+增產受阻", "synthesis": "伊朗外交部發言人貝卡伊於8月3日表示，伊朗未與美國談判，而是與阿曼協商荷莫茲海峽管理機制及暫時航運路線，方向為單一廊道；另一篇報導稱雙方已接近達成新海運航線協議，但細節尚未公布。伊朗強調，共識不代表海峽重新開放，也不代表維持封鎖，情勢未改變前不會有重大變化，並指責美國恢復海上封鎖、撤銷伊朗石油銷售許可。關於通航狀況，報導一稱船舶由約45艘降至約13艘，另一篇則稱海峽關閉。OPEC+七國委員會於8月2日同意9月增產每日18.8萬桶，連 技（4743）於8月2日宣布，糖尿病足潰瘍新藥「速必一」完成上市後臨床試驗解盲，120名受試者中，ON101組16周內完全癒合率為76.3%，高於對照組44.9%，且達統計顯著差異。衛福部食藥署認可該試驗為確證性試驗，合一將申請大陸擴大適應症並停止後續臨床試驗。", "facts": ["GNX1021日本完成一期首位收案", "試驗於日本及台灣進行", "速必一完全癒合率76.3%", "對照組完全癒合率44.9%", "試驗共120名受試者", "食藥署認可為確證性試驗"], "watch": "留意合一申請大陸擴大適應症及停止後續臨床試驗。", "etype": "訂單產能", "codes": ["4168", "4743"], "n": 2, "subs": [{"t": "醣聯GNX1021完成一期首位收案", "arts": [{"t": "醣聯新世代 ADC 藥物 GNX1021一期臨床 完成首位受試者收案", "u": "https://money.udn.com/money/story/10871/9666928", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "合一新藥解盲達標76.3%", "arts": [{"t": "合一新藥解盲 達標", "u": "https://money.udn.com/money/story/5612/9666544", "s": "經濟日報", "d": "2026-08-03"}]}]}, "41": {"id": 41, "title": "台灣虛擬資產、歐盟AI違規最高罰1億元及3%", "synthesis": "台灣立法院6月30日三讀通過《虛擬資產服務法》，虛擬資產服務業者（VASP）改採事前許可制，並納入資本額、內部控制、客戶資產分離保管及穩定幣發行等規範；已登記業者須在一年內向金管會申請許可，非法經營最高處七年以下有期徒刑及1億元罰金。歐盟人工智慧（AI）法第一階段則於8月2日生效，要求企業為聊天機器人、深偽技術及AI生成內容加上標籤，並告知消費者正與AI互動。違規科技公司最高可能面臨以上一年度全球總營業額3%或1,500萬歐元計算的罰款；企業並憂心法遵成本及執行碎片化。", "facts": ["VASP改採事前許可制", "非法經營最高罰1億元", "已登記業者一年內申請許可", "歐盟AI法第一階段8月2日生效", "AI違規最高罰全球營收3%", "AI違規最高罰1,500萬歐元"], "watch": "已登記VASP一年內申請金管會許可，並留意8月2日生效的歐盟AI法標籤與告知要求。", "etype": "總經政策", "codes": [], "n": 2, "subs": [{"t": "歐盟AI法上路罰款3%", "arts": [{"t": "歐盟 AI 法掀「通知轟炸」疑慮 外界憂心會重演「cookie跳出時刻」亂象", "u": "https://money.udn.com/money/story/5599/9666495", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "虛擬資產法設最高1億元罰金", "arts": [{"t": "新聞中的法律／布局虛擬資產業務 三個考量", "u": "https://money.udn.com/money/story/6710/9666441", "s": "經濟日報", "d": "2026-08-03"}]}]}, "42": {"id": 42, "title": "台積電先進製程追單、面板供給收斂", "synthesis": "2026年8月3日，台積電（2330）3奈米月投片量18萬片目標可望於第4季初達陣，2奈米年底朝10萬片靠攏；英特爾Intel 18A-P已進入風險量產，14A預定2027年下半年內部風險試產、2028年下半年量產。聯發科（2454）協助客戶運用CoWoS與EMIB-T；英特爾EMIB-T良率突破九成、成本為台積電CoWoS一半，力積電（6770）矽電容產能全數售罄並擴產，聯電代工矽橋。Google、微軟、Meta自研AI晶片放量，Google預估2028年TPU需求上看1,500萬顆，台積電取得TPUv9的2奈米訂單，鴻海（2317）、英業達（2356）承接伺服器設計與組裝；日月光投控（3711）、力成（6239）、京元電（2449）受惠，京元電已取得輝達GB300、Vera Rubin測試訂單並布局至2028年。面板方面，群創（3481）與友達（2409）2028年監視器面板供給占比合計跌破10%、筆電近20%、電視約22%；群創擬於2027年底至2028年關閉Fab3，友達 <script>const PAGE="2026-08-03";const XDATE={};

const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">

    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>

}
function renderGrid(){
  const grid=document.getElementById('grid');

  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;

  const edges=(E[id]||[]);

        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}

    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{

            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">

            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){

}
renderGrid();
