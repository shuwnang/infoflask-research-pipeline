08-03"}]}]}, "34": {"id": 34, "title": "盛群調漲報價一至兩成", "synthesis": "盛群（6202）為反映成本，啟動疫情後首次全面調整產品報價，調幅約一至兩成。營運展望方面，公司預期下半年表現優於上半年，第3季營運應呈現季增，第4季則估計與本季相當。財務表現上，盛群上半年營收18.08億元，年增12％；淨利2.16億元，年增92％。", "facts": ["報價調漲幅度約一至兩成", "疫情後首次全面調整報價", "上半年營收18.08億元", "上半年淨利2.16億元，年增92％", "公司預期下半年優於上半年", "第3季估呈季增、第4季與本季相當"], "watch": "留意第3季是否實現季增，以及第4季營運是否與本季相當", "etype": "財報", "codes": ["6202"], "n": 1, "subs": [{"t": "盛群產品報價調漲一至兩成", "arts": [{"t": "盛群漲價效應 下半年營運可望優於上半年 盤中股價奔漲停", "u": "https://money.udn.com/money/story/5607/9667353", "s": "經濟日報", "d": "2026-08-03"}]}]}, "35": {"id": 35, "title": "全心投控買進奇偶5.04%股權", "synthesis": "全心投控（2718）於6月8日至8月3日期間，分批取得奇偶科技（3356）4,063張股票，總金額為2.39億元，持股比例達5.04%，平均每股買進價格為58.83元。全心投控將這項投資定位為長期投資，布局房地產與AI安控整合。此次交易使全心投控成為奇偶科技持股逾5%的股東，投資方向聚焦於房地產與AI安控兩項業務的結合。", "facts": ["全心投控（2718）持有奇偶5.04%", "6月8日至8月3日買進4,063張", "交易總金額2.39億元", "平均每股58.83元", "投資定位為長期投資", "布局房地產與AI安控整合"], "watch": "", "etype": "公司治理", "codes": ["2718", "3356"], "n": 1, "subs": [{"t": "全心投控取得奇偶5.04％股權", "arts": [{"t": "全心投控擴大控股觸角！斥2.39億元取得奇偶科技5.04％股權", "u": "https://www.ctee.com.tw/news/20260803701576-430601", "s": "工商時報", "d": "2026-08-03"}]}]}, "36": {"id": 36, "title": "建新國際30億元冷鏈物流中心啟用", "synthesis": "建新國際（8367）旗下新科智慧國際物流中心於8月3日在台北港揭牌，一期投入30億元，報導稱其為北台灣最大面積冷鏈倉儲，並躍居前二大物流中心。中心提供保稅倉儲、多溫層冷鏈及海空聯運，主要鎖定AI供應鏈、半導體、電子材料與高值化溫控貨品需求。公司第二期冷鏈擴建預計於8月啟動申請，目標於年底前啟用；法人估計，第二期自2027年起可貢獻營收3億～4.5億元，毛利率至少3成。", "facts": ["一期投入30億元", "8月3日台北港揭牌啟用", "北台灣最大面積冷鏈倉儲", "提供保稅倉儲及海空聯運", "第二期目標年底前啟用", "2027年起估貢獻3億～4.5億元"], "watch": "留意第二期冷鏈擴建於8月啟動申請及年底前啟用進度。", "etype": "訂單產能", "codes": ["8367"], "n": 4, "subs": [{"t": "建新國際30億元物流中心啟用", "arts": [{"t": "建新國際「新科智慧物流中心」今啟用 輝達、亞馬遜等大咖客戶進駐", "u": "https://www.ctee.com.tw/news/20260803701485-430503", "s": "工商時報", "d": "2026-08-03"}, {"t": "《航運股》建新國際新科物流中心啟用 鎖定AI商機", "u": "https://www.ctee.com.tw/news/20260803701292-430201", "s": "工商時報", "d": "2026-08-03"}, {"t": "建新「新科智慧國際物流中心」揭牌！搶攻 AI 產業鏈與高值化物流商機", "u": "https://money.udn.com/money/story/5612/9667890", "s": "經濟日報", "d": "2026-08-03"}, {"t": "搶攻AI產業鏈物流商機　建新台北港物流中心揭牌", "u": "https://money.udn.com/money/story/5612/9667863", "s": "經濟日報", "d": "2026-08-03"}]}]}, "37": {"id": 37, "title": "景碩擴產196億、南電營收創高", "synthesis": "8月3日，景碩（3189）宣布新增資本支出約196億元，因應AI伺服器與高效能運算需求，採分階段擴建，目標在2030年前完成約3至4座新廠或新產能，並持續布局ABF載板。欣興（3037）今年資本支出則上修至537億元，擴充高階載板產能。景碩第二季營收124.96億元、上半年累計236.01億元。南電（8046）同日公布7月合併營收54.4億元，月增約16.13%、年增50.24%，創近三年半單月新高；前七月累計301.92億元，年增39.38%，成長主要受市場需求升溫帶動。股價方面，景碩與欣興同步拉出第2根漲停，南電一度漲停至1,010元，臻鼎-KY（4958）亦上漲。", "facts": ["景碩新增資本支出約196億元", "景碩2030年前建3至4座新廠", "欣興資本支出上修至537億元", "南電7月營收54.4億元，年增50.24%", "南電前七月營收301.92億元", "景碩上半年營收236.01億元"], "watch": "留意景碩2030年前分階段擴建進度，以及AI伺服器與高效能運算需求是否延續。", "etype": "訂單產能", "codes": ["3037", "3189", "4958", "8046"], "n": 3, "subs": [{"t": "景碩擴產196億、2030年前建3至4座新廠", "arts": [{"t": "資金回來了 景碩、欣興連拉2根漲停 南電也一度亮燈", "u": "https://money.udn.com/money/story/5607/9667454", "s": "經濟日報", "d": "2026-08-03"}, {"t": "景碩擴產拚AI商機 2030年前穩健佈局3至4座新廠", "u": "https://www.ctee.com.tw/news/20260803701742-431202", "s": "工商時報", "d": "2026-08-03"}]}, {"t": "南電7月營收54.4億元", "arts": [{"t": "南電營收／7月54.4億元 年增逾五成、再創近三年半新高", "u": "https://money.udn.com/money/story/5710/9667841", "s": "經濟日報", "d": "2026-08-03"}]}]}, "38": {"id": 38, "title": "中磊全年營收拚增47%下半年創高", "synthesis": "中磊（5388）6月及第2季營收同步創下歷史新高，法人看好新產品將於2026年下半年陸續出貨，帶動下半年及第3季營收再創新高。公司預期2026年訂單無虞，全年營收成長47%，稅後純益成長幅度可望逾六成。不過，記憶體等零組件成本走揚，可能成為後續獲利表現需關注的成本因素。", "facts": ["6月及第2季營收同創歷史新高", "全年營收預期成長47%", "全年稅後純益可望增逾六成", "新產品預計2026年下半年出貨", "記憶體等零組件成本走揚"], "watch": "留意2026年下半年新產品陸續出貨，以及第3季營收是否再創新高。", "etype": "財報", "codes": ["5388"], "n": 1, "subs": [{"t": "中磊全年營收成長47%", "arts": [{"t": "中磊獲利喊衝", "u": "https://money.udn.com/money/story/5710/9666296", "s": "經濟日報", "d": "2026-08-03"}]}]}, "39": {"id": 39, "title": "全家餐飲（7708）上半年EPS4.15元、店數77家", "synthesis": "全家餐飲（7708）於2026年8月3日公告第二季及上半年財報，另一篇報導則稱公司為全家國際餐飲（7708）。第二季營收7.47億元、稅後淨利0.57億元、EPS 2.23元，三項均較去年同期成長。上半年營收14.68億元，年增12.57%；稅後淨利兩篇分別載為1.06億元及1.05億元，後者並稱年增34.36%。上半年EPS均為4.15元，創同期或歷年新高。截至2026年6月底，全品牌店數達77店。", "facts": ["2026年8月3日公告第二季及上半年財報", "第二季營收7.47億元、EPS 2.23元", "上半年營收14.68億元，年增12.57%", "上半年稅後淨利載為1.06億或1.05億元", "上半年EPS 4.15元，創新高", "截至2026年6月底店數達77家"], "watch": "", "etype": "財報", "codes": ["7708"], "n": 2, "subs": [{"t": "全家餐飲上半年EPS4.15元、店數達77家", "arts": [{"t": "全家餐飲財報／第2季 EPS 2.23元創新高 上半年4.15元創同期新高", "u": "https://money.udn.com/money/story/11074/9668297", "s": "經濟日報", "d": "2026-08-03"}, {"t": "全家國際餐飲上半年EPS 4.15元 創歷年同期新高", "u": "https://www.ctee.com.tw/news/20260803701510-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "40": {"id": 40, "title": "泓德能源（6873）攜手ZEBRE拓展2GW方案", "synthesis": "8月3日，泓德能源（6873）宣布，澳洲綠能投資與資產管理平台ZEBRE引進ZEF Holding為新投資人，並完成股東結構調整。ZEBRE將持續推進光電、儲能及電力市場資產開發；泓德能源則結合ZEBRE與星星電力的能力，拓展目標規模約2GW的資料中心電力與碳管理方案。此外，ZEN Energy股權移轉事項仍在辦理中，報導指出該移轉對整體營運、財務結構及主要業務無重大影響，既定計畫亦不受影響。", "facts": ["8月3日泓德能源宣布ZEBRE引進ZEF Holding", "ZEBRE完成股東結構調整", "目標拓展約2GW資料中心方案", "方案涵蓋電力與碳管理", "ZEN Energy股權移轉辦理中", "股權移轉對營運無重大影響"], "watch": "留意ZEN Energy股權移轉完成及約2GW資料中心方案進展。", "etype": "公司治理", "codes": ["6873"], "n": 2, "subs": [{"t": "泓德能源推進澳洲2GW資料中心方案", "arts": [{"t": "泓德能源強化澳洲在地資本連結 ZEBRE平台引進新投資人推進儲能布局", "u": "https://money.udn.com/money/story/11162/9668098", "s": "經濟日報", "d": "2026-08-03"}, {"t": "泓德能源深化澳洲綠能布局 引進澳洲控股 ZEF Holding 作為新投資人", "u": "https://money.udn.com/money/story/11162/9668003", "s": "經濟日報", "d": "2026-08-03"}]}]}, "41": {"id": 41, "title": "醣聯GNX1021日本一期首位收案", "synthesis": "醣聯（4168）於8月3日宣布，GNX1021已在日本完成臨床一期首位受試者收案，代表該候選藥物正式進入人體臨床開發階段。本期試驗將於日本及台灣進行，研究對象為晚期實體腫瘤患者，主要評估安全性與耐受性，並觀察初步抗腫瘤活性。", "facts": ["8月3日宣布完成首位收案", "GNX1021進入人體臨床開發", "試驗地點為日本及台灣", "研究對象為晚期實體腫瘤患者", "評估安全性、耐受性及初步抗腫瘤活性"], "watch": "", "etype": "訂單產能", "codes": ["4168"], "n": 1, "subs": [{"t": "醣聯GNX1021完成一期首位收案", "arts": [{"t": "醣聯新世代 ADC 藥物 GNX1021一期臨床 完成首位受試者收案", "u": "https://money.udn.com/money/story/10871/9666928", "s": "經濟日報", "d": "2026-08-03"}]}]}, "42": {"id": 42, "title": "長聖7月營收增20.72%創年高", "synthesis": "長聖（6712）於8月3日公告，7月合併營收約9,925萬元，年增20.72%，創今年單月新高；累計1至7月營收約5.59億元，年增16.31%。其中一篇報導將累計營收增幅表述為約16%，數字略有不同。業務方面，CDMO業務受再生醫療需求帶動，CAR001已完成Phase I，並進入Phase IIa療效驗證試驗，完成首位受試者收治；公司另規劃申請CAR001用於膠質母細胞瘤的孤兒藥資格。", "facts": ["7月營收約9,925萬元", "7月營收年增20.72%", "累計1至7月營收約5.59億元", "累計營收年增16.31%", "CAR001完成Phase I", "CAR001進入Phase IIa試驗", "完成首位受試者收治", "規劃申請膠質母細胞瘤孤兒藥資格"], "watch": "留意CAR001 Phase IIa試驗進展及膠質母細胞瘤孤兒藥資格申請。", "etype": "財報", "codes": ["6712"], "n": 2, "subs": [{"t": "長聖7月營收增20.72%創年內新高", "arts": [{"t": "長聖7月營收創今年新高 CAR001二期啟動拚孤兒藥資格", "u": "https://www.ctee.com.tw/news/20260803701210-430504", "s": "工商時報", "d": "2026-08-03"}, {"t": "長聖營收／7月 年增20% 「CDMO＋新藥」雙引擎持續發酵", "u": "https://money.udn.com/money/story/11074/9667910", "s": "經濟日報", "d": "2026-08-03"}]}]}, "43": {"id": 43, "title": "亞德客第二季獲利年增63%", "synthesis": "亞德客-KY（1590）第二季營收為121.64億元，毛利率49.72％；稅後淨利達33.11億元，年增63％，每股盈餘16.55元。獲利成長表現獲美系外資正面看待，外資維持買進評等，並預估亞德客全年營收成長2成以上，同時將營業利益率預估上調至34％。本次報導重點涵蓋公司第二季財報表現，以及外資對全年營收與獲利率的最新預期。", "facts": ["第二季營收121.64億元", "第二季毛利率49.72％", "稅後淨利33.11億元，年增63％", "每股盈餘16.55元", "美系外資維持買進評等", "全年營收預估成長2成以上", "營業利益率上調至34％"], "watch": "", "etype": "財報", "codes": ["1590"], "n": 1, "subs": [{"t": "亞德客第二季獲利年增63%", "arts": [{"t": "《電機股》外資看好景氣上行 亞德客-KY喊衝", "u": "https://www.ctee.com.tw/news/20260803701029-430201", "s": "工商時報", "d": "2026-08-03"}]}]}, "44": {"id": 44, "title": "惠普（8424）減碳21.4%", "synthesis": "8月3日，國產（2504）旗下惠普（8424）表示，受產線整改及經濟部補助計畫挹注，年度碳排放量減少19,161噸，減碳比例達21.4%。公司同時指出，新建工程訂單占比持續攀升，目前掌握的專案涵蓋社會住宅、科技廠辦及新建醫院，顯示減碳進展與新建工程業務布局同步受到關注。", "facts": ["年度碳排減少19,161噸", "惠普（8424）減碳比例21.4%", "受產線整改及補助計畫挹注", "新建工程訂單占比持續攀升", "掌握社宅、科技廠辦及醫院專案"], "watch": "", "etype": "訂單產能", "codes": ["2504", "8424"], "n": 1, "subs": [{"t": "惠普減碳21.4%", "arts": [{"t": "國產小金雞惠普低碳、智慧製造雙升級 搶攻廠辦新商機", "u": "https://money.udn.com/money/story/5612/9666885", "s": "經濟日報", "d": "2026-08-03"}]}]}, "45": {"id": 45, "title": "愛普6月淨利增785% 標普Q2獲利增47.4%", "synthesis": "愛普（6531）公布6月淨利3.27億元，年增785%，單月EPS為2.01元，年增784%；摩根士丹利維持「優於大盤」評等，目標價1,555元。另一方面，《金融時報》報導，標普500指數成分企業第2季獲利預料年增47.4%，創近5年最佳；近9成企業財報優於預期，11大產業中有8個產業獲利呈兩位數成長，支撐美股維持高檔。", "facts": ["愛普（6531）6月淨利3.27億元", "愛普6月淨利年增785%", "愛普單月EPS 2.01元，年增784%", "摩根士丹利目標價1,555元", "標普500成分股Q2獲利預料增47.4%", "近9成企業財報優於預期"], "watch": "", "etype": "財報", "codes": ["6531"], "n": 2, "subs": [{"t": "愛普6月淨利增785%；標普Q2獲利增47.4%", "arts": [{"t": "這檔個股6月獲利狂飆7.8倍！外資喊股價漲幅還逾一倍", "u": "https://money.udn.com/money/story/5607/9667986", "s": "經濟日報", "d": "2026-08-03"}, {"t": "金融時報：標普500企業第2季獲利料增47%　創5年最佳", "u": "https://money.udn.com/money/story/5599/9667078", "s": "經濟日報", "d": "2026-08-03"}]}]}, "46": {"id": 46, "title": "捷迅上半年獲利增46% Q2年增1511%", "synthesis": "捷迅（2643）於2026年8月3日公布財報，上半年稅後純益9,766萬元，年增46.13%，每股盈餘2.79元。第二季營收19.55億元，稅後純益7,370萬元，每股稅後純益2.11元；其中一篇報導稱稅後純益為7,369.6萬元，兩者數字略有差異。第二季獲利受海空運旺季、運價調漲及空運貨量增加帶動，稅後純益年增1511%。公司預期2026年下半年，AI伺服器、半導體出貨及海空運供需失衡將推動海空運市場價量齊揚。", "facts": ["上半年純益9,766萬元，年增46.13%", "上半年每股盈餘2.79元", "Q2營收19.55億元", "Q2純益7,370萬元，年增1511%", "Q2每股稅後純益2.11元", "一篇報導稱Q2純益7,369.6萬元"], "watch": "留意2026年下半年AI伺服器、半導體出貨及海空運供需失衡是否帶動市場價量齊揚。", "etype": "財報", "codes": ["2643"], "n": 2, "subs": [{"t": "捷迅上半年獲利增46% Q2旺季爆發", "arts": [{"t": "捷迅財報／上半年獲利9,766萬元、年增46.13% 每股賺2.79元", "u": "https://money.udn.com/money/story/11074/9668345", "s": "經濟日報", "d": "2026-08-03"}, {"t": "海運價漲、空運量增 捷迅Q2每股賺2.11元、下半年展望佳", "u": "https://www.ctee.com.tw/news/20260803701580-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "47": {"id": 47, "title": "歐付寶獲准雙匯兌、2026Q4推移工App", "synthesis": "歐付寶（6878）取得金管會核准，經營兩項國外小額匯兌業務，預計於2026年第四季推出「O’PAY GLOBAL」，首波服務對象為越南、菲律賓及印尼籍移工。兩篇報導均指出，2025年台灣移工跨境匯款市場規模超過新台幣1,291億元，預估2029年將突破新台幣2,000億元。報導說法略有不同：第一篇稱歐付寶於2025年7月取得核准，並成為首家同時獲准經營兩項國外小額匯兌業務的電子支付機構；第二篇則稱其取得金管會核發的兩項國外小額匯兌執照。", "facts": ["2026年第四季推出「O’PAY GLOBAL」", "首波服務越南、菲律賓、印尼移工", "2025年市場規模超過新台幣1,291億元", "2029年市場預估突破新台幣2,000億元", "歐付寶（6878）獲准兩項國外小額匯兌", "2025年7月取得核准（第一篇說法）"], "watch": "留意2026年第四季「O’PAY GLOBAL」推出及首波移工服務進度。", "etype": "訂單產能", "codes": ["6878"], "n": 2, "subs": [{"t": "歐付寶2026年第四季推移工匯款App", "arts": [{"t": "《數雲端》歐付寶移工匯兌業務首波鎖定越南、菲律賓及印尼勞工", "u": "https://www.ctee.com.tw/news/20260803701343-430201", "s": "工商時報", "d": "2026-08-03"}, {"t": "歐付寶取得兩大執照 第四季推APP搶攻移工金融商機", "u": "https://www.ctee.com.tw/news/20260803701684-430502", "s": "工商時報", "d": "2026-08-03"}]}]}, "48": {"id": 48, "title": "晶心科攜LTSCT簽IP協議促RISC-V商業化", "synthesis": "8月3日，晶心科與L&TSemiconductor Technologies（LTSCT）簽署IP授權總體協議，合作方向是協助LTSCT加速開發及商業化RISC-V先進客製化半導體解決方案。協議包含3項主要目標，並建立涵蓋目前及未來IP授權合作的法律架構，作為雙方現有與後續IP授權合作的共同基礎。原文未進一步揭露3項目標的具體內容，也未提供授權IP項目、合作金額或商業化時程。", "facts": ["8月3日簽署IP授權總體協議", "合作對象為LTSCT", "聚焦RISC-V客製化方案", "協議包含3項主要目標", "建立目前及未來合作法律架構"], "watch": "", "etype": "業務合作", "codes": [], "n": 1, "subs": [{"t": "晶心科簽署IP協議3目標", "arts": [{"t": "晶心科與LTSCT簽署IP授權協議　助開發RISC-V方案", "u": "https://money.udn.com/money/story/11162/9667077", "s": "經濟日報", "d": "2026-08-03"}]}]}, "49": {"id": 49, "title": "喬山越南北寧廠投產年產值4億美元", "synthesis": "8月3日，喬山（1736）越南北寧廠落成啟用，總投資7,000萬美元，年產值可達4億美元。喬山規劃將原本在大陸生產、銷往美國的產品移往越南製造，並預計年底將北寧廠員工增至2,000人。公司同時訂下2028年營收突破千億元的目標，北寧廠投產將成為其海外產能布局的重要一環。", "facts": ["北寧廠總投資7,000萬美元", "年產值可達4億美元", "年底員工預計達2,000人", "大陸銷美產品移往越南生產", "喬山2028年營收拚破千億元"], "watch": "留意年底員工達2,000人的進度，以及2028年營收突破千億元目標。", "etype": "訂單產能", "codes": ["1736"], "n": 1, "subs": [{"t": "喬山北寧廠投產4億美元", "arts": [{"t": "全球最大健身器材製造基地喬山越南北寧廠落成啟用", "u": "https://money.udn.com/money/story/5612/9667658", "s": "經濟日報", "d": "2026-08-03"}]}]}, "50": {"id": 50, "title": "台灣虛資產、化粧品與歐盟AI新制加重法遵", "synthesis": "立法院6月30日三讀通過《虛擬資產服務法》，虛擬資產服務業（VASP）改採事前許可制，納入資本額、內控、客戶資產分離保管及穩定幣發行規範；已登記業者須在一年內向金管會申請許可，非法經營最高可處七年以下有期徒刑及1億元罰金。化粧品PIF制度自7月起全面適用，所有化粧品上市前須建立包含16項法定文件的產品資訊檔案，未建檔或無法提供查核且限期未改善者，可處新台幣1萬元至100萬元罰鍰。歐盟AI法第一階段於8月2日生效，要求聊天機器人、深偽技術及AI生成內容加註標籤，並告知消費者正與AI互動；違規科技公司最高面臨前一年度全球總營業額3%或1,500萬歐元罰款，企業並憂心法遵成本及執行碎片化。", "facts": ["VASP改採事前許可制", "非法經營最高罰1億元", "PIF須含16項法定文件", "PIF違規最高罰100萬元", "歐盟AI法8月2日第一階段生效", "AI違規最高罰全球營收3%"], "watch": "留意已登記VASP一年內向金管會申請許可，以及7月起PIF查核與歐盟AI法生效後的執行。", "etype": "總經政策", "codes": [], "n": 3, "subs": [{"t": "化粧品PIF制度7月全面實施", "arts": [{"t": "PIF上路國際品牌占優勢？鄭圭雯：台灣品牌迎來全新機會", "u": "https://money.udn.com/money/story/11799/9667465", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "歐盟AI法上路罰款3%", "arts": [{"t": "歐盟 AI 法掀「通知轟炸」疑慮 外界憂心會重演「cookie跳出時刻」亂象", "u": "https://money.udn.com/money/story/5599/9666495", "s": "經濟日報", "d": "2026-08-03"}]}, {"t": "虛擬資產法設最高1億元罰金", "arts": [{"t": "新聞中的法律／布局虛擬資產業務 三個考量", "u": "https://money.udn.com/money/story/6710/9666441", "s": "經濟日報", "d": "2026-08-03"}]}]}, "51": {"id": 51, "title": "統一佳佳9月停健身、會員轉籍", "synthesis": "統一集團（1216）旗下統一佳佳董事會決議，BEING sport與BEING fit將於2026年9月3日停止健身俱樂部及健身房服務，實際營運至2026年9月2日晚間11時。統一集團於2026年8月3日宣布退出健身市場，資源將轉向Spa，BEING Spa維持營運，並與健身工廠合作承接會員。會員可選擇轉入健身工廠或辦理退費；其中一篇報導指出，退費須於2026年9月2日前完成，健身工廠則於2026年8月3日至9日提供轉籍方案。另有報導指出，統一佳佳上半年稅後虧損新台幣7351.4萬元，較去年同期擴大約12.5%，該數字涵蓋整體營運。", "facts": ["2026年9月3日停止健身服務", "實際營運至2026年9月2日23時", "統一集團（1216）8月3日退出健身市場", "會員可轉入健身工廠或退費", "健身工廠8月3日至9日供轉籍", "上半年稅後虧損7351.4萬元", "虧損較去年同期擴大約12.5%"], "watch": "留意2026年9月2日前退費期限，以及2026年9月3日健身服務停止與會員轉籍安排。", "etype": "公司治理", "codes": ["1216"], "n": 4, "subs": [{"t": "統一佳佳9月3日停健身、會員可轉籍", "arts": [{"t": "統一佳佳健身系列BEING sport、BEING fit 下月結束營運", "u": "https://www.ctee.com.tw/news/20260803701308-430503", "s": "工商時報", "d": "2026-08-03"}, {"t": "統一佳佳退出健身房　逾20年品牌9月結束服務", "u": "https://money.udn.com/money/story/5612/9668118", "s": "經濟日報", "d": "2026-08-03"}, {"t": "統一健身事業退場！BEING sport、fit 9月停止服務 會員轉健身工廠", "u": "https://money.udn.com/money/story/5612/9667997", "s": "經濟日報", "d": "2026-08-03"}, {"t": "統一集團退出健身市場 會員可轉至健身工廠", "u": "https://www.ctee.com.tw/news/20260803701806-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "52": {"id": 52, "title": "CMMC強制供應鏈落實110項資安控制", "synthesis": "CMMC已於2025年9月正式立法通過，並強制各供應鏈廠商執行相關資安要求。核心技術供應鏈通常需符合Level 2，依據NIST SP 800-171建立110項資安控制措施。這套要求因此成為廠商承接美國國防合約的重要門檻，供應鏈業者需據此完善控制措施以符合合約要求。", "facts": ["CMMC於2025年9月正式立法通過", "核心技術供應鏈通常需符合Level 2", "依NIST SP 800-171建立110項控制", "CMMC是承接美國國防合約門檻"], "watch": "留意核心技術供應鏈符合Level 2及執行110項控制措施的情形", "etype": "總經政策", "codes": [], "n": 1, "subs": [{"t": "CMMC要求供應鏈執行110項控制", "arts": [{"t": "Blue UAS 到 CMMC臺灣無人載具產業 邁向國際國防供應鏈的新門票", "u": "https://www.ctee.com.tw/news/20260803701421-431203", "s": "工商時報", "d": "2026-08-03"}]}]}, "53": {"id": 53, "title": "全新磷化銦需求旺、Q3出貨轉強", "synthesis": "全新（2455）受惠AI資料中心帶動磷化銦需求暢旺，近期已取得AXT基板料源，並開始量產出貨，市場預期第3季磊晶出貨動能將明顯轉強。價格方面，全新第2季二度調漲磊晶價格，兩次單次漲幅均達雙位數。股價於8月3日上漲29元，收在321元，反映市場對需求與出貨改善的關注。", "facts": ["全新（2455）8月3日漲29元至321元", "取得AXT基板料源並開始量產出貨", "第3季磊晶出貨動能預期轉強", "第2季二度調漲磊晶價格", "兩次單次漲幅均為雙位數"], "watch": "留意第3季磊晶出貨動能是否明顯轉強。", "etype": "訂單產能", "codes": ["2455"], "n": 1, "subs": [{"t": "全新股價漲停上漲29元", "arts": [{"t": "磷化銦磊晶需求暢旺 全新早盤衝上漲停", "u": "https://money.udn.com/money/story/5607/9667277", "s": "經濟日報", "d": "2026-08-03"}]}]}, "54": {"id": 54, "title": "華孚7月營收回升、毅嘉創歷史新高", "synthesis": "華孚（6235）與毅嘉（2402）均公布7月營收，但表現分化。華孚於8月2日公布營收5.5億元，為六個月來最佳，月增2.3%、年增1.9%，前七月累計37.66億元；公司指出戰爭、關稅及電動車低價搶市，對短期營運造成挑戰，正調整策略強化競爭力。毅嘉7月營收11.67億元，月增2.8%、年增24%，創歷史新高，前七月累計72.48億元、年增17%；公司表示車用、消費性電子及光通訊需求強勁，馬來西亞新廠產能逐步開出，預期下半年營運攀高峰。", "facts": ["華孚7月營收5.5億元", "華孚前七月營收37.66億元", "毅嘉7月營收11.67億元", "毅嘉7月營收創歷史新高", "毅嘉前七月營收年增17%", "毅嘉馬來西亞新廠產能開出"], "watch": "留意馬來西亞新廠產能逐步開出後，下半年營運是否攀高峰。", "etype": "財報", "codes": ["2402", "6235"], "n": 2, "subs": [{"t": "華孚、毅嘉7月營收一強一創高", "arts": [{"t": "華孚7月業績月增2.3% 六個月來最佳", "u": "https://money.udn.com/money/story/5710/9666310", "s": "經濟日報", "d": "2026-08-03"}, {"t": "毅嘉7月業績創新高 車用、消費性電子需求強勁是主因", "u": "https://money.udn.com/money/story/5710/9666308", "s": "經濟日報", "d": "2026-08-03"}]}]}, "55": {"id": 55, "title": "王品三大鐵板燒品牌2027年展店10家", "synthesis": "王品（2727）旗下夏慕尼、阪前鐵板燒及就饗鐵板燒將同步展店，三大品牌2027年合計目標約10家。其中，夏慕尼預計在2027年12月31日前新增宜蘭、新店及頭份三家門市。王品鐵板燒事業群2026年營收可望年增約6%，占集團營收超過兩成，顯示該事業群在集團營運中的比重已具一定規模。", "facts": ["王品（2727）2027年展店約10家", "夏慕尼將新增宜蘭、新店、頭份", "鐵板燒事業群營收年增約6%", "鐵板燒事業群占營收逾兩成"], "watch": "留意夏慕尼在2027年12月31日前新增三店的進度。", "etype": "訂單產能", "codes": ["2727"], "n": 1, "subs": [{"t": "王品鐵板燒明年展店10家", "arts": [{"t": "王品鐵板燒事業 擴大展店", "u": "https://money.udn.com/money/story/5710/9666300", "s": "經濟日報", "d": "2026-08-03"}]}]}, "56": {"id": 56, "title": "久舜營造上半年獲利年減29%", "synthesis": "久舜營造（5547）於8月3日公告，上半年稅後淨利為5,484萬元，較去年同期減少29.44%，每股盈餘（EPS）為1.10元。營運方面，國揚集團（2505）汐止商辦開發案合約金額達55億元， <script>const PAGE="2026-08-03";const XDATE={};
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.clusters, E = DATA.edges;
const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
      <span class="chip">已讀 ${seen.size}/${Object.keys(C).length}</span></div>
    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';
  renderGrid();
}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
