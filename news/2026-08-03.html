ttps://www.ctee.com.tw/news/20260803701519-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "17": {"id": 17, "title": "昇陽半導體Q2淨利3億元、Q3估續增", "synthesis": "昇陽半導體（8028）第2季營收14.2億元，稅後淨利3億元，每股純益1.71元，毛利率約37.7%。市場預估第3季營收將升至16.5億元、每股純益達2元，顯示獲利表現可望延續。產能方面，公司預期持續擴充台中一廠，台中二廠則預計於後年開出；原文未提供相對應的絕對日期，後續應觀察擴產與新廠進度是否符合規劃。", "facts": ["Q2營收14.2億元", "Q2稅後淨利3億元", "Q2 EPS為1.71元", "Q2毛利率約37.7%", "市場估Q3營收16.5億元", "市場估Q3 EPS為2元", "台中一廠持續擴產", "台中二廠後年開出"], "watch": "留意台中一廠擴產及台中二廠開出進度。", "etype": "財報", "codes": ["8028"], "n": 1, "subs": [{"t": "昇陽半導體Q2淨利3億元", "arts": [{"t": "昇陽半 二檔放閃", "u": "https://money.udn.com/money/story/5739/9666600", "s": "經濟日報", "d": "2026-08-03"}]}]}, "18": {"id": 18, "title": "江申Q2獲利逾5,000萬、上半年仍虧損", "synthesis": "江申（1525）於8月3日公布上半年財報，營收6.34億元，年增11.14％，但稅後虧損983萬元。單季表現有所改善，第二季稅後純益逾5,000萬元。業務方面，江申電動大巴車架在手訂單突破1,000輛，出貨量可望成長逾6成，後續營收與獲利表現仍須觀察相關訂單的出貨進度。", "facts": ["上半年營收6.34億元", "上半年營收年增11.14％", "上半年稅後虧損983萬元", "第二季稅後純益逾5,000萬元", "電動大巴車架訂單突破1,000輛", "出貨可望成長逾6成"], "watch": "留意電動大巴車架出貨是否成長逾6成", "etype": "財報", "codes": ["1525"], "n": 1, "subs": [{"t": "江申Q2稅後賺5,000萬", "arts": [{"t": "江申Q2稅後賺5,000萬 樂觀今年電巴車架出貨動能", "u": "https://www.ctee.com.tw/news/20260803701597-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "19": {"id": 19, "title": "大汽電上半年EPS0.73元，推進天然氣與AI用電", "synthesis": "大汽電（8931）董事會通過上半年財報，前六月營收13.04億元，營業利益1.15億元，稅後純益0.89億元，EPS為0.73元。公司後續將提升機組效率，降低修繕與故障成本，並擴大低碳燃料使用；同時推動天然氣機組及AI算力中心用電客戶，以強化營收與獲利表現。", "facts": ["前六月營收13.04億元", "營業利益1.15億元", "稅後純益0.89億元", "上半年EPS 0.73元", "推動天然氣機組及AI算力中心用電客戶"], "watch": "後續留意天然氣機組及AI算力中心用電客戶的推動進展。", "etype": "財報", "codes": ["8931"], "n": 1, "subs": [{"t": "大汽電上半年EPS達0.73元", "arts": [{"t": "大汽電上半年EPS 0.73元 四策略提振收益能量", "u": "https://www.ctee.com.tw/news/20260803701516-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "20": {"id": 20, "title": "捷迅上半年純益增46% Q2暴增1511%", "synthesis": "捷迅（2643）於2026年8月3日公布，上半年稅後純益9,766萬元，年增46.13%，每股盈餘2.79元。第二季營收19.55億元，稅後純益約7,370萬元，每股稅後純益2.11元；另一篇報導列示稅後純益7,369.6萬元，屬四捨五入差異，並稱年增1511%。公司表示，第二季受海空運旺季、運價調漲及空運貨量增加帶動。展望2026年下半年，AI伺服器與半導體出貨，加上海空運供需失衡，海空運市場可望價量齊揚。", "facts": ["上半年純益9,766萬元，年增46.13%", "上半年每股盈餘2.79元", "Q2營收19.55億元", "Q2純益約7,370萬元，年增1511%", "Q2每股稅後純益2.11元", "2026年下半年海空運可望價量齊揚"], "watch": "留意2026年下半年AI伺服器與半導體出貨、海空運供需失衡及市場價量變化。", "etype": "財報", "codes": ["2643"], "n": 2, "subs": [{"t": "捷迅上半年純益增46% Q2獲利暴增", "arts": [{"t": "捷迅財報／上半年獲利9,766萬元、年增46.13% 每股賺2.79元", "u": "https://money.udn.com/money/story/11074/9668345", "s": "經濟日報", "d": "2026-08-03"}, {"t": "海運價漲、空運量增 捷迅Q2每股賺2.11元、下半年展望佳", "u": "https://www.ctee.com.tw/news/20260803701580-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "21": {"id": 21, "title": "晶采Q2獲利增70.1%至6,199萬", "synthesis": "晶采（8049）第2季合併營收3.62億元，季增27%、年增12.5%；稅後純益6,199萬元，年增70.1%，每股純益0.53元。累計上半年，晶采（8049）稅後純益1.15億元，年增25.7%。公司持續拓展工控、特殊車輛及醫療器材等應用市場，相關市場布局為後續營運重點。", "facts": ["Q2營收3.62億元，季增27%", "Q2稅後純益6,199萬元", "Q2每股純益0.53元", "上半年純益1.15億元，年增25.7%", "持續拓展工控、特殊車輛及醫療器材"], "watch": "", "etype": "財報", "codes": ["8049"], "n": 1, "subs": [{"t": "晶采第2季獲利增70.1%", "arts": [{"t": "晶采工控、醫材應用報捷", "u": "https://money.udn.com/money/story/11074/9666312", "s": "經濟日報", "d": "2026-08-03"}]}]}, "22": {"id": 22, "title": "輔信上半年轉盈，Q2獲利季增679%", "synthesis": "輔信（2405）公布2025年上半年財務表現，稅後純益935.5萬元、每股純益（EPS）0.03元，較去年同期由虧轉盈。第2季稅後純益829.1萬元，季增679%，EPS同為0.03元；營收則達4.81億元，年增18.3%，創近16個季度新高。單季獲利占上半年獲利逾八成，為上半年轉盈的主要表現。", "facts": ["上半年稅後純益935.5萬元", "上半年EPS為0.03元", "第2季獲利829.1萬元", "第2季獲利季增679%", "第2季營收4.81億元", "第2季營收年增18.3%"], "watch": "", "etype": "財報", "codes": ["2405"], "n": 1, "subs": [{"t": "輔信上半年轉盈賺935.5萬元", "arts": [{"t": "輔信財報／第2季每股賺0.03元 帶動上半年同步轉盈", "u": "https://money.udn.com/money/story/5710/9668221", "s": "經濟日報", "d": "2026-08-03"}]}]}, "23": {"id": 23, "title": "旭源上半年營收年增14.9%", "synthesis": "旭源（8421）6月合併營收為1.32億元，年增46.6%，創單月歷史新高；上半年合併營收達6.67億元，年增14.9%。面對塑化原物料成本上揚，公司自4月起調漲積層袋及收縮膜報價5%至10%，以反映成本壓力。法人估計，旭源全年營收可望維持雙位數成長，並有望轉虧為盈。", "facts": ["6月營收1.32億元，年增46.6%", "6月營收創單月歷史新高", "上半年營收6.67億元，年增14.9%", "4月起報價調漲5%至10%", "法人估全年營收雙位數增", "公司有望轉虧為盈"], "watch": "留意4月起報價調漲5%至10%後的營收及獲利表現。", "etype": "財報", "codes": ["8421"], "n": 1, "subs": [{"t": "旭源上半年營收年增14.9%", "arts": [{"t": "旭源全年營收看增雙位數", "u": "https://money.udn.com/money/story/11074/9666303", "s": "經濟日報", "d": "2026-08-03"}]}]}, "24": {"id": 24, "title": "暄達上半年轉盈EPS 0.29元、營收增27%", "synthesis": "暄達（7726）公告上半年合併營收1.93億元，年增27.01%；稅後淨利593萬元，每股稅後盈餘（EPS）0.29元，較去年同期轉盈。公司兩大主力產品業績均成長，其中交替式減壓氣墊床業績年增33%。", "facts": ["上半年營收1.93億元", "營收年增27.01%", "稅後淨利593萬元", "EPS 0.29元，較去年同期轉盈", "交替式減壓氣墊床年增33%"], "watch": "", "etype": "財報", "codes": ["7726"], "n": 1, "subs": [{"t": "暄達上半年EPS 0.29元", "arts": [{"t": "暄達財報／上半年 EPS 0.29元 較去年同期轉虧為盈", "u": "https://money.udn.com/money/story/11074/9668130", "s": "經濟日報", "d": "2026-08-03"}]}]}, "25": {"id": 25, "title": "長聖7月營收增逾兩成創新高", "synthesis": "長聖（6712）於8月3日公告，7月合併營收約9,925萬元，創今年單月新高；兩篇報導對年增率的表述略有差異，分別為20.7%與20.72%。累計1至7月營收約5.59億元，年增率則分別為約16%與16.31%。業務進展方面，CDMO營收受再生醫療需求帶動；CAR001已完成Phase I，並進入Phase IIa療效驗證試驗，且已完成首位受試者收治。長聖另規劃申請CAR001用於膠質母細胞瘤的孤兒藥資格。", "facts": ["7月營收約9,925萬元創今年新高", "7月年增率20.7%或20.72%", "累計1至7月營收約5.59億元", "累計年增約16%或16.31%", "CAR001完成Phase I進入Phase IIa", "CAR001完成首位受試者收治", "規劃申請膠質母細胞瘤孤兒藥資格"], "watch": "", "etype": "財報", "codes": ["6712"], "n": 2, "subs": [{"t": "長聖7月營收增逾兩成創高", "arts": [{"t": "長聖7月營收創今年新高 CAR001二期啟動拚孤兒藥資格", "u": "https://www.ctee.com.tw/news/20260803701210-430504", "s": "工商時報", "d": "2026-08-03"}, {"t": "長聖營收／7月 年增20% 「CDMO＋新藥」雙引擎持續發酵", "u": "https://money.udn.com/money/story/11074/9667910", "s": "經濟日報", "d": "2026-08-03"}]}]}, "26": {"id": 26, "title": "擎邦上半年純益1.67億元年減2.93%", "synthesis": "擎邦（6122）董事會於8月3日通過第2季財報。第2季單季稅後純益8,875.9萬元，年增5.6%，每股稅後純益1.16元。累計上半年合併營收18.75億元，年減5.06%；稅後純益1.67億元，年減2.93%，每股稅後純益2.19元。整體而言，擎邦第2季獲利仍較去年同期成長，但上半年營收與稅後純益均較去年同期下滑。", "facts": ["8月3日通過第2季財報", "第2季稅後純益8,875.9萬元", "第2季EPS 1.16元", "上半年營收18.75億元", "上半年純益1.67億元、年減2.93%", "上半年EPS 2.19元"], "watch": "", "etype": "財報", "codes": ["6122"], "n": 1, "subs": [{"t": "擎邦上半年獲利1.67億元", "arts": [{"t": "擎邦財報／上半年獲利1.67億元較去年同期衰退 每股賺2.19元", "u": "https://money.udn.com/money/story/11074/9668295", "s": "經濟日報", "d": "2026-08-03"}]}]}, "27": {"id": 27, "title": "中磊營收拚增47%下半年創高", "synthesis": "中磊（5388）6月及第2季營收同步創下歷史新高，法人看好新產品將於下半年陸續出貨，帶動下半年及第3季營收再創新高。公司預期今年訂單無虞，全年營收成長47%，稅後純益成長幅度可望逾六成；不過，記憶體等零組件成本走揚，可能影響獲利表現，後續仍須觀察成本變化與新產品出貨進度。", "facts": ["中磊6月、第2季營收創歷史新高", "全年營收預期成長47%", "稅後純益可望成長逾六成", "新產品下半年陸續出貨", "記憶體等零組件成本走揚"], "watch": "留意下半年新產品陸續出貨及第3季營收是否再創新高。", "etype": "財報", "codes": ["5388"], "n": 1, "subs": [{"t": "中磊全年營收成長47%", "arts": [{"t": "中磊獲利喊衝", "u": "https://money.udn.com/money/story/5710/9666296", "s": "經濟日報", "d": "2026-08-03"}]}]}, "28": {"id": 28, "title": "豐達科7月營收增53%、上半年EPS創高", "synthesis": "豐達科（3004）於2026年8月2日公布，2026年7月合併營收4.94億元，年增53.03%、月減0.65%，為單月歷史次高；前七月累計營收30.84億元，年增37.31%，續創同期新高。2026年第二季EPS為2.09元、上半年EPS為4.01元，均創歷史新高；上半年營收25.90億元、稅後淨利2.58億元。公司訂單能見度約1.5至2年，法人認為航太需求復甦及供應鏈景氣向上，豐達科營運可望延續成長。", "facts": ["7月營收4.94億元，年增53.03%", "前七月營收30.84億元，年增37.31%", "上半年EPS 4.01元創歷史新高", "上半年營收25.90億元", "上半年稅後淨利2.58億元", "訂單能見度約1.5至2年"], "watch": "留意航太需求復甦及供應鏈景氣向上能否延續成長。", "etype": "財報", "codes": ["3004"], "n": 2, "subs": [{"t": "豐達科7月營收增53%且上半年EPS創高", "arts": [{"t": "《鋼鐵股》豐達科摔2個月低價 Q2、H1每股盈餘雙創高", "u": "https://www.ctee.com.tw/news/20260803701285-430201", "s": "工商時報", "d": "2026-08-03"}, {"t": "豐達科上月績增53%", "u": "https://money.udn.com/money/story/5710/9666304", "s": "經濟日報", "d": "2026-08-03"}]}]}, "29": {"id": 29, "title": "愛普（6531）6月淨利年增785%", "synthesis": "愛普（6531）6月淨利達3.27億元，較去年同期增加785%，單月每股盈餘（EPS）為2.01元，年增784%。在這項月度獲利數據下，摩根士丹利維持對愛普「優於大盤」的評等，目標價維持1,555元。此次資訊聚焦於愛普6月淨利與單月EPS同步大幅成長，以及摩根士丹利對公司後續表現的原有正面評價；提供內容未提及其他月份或季度數字，也未提供後續財報發布日期。", "facts": ["愛普（6531）6月淨利3.27億元", "6月淨利年增785%", "單月EPS 2.01元，年增784%", "摩根士丹利維持優於大盤", "目標價1,555元"], "watch": "", "etype": "財報", "codes": ["6531"], "n": 1, "subs": [{"t": "愛普6月淨利年增785%", "arts": [{"t": "這檔個股6月獲利狂飆7.8倍！外資喊股價漲幅還逾一倍", "u": "https://money.udn.com/money/story/5607/9667986", "s": "經濟日報", "d": "2026-08-03"}]}]}, "30": {"id": 30, "title": "十銓上半年EPS53.44元創高", "synthesis": "十銓（4967）董事會通過2026年第二季財報，單季營收75.88億元、EPS26.47元；累計2026年上半年營收166.33億元、E 6億或1.05億", "截至6月30日全品牌77店"], "watch": "", "etype": "財報", "codes": ["7708"], "n": 2, "subs": [{"t": "全家餐飲上半年EPS4.15元創新高", "arts": [{"t": "全家餐飲財報／第2季 EPS 2.23元創新高 上半年4.15元創同期新高", "u": "https://money.udn.com/money/story/11074/9668297", "s": "經濟日報", "d": "2026-08-03"}, {"t": "全家國際餐飲上半年EPS 4.15元 創歷年同期新高", "u": "https://www.ctee.com.tw/news/20260803701510-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "34": {"id": 34, "title": "第一銅上半年獲利1.75億元、EPS0.49元", "synthesis": "第一銅（2009）於8月3日公布上半年財報，合併營收16.91億元，年增20.62％；稅後純益1.75億元，EPS為0.49元。公司業績受國際銅價上升、AI與高端連接器需求，以及棄銀轉銅趨勢帶動。不過，下半年高價原料庫存增加，可能壓縮加工利差，後續獲利表現仍受原料成本與銅價變化影響。", "facts": ["上半年營收16.91億元", "上半年營收年增20.62％", "稅後純益1.75億元", "EPS為0.49元", "AI與高端連接器需求帶動", "棄銀轉銅推升業績"], "watch": "留意下半年高價原料庫存增加對加工利差的壓縮。", "etype": "財報", "codes": ["2009"], "n": 1, "subs": [{"t": "第一銅上半年賺0.49元", "arts": [{"t": "第一銅上半年每股賺0.49元", "u": "https://www.ctee.com.tw/news/20260803701645-430503", "s": "工商時報", "d": "2026-08-03"}]}]}, "35": {"id": 35, "title": "華孚7月營收5.5億元、六個月新高", "synthesis": "華孚（6235）於8月2日公布7月營收5.5億元，創六個月來最佳，月增2.3%、年增1.9%。累計前七月營收37.66億元。公司表示，戰爭、關稅及電動車低價搶市，正對短期營運造成挑戰，因而調整策略以強化競爭力。本次營收雖較前月與去年同期均成長，但公司仍須面對外部環境與市場價格競爭壓力。", "facts": ["7月營收5.5億元，六個月最佳", "7月營收月增2.3%", "7月營收年增1.9%", "前七月累計營收37.66億元", "華孚（6235）調整策略強化競爭力"], "watch": "留意戰爭、關稅及電動車低價搶市影響，以及策略調整成效。", "etype": "財報", "codes": ["6235"], "n": 1, "subs": [{"t": "華孚7月營收5.5億元", "arts": [{"t": "華孚7月業績月增2.3% 六個月來最佳", "u": "https://money.udn.com/money/story/5710/9666310", "s": "經濟日報", "d": "2026-08-03"}]}]}, "36": {"id": 36, "title": "晶碩7月營收增17%累計續揚", "synthesis": "晶碩（6491）7月合併營收7.46億元，年增17.42%；累計前七月營收47.46億元，年增23.1%，延續今年營收成長表現。公司於7月31日公布上半年淨利10.17億元、每股盈餘（EPS）13.13元。法人估計，晶碩今年營收可突破85億元，明年則挑戰100億元，後續市場將關注營收成長能否支撐上述年度目標。", "facts": ["7月營收7.46億元，年增17.42%", "前七月營收47.46億元，年增23.1%", "上半年淨利10.17億元", "上半年EPS 13.13元", "法人估今年營收突破85億元", "法人估明年營收挑戰100億元"], "watch": "留意今年營收突破85億元及明年挑戰100億元的目標。", "etype": "財報", "codes": ["6491"], "n": 1, "subs": [{"t": "晶碩7月營收7.46億元", "arts": [{"t": "晶碩半報、7月營收雙喜 股價奔漲停 法人估明年挑戰賺三個股本", "u": ", "u": "https://money.udn.com/money/story/11162/9668003", "s": "經濟日報", "d": "2026-08-03"}]}]}, "77": {"id": 77, "title": "惠普減碳21.4%並拓展新建工程", "synthesis": "8月3日，國產（2504）旗下惠普（8424）表示，受產線整改及經濟部補助計畫挹注，年度碳排放量減少19,161噸，減碳比例達21.4%。業務方面，惠普新建工程訂單占比持續攀升，目前掌握的專案涵蓋社會住宅、科技廠辦及新建醫院，顯示其訂單布局聚焦於多類型新建工程。", "facts": ["年度碳排減少19,161噸", "惠普減碳比例達21.4%", "國產（2504）旗下惠普（8424）", "新建工程訂單占比持續攀升", "掌握社宅、科技廠辦、醫院專案"], "watch": "留意新建工程訂單占比持續攀升情況", "etype": "訂單產能", "codes": ["2504", "8424"], "n": 1, "subs": [{"t": "惠普減碳21.4%", "arts": [{"t": "國產小金雞惠普低碳、智慧製造雙升級 搶攻廠辦新商機", "u": "https://money.udn.com/money/story/5612/9666885", "s": "經濟日報", "d": "2026-08-03"}]}]}, "78": {"id": 78, "title": "建新國際30億元冷鏈中心啟用並擴建", "synthesis": "建新國際（8367）旗下新科智慧國際物流中心於8月3日在台北港揭牌啟用，投入30億元打造冷鏈倉儲，提供保稅倉儲、多溫層冷鏈及海空聯運服務，客戶鎖定AI供應鏈、半導體、電子材料與高值化溫控貨品。報導稱其為北台灣最大面積冷鏈倉儲，另有報導稱該中心已躍居前二大。第二期冷鏈擴建預計8月啟動申請，目標年底前啟用；法人估計，第二期在2027年可貢獻營收3億～4.5億元，毛利率至少3成。", "facts": ["建新國際（8367）投入30億元", "物流中心8月3日在台北港啟用", "鎖定AI供應鏈與半導體", "第二期預計8月啟動申請", "第二期目標年底前啟用", "2027年估貢獻營收3億～4.5億元", "法人估毛利率至少3成"], "watch": "留意8月第二期擴建申請及年底前啟用進度。", "etype": "訂單產能", "codes": ["8367"], "n": 4, "subs": [{"t": "建新國際30億元物流中心啟用並擴建", "arts": [{"t": "建新國際「新科智慧物流中心」今啟用 輝達、亞馬遜等大咖客戶進駐", "u": "https://www.ctee.com.tw/news/20260803701485-430503", "s": "工商時報", "d": "2026-08-03"}, {"t": "《航運股》建新國際新科物流中心啟用 鎖定AI商機", "u": "https://www.ctee.com.tw/news/20260803701292-430201", "s": "工商時報", "d": "2026-08-03"}, {"t": "建新「新科智慧國際物流中心」揭牌！搶攻 AI 產業鏈與高值化物流商機", "u": "https://money.udn.com/money/story/5612/9667890", "s": "經濟日報", "d": "2026-08-03"}, {"t": "搶攻AI產業鏈物流商機　建新台北港物流中心揭牌", "u": "https://money.udn.com/money/story/5612/9667863", "s": "經濟日報", "d": "2026-08-03"}]}]}, "79": {"id": 79, "title": "和泰車7月市占41.6%及和運租車掛牌", "synthesis": "台灣車市7月總市場登錄38,657台，年增8.9%；前7月累計240,935台，另有報導寫為「24萬0935台」，年增2.8%。和泰車旗下TOYOTA、LEXUS合計登錄16,071台，市占率41.6%，年增18%。7月掛牌量低於業者原先預估的4.2萬輛，但市場將全年銷量預估上修至43萬台。受農曆民俗月影響，和泰車預估8月台灣車市規模為28,000台，另有報導指出將較去年減少5%。此外，和泰車（2207）旗下和運租車競價拍賣超額認購1.88倍，得標加權平均價格每股47.11元，高於公開申購承銷價42元，預計8月11日掛牌上市；車美仕則深化汽車用品、GR改裝及海 <script>const PAGE="2026-08-03";const XDATE={};
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.clusters, E = DATA.edges;
const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>

    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';

}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
