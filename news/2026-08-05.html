資占GDP超過40％", "中國經濟增速僅4％到5％"], "watch": "留意各國提高關稅壁壘的進展，以及中國服務業新業務與企業信心變化。", "etype": "產業供需", "codes": ["00892"], "n": 3, "subs": [{"t": "台灣製造業PMI升至61.5", "arts": [{"t": "台股科技ETF十強 今年漲逾6成", "u": "https://www.ctee.com.tw/news/20260805700324-430403", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "中國服務業PMI降至50.4", "arts": [{"t": "標普7月份大陸服務業PMI大降至50.4", "u": "https://www.ctee.com.tw/news/20260805700814-430803", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "中國投資占GDP超過40％", "arts": [{"t": "陸GDP虛胖？IMF揭「過度投資」真相 德企憂營運前景", "u": "https://www.ctee.com.tw/news/20260805700811-430801", "s": "工商時報", "d": "2026-08-05"}]}]}, "9": {"id": 9, "title": "美軍彈藥近耗盡，台美擬推140億軍售", "synthesis": "CNN於8月4日報導，美軍在與伊朗持續5個月的戰爭中，已消耗近80%的THAAD攔截彈，愛國者攔截彈庫存也大幅下降；另一篇報導估計，愛國者飛彈消耗量約達一半。路透引述3名知情人士稱，ATACMS與PrSM已耗用全球庫存大部分，甚至「幾乎全部」，美軍也幾乎耗盡高精準度長程地對空武器，可能削弱對俄羅斯與中國大陸的嚇阻能力。彈藥短缺及盟國對伊朗報復的擔憂，促使川普暫緩原定8月1日的大規模打擊；CSIS估計，THAAD恢復戰前庫存可能需超過3年。賴清德4日表示期待台美合作由軍事採購走向共同研發與生產；麥考爾則稱，美國總統很快將向國會提交140億美元防衛軍備方案，並擴大無人機共同生產。", "facts": ["THAAD攔截彈消耗近80%", "愛國者飛彈消耗量估約一半", "ATACMS、PrSM耗用全球庫存大部分", "THAAD恢復戰前庫存需超過3年", "美國擬提140億美元防衛方案", "台美將擴大無人機共同生產"], "watch": "留意美國總統何時向國會提交140億美元方案，以及THAAD庫存恢復是否需超過3年。", "etype": "地緣政治", "codes": [], "n": 4, "subs": [{"t": "美軍五個月耗盡近八成THAAD", "arts": [{"t": "CNN：薩德攔截彈近8成耗盡 川普大規模轟伊朗臨陣喊停內幕曝光", "u": "https://money.udn.com/money/story/5599/9671366", "s": "經濟日報", "d": "2026-08-05"}, {"t": "美伊開戰5個月！美軍2款長程飛彈傳「幾乎全用掉」 恐削弱嚇阻中俄", "u": "https://money.udn.com/money/story/5599/9671325", "s": "經濟日報", "d": "2026-08-05"}, {"t": "伊朗戰事耗近8成THAAD　美軍防空飛彈庫存告急", "u": "https://money.udn.com/money/story/5599/9671877", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "美國擬提140億美元軍售案", "arts": [{"t": "賴總統：台美深化軍購合作", "u": "https://www.ctee.com.tw/news/20260805700125-430101", "s": "工商時報", "d": "2026-08-05"}]}]}, "10": {"id": 10, "title": "美國擬鎖多晶矽與鎢，中鋼9月盤價看平", "synthesis": "川普政府歷時約一年的調查後，準備依第232條款對多晶矽及相關下游產品採最低進口價格與關稅並行制度，目標是保護美國多晶矽工廠、扶植本土產能，並抗衡中國大陸在太陽能與晶片供應鏈的競爭；路透報導相關決定預料於8月稍後公布。中國大陸約占全球太陽能產品製造產能80%，半導體產業約占全球多晶矽需求2.4%。原物料政策同時延伸至鎢，美國將自8月稍晚起禁止出口鎢廢料及黑粉，材料須優先在國內出 title": "威加疑混充苦茶油；印度商船遇襲14人獲救", "synthesis": "威加國際疑進口大陸劣質苦茶籽，混充台灣原料製油，永豐餘生技等品牌苦茶油被驗出苯駢芘超標。調查局於8月4日搜索並約談7人，一篇報導稱5人深夜移送台北地檢署；台北地檢署進一步認定陳沅農、陳鐘秀惠涉製作假油，依違反食安法聲押禁見，威加國際負責人涂傑生則以100萬元交保。源春製油廠等案件由嘉義地檢署偵辦，永豐餘生技問題苦茶油已停售、下架及回收。另於8月5日，印度籍商船在葉門水域、荷台達港以南遭1枚拋射物擊中後沉沒，13名印度籍與1名葉門籍船員共14人全數獲救；印度譴責攻擊並與葉門當局協調，印度煉油廠改採到岸交貨方式採購中東石油。", "facts": ["苦茶油被驗出苯駢芘超標", "7人遭約談，5人移送", "2人涉製假油遭聲押禁見", "涂傑生100萬元交保", "14名船員全數獲救", "印度煉油廠改採到岸交貨"], "watch": "留意台北、嘉義地檢署後續偵辦及葉門水域航運安全變化。", "etype": "公司治理", "codes": [], "n": 3, "subs": [{"t": "威加國際疑混充苦茶籽製油，5人移送", "arts": [{"t": "影／毒油風暴延燒…苦茶籽油爆陸製黑心貨 威加國際負責人5被告送辦", "u": "https://money.udn.com/money/story/5648/9671160", "s": "經濟日報", "d": "2026-08-05"}, {"t": "影／苦茶癌油漏洞浮現 威加國際混陸製劣油 2人聲押、負責人百萬交保", "u": "https://money.udn.com/money/story/5648/9671246", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "印度商船遇襲14人獲救", "arts": [{"t": "印度商船航經葉門水域遭擊沉　船員全數獲救", "u": "https://money.udn.com/money/story/5599/9671217", "s": "經濟日報", "d": "2026-08-05"}]}]}, "14": {"id": 14, "title": "國發基金加碼生醫與美融資，DeepSeek募500億", "synthesis": "國發基金管理會於8月4日通過「投資台灣生醫產業實施方案」，未來十年匡列新台幣100億元，鎖定具創新技術、臨床應用價值及國際市場潛力的生醫企業，並將與衛生福利部共同成立台灣生醫產業發展基金，結合民間資本，支援研發、臨床驗證至商業化。另推動企業投資美國融資保證機制，首期由國發基金挹注8億美元、15家國內銀行出資5.75億美元，合計成立13.75億美元保證專款，預計帶動約550億美元融資需求，最高可達2500億美元。陸媒引述交易人士透露，DeepSeek重啟第二輪融資，計劃募資人民幣500億元，投前估值約5,000億元，預計8月下旬簽約；若順利，兩輪融資募資將超過1,000億元。", "facts": ["生醫十年匡列新台幣100億元", "美融資保證專款13.75億美元", "預計帶動約550億美元融資", "DeepSeek計劃募資人民幣500億元", "DeepSeek投前估值約5,000億元", "兩輪融資將超過1,000億元"], "watch": "留意DeepSeek預計於8月下旬完成第二輪融資簽約。", "etype": "總經政策", "codes": [], "n": 4, "subs": [{"t": "國發基金10年匡列生醫100億元", "arts": [{"t": "國發基金挺生醫 設百億基金", "u": "https://www.ctee.com.tw/news/20260805700127-430104", "s": "工商時報", "d": "2026-08-05"}, {"t": "生醫新創島 百億資金來了 國發基金通過投資方案 匡列十年額度", "u": "https://money.udn.com/money/story/7307/9670967", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "DeepSeek重啟融資500億元", "arts": [{"t": "DeepSeek傳重啟融資 投前估值人民幣5,000億元", "u": "https://www.ctee.com.tw/news/20260805700805-430804", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "國發基金首期挹注8億美元", "arts": [{"t": "《經濟》企業投資美國融資保證機制 估可帶動550億美元需求", "u": "https://www.ctee.com.tw/news/20260805700613-430102", "s": "工商時報", "d": "2026-08-05"}]}]}, "15": {"id": 15, "title": "政府116年度總預算3.6兆、科技預算數字不一", "synthesis": "行政院於2026年8月4日向總統府報告116年度（2027年）中央政府總預算案，歲入逾3.8兆元、歲出逾3.6兆元，均創歷史新高，目標為零舉債、收支平衡，另編列債務還本1,930億元。稅課收入可望達3.4兆元，所得稅首度突破2兆元；證交稅一篇稱約6千多億元，另一篇明列6,400億元，較今年預算案數成長1.5倍。支出將擴大科技、國防、社福及公共建設，並因應中東戰事調降汽柴油與液化石油氣貨物稅。科技預算說法分別為1,768億元及1,810億元，前者較今年增加103億元、年增6.2%，後者較2026年成長約8.7%、創新高，原文未說明差異原因；中央公務預算匡列3,789億元，勞保撥補可望逾1,000億元。科技投入涵蓋主權AI、半導體、量子科技、矽光子、機器人、太空及次世代通訊。另國科會2025至2030年將投入逾270億元，布局2030年6G商用化與衛星通訊商機；去年衛星地面設備產值逾2,700億元、成長13%。", "facts": ["歲入逾3.8兆、歲出逾3.6兆", "所得稅收入首度突破2兆元", "證交稅明列6,400億元", "科技預算說法為1,768億與1,810億", "勞保撥補可望逾1,000億元", "2025至2030年6G投入逾270億元", "衛星地面設備產值逾2,700億元"], "watch": "預算案預計於2026年8月20日送立法院審議。", "etype": "總經政策", "codes": [], "n": 6, "subs": [{"t": "中央總預算3.6兆、所得稅首破2兆", "arts": [{"t": "明年所得稅收 首破2兆元", "u": "https://www.ctee.com.tw/news/20260805700115-430101", "s": "工商時報", "d": "2026-08-05"}, {"t": "明年總預算見輪廓", "u": "https://www.ctee.com.tw/news/20260805700045-430101", "s": "工商時報", "d": "2026-08-05"}, {"t": "明年總歲出3.6兆創新高 賴總統喊零舉債、收支平衡", "u": "https://money.udn.com/money/story/7307/9671051", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "政府2027科技預算1768億至1810億", "arts": [{"t": "明年勞保撥補 可望逾千億", "u": "https://money.udn.com/money/story/7307/9671059", "s": "經濟日報", "d": "2026-08-05"}, {"t": "政府明年科技錢要花在哪？1,810億元重押 AI、機器人與太空", "u": "https://money.udn.com/money/story/7307/9671579", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "政府推動6G投入逾270億元", "arts": [{"t": "鄭麗君：從MIT邁向「在台創造」", "u": "https://www.ctee.com.tw/news/20260805700047-430101", "s": "工商時報", "d": "2026-08-05"}]}]}, "16": {"id": 16, "title": "國票金民股副董年薪2千萬促公股選舉限縮", "synthesis": "8月4日，立法院通過藍委提案，要求財政部所屬公股公司的正、副董事長選舉，不得支持非公股代表；財政部接受提案，並將進行專案報告。此案起因於國票金設置年薪2千萬元的民股推派副董事長，引發外界對公股董座人事安排及薪酬的關注。除選舉規範外，市場也持續關注公公併規劃的後續進展。", "facts": ["8月4日立法院通過藍委提案", "公股董座選舉不得支持非公股代表", "財政部接受提案並將專案報告", "國票金民股副董年薪2千萬元", "外界持續關注公公併規劃"], "watch": "留意財政部專案報告及公公併規劃後續。", "etype": "公司治理", "codes": [], "n": 1, "subs": [{"t": "國票金副董年薪2千萬", "arts": [{"t": "公股正副董改選 財部不得挺非公股代表", "u": "https://www.ctee.com.tw/news/20260805700118-430101", "s": "工商時報", "d": "2026-08-05"}]}]}, "17": {"id": 17, "title": "輝達AI模型與CPO擴張，SpaceX算力近10GW", "synthesis": "輝達執行長黃仁勳於8月4日宣布，開放340億參數Alpamayo 2 Super供商業使用，汽車製造商與自駕系統開發商可檢視、微調及部署；該模型在輝達LingoQA測試獲79.2分，於37款模型中排名第一，並規劃與Uber於2027年導入Robotaxi。輝達另宣布共同封裝光學（CPO）進入量產，相關交換器已交付核心客戶；垂直擴充所需頻寬為水平擴充10倍，2026年至2027年為驗證與爬坡期。全新（2455）取得AXT基板料源，預期第三季營收大幅跳增。SpaceX則決定完全採用輝達（Nvidia）Vera Rubin AI晶片架構，預期年底AI算力超過2 GW、明年底接近10 GW；消息帶動輝達盤後股價上漲超過2%，至每股216.40美元。", "facts": ["Alpamayo 2 Super開放商用", "模型以79.2分排名第一", "CPO垂直頻寬為水平10倍", "全新（2455）取得AXT料源", "SpaceX年底算力超過2 GW", "輝達盤後股價216.40美元"], "watch": "留意2026年至2027年CPO驗證爬坡，以及2027年輝達與Uber導入Robotaxi。", "etype": "訂單產能", "codes": ["2455"], "n": 3, "subs": [{"t": "輝達CPO量產頻寬10倍", "arts": [{"t": "輝達CPO量產 光通訊族群開趴", "u": "https://www.ctee.com.tw/news/20260805700231-430201", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "輝達開放自駕模型商用340億參數", "arts": [{"t": "輝達開源最新自駕模型 可供商用！黃仁勳再喊「下一波AI浪潮是機器人 」", "u": "https://www.ctee.com.tw/news/20260805700876-430704", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "SpaceX年底算力超2GW", "arts": [{"t": "馬斯克讚爆輝達 Vera Rubin AI 晶片 宣告全面採用 輝達盤後急拉漲逾2%", "u": "https://money.udn.com/money/story/5599/9671342", "s": "經濟日報", "d": "2026-08-05"}]}]}, "18": {"id": 18, "title": "世紀*旗下朝和生醫2027年進軍馬來西亞", "synthesis": "世紀*（5314）旗下朝和生醫計畫拓展東南亞市場，預計於2027年推動產品在馬來西亞上市。朝和生醫目前在台灣銷售的口服外泌體系列，累計銷售已突破百萬件，消費者回購率突破8成，將作為其海外市場布局的基礎。", "facts": ["朝和生醫預計2027年馬來西亞上市", "世紀*（5314）旗下朝和生醫", "口服外泌體系列銷售突破百萬件", "消費者回購率突破8成"], "watch": "留意2027年朝和生醫在馬來西亞推動上市的進度。", "etype": "業務合作", "codes": ["5314"], "n": 1, "subs": [{"t": "朝和生醫進軍馬來西亞2027年", "arts": [{"t": "世紀＊搶攻東南亞億萬保健紅利 朝和生醫揮軍馬來西亞啟動海外版圖", "u": "https://www.ctee.com.tw/news/20260805700893-430504", "s": "工商時報", "d": "2026-08-05"}]}]}, "19": {"id": 19, "title": "Saudi Aramco淨利增33%但油市供應仍緊", "synthesis": "8月4日國際油價回落，但彭博資訊指出，荷莫茲海峽封鎖及外交解決方案仍具不確定性，油價下跌可能只是暫時現象。沙烏地阿拉伯國家石油公司執行長納瑟表示，全球原油損失已超過26億桶；若荷莫茲海峽重開，仍需18個月補充庫存。受美伊衝突造成航運受阻影響，石油與天然氣價格上升，Saudi Aramco於8月4日公布上季調整後淨利1,252億沙烏地里亞爾，年增33%；BP上季淨利則為57億美元，優於市場預估。", "facts": ["全球原油損失超過26億桶", "Saudi Aramco淨利年增33%", "Saudi Aramco淨利1,252億沙烏地里亞爾", "BP上季淨利57億美元", "補充庫存需18個月"], "watch": "留意荷莫茲海峽重開及外交解決方案的進展。", "etype": "原物料能源", "codes": [], "n": 2, "subs": [{"t": "全球原油損失超過26億桶", "arts": [{"t": "彭博看油價走勢 下跌只是暫時的", "u": "https://money.udn.com/money/story/5599/9671065", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "Saudi Aramco淨利年增33%", "arts": [{"t": "荷莫茲不通 油氣業大發亂世財 Saudi Aramco 上季淨利年增33%", "u": "https://money.udn.com/money/story/5599/9671026", "s": "經濟日報", "d": "2026-08-05"}]}]}, "20": {"id": 20, "title": "台新銀行併新光銀行資產4.7兆", "synthesis": "金管會於8月4日同意台新銀行與新光銀行合併，存續主體為台新銀行，合併基準日暫訂2027年1月1日。合併後總資產估達4.7兆元、資本額1,703億元，其中一篇報導稱合併後為國銀第七大。國內營業據點將增至204處，報導稱為國銀第二多、民營銀行第一多。整合範圍涵蓋存款、放款、信用卡及客戶資料，合併過程須確保核心系統運作與客戶交易穩定。", "facts": ["合併基準日暫訂2027年1月1日", "合併後資產估達4.7兆元", "合併後資本額1,703億元", "國內營業據點增至204處", "整合存款、放款、信用卡與客資"], "watch": "留意2027年1月1日合併基準日前的核心系統與客戶交易整合。", "etype": "公司治理", "codes": [], "n": 3, "subs": [{"t": "台新銀併新光銀資產4.7兆、據點204處", "arts": [{"t": "台新銀併新光銀 金管會准了", "u": "https://www.ctee.com.tw/news/20260805700162-430301", "s": "工商時報", "d": "2026-08-05"}, {"t": "《金融》金管會准台新銀併新光銀 國內據點將躍居第2多", "u": "https://www.ctee.com.tw/news/20260805700611-430301", "s": "工商時報", "d": "2026-08-05"}, {"t": "台新銀、新光銀2027年元旦合併", "u": "https://money.udn.com/money/story/122376/9670905", "s": "經濟日報", "d": "2026-08-05"}]}]}, "21": {"id": 21, "title": "中美以黑名單與30天框架爭AI模型", "synthesis": "中美正從制裁、黑名單與政府監管框架，多線角力AI模型競爭。中方因擔心Anthropic開發的Mythos及其他美企先進AI模型被用於攻擊中國網路，研擬制裁或列入「限制實體清單」等反制方案；川普表示，習近平預計於9月24日訪問美國，相關AI會談仍在研議。另有報導稱，川普政府6月曾考慮制裁中國AI模型、列入貿易黑名單並限制美國雲端服務交易，但在矽谷反對後轉向推動美國AI模型，政策尚未完全定調。產品競爭方面，中國AI模型在8周內推出5款新品，涵蓋推理與影片生成；DeepSeek V4 Flash處理複雜工作負載成本為0.03美元，Claude Fable 5則為3.15美元。白宮8月3日完成先進AI模型自願框架，8月4日邀OpenAI、Anthropic、Google及Meta閉門會議；框架要求政府在模型發布前最多30天取得存取權，並遵守保密與網路安全規範。", "facts": ["中方研擬制裁Anthropic及列限制實體清單", "川普稱習近平預計9月24日訪美", "中國AI模型8周推出5款新品", "DeepSeek V4 Flash成本0.03美元", "Claude Fable 5成本3.15美元", "白宮框架允政府提前最多30天存取模型", "8月4日白宮召集四家AI業者閉門會議"], "watch": "留意9月24日習近平預計訪美期間的中美AI會談，以及美國AI模型制裁與黑名單政策是否定案。", "etype": "地緣政治", "codes": [], "n": 4, "subs": [{"t": "中美擬以制裁及黑名單限制AI模型", "arts": [{"t": "憂美企AI模型變武器 中方擬反制", "u": "https://www.ctee.com.tw/news/20260805700110-430801", "s": "工商時報", "d": "2026-08-05"}, {"t": "如何因應中國開源AI模型　川普政府內部爭論", "u": "https://money.udn.com/money/story/5603/9671863", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "中國AI模型八周推出5款", "arts": [{"t": "美制裁失靈？陸8周狂推5款AI模型 價格僅美百分之一", "u": "https://www.ctee.com.tw/news/20260805700822-430801", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "白宮完成AI框架30天", "arts": [{"t": "白宮敲定 AI 框架 訂明確規範 舉行企業閉門會議 防技術失控", "u": "https://money.udn.com/money/story/5599/9671010", "s": "經濟日報", "d": "2026-08-05"}]}]}, "22": {"id": 22, "title": "豐田獲利上修至3.4兆、滙豐Q2增60%", "synthesis": "2026年8月4日，豐田汽車宣布買回1兆日圓庫藏股，並將本會計年度營業利益預估調高逾一成至3.4兆日圓。同日，滙豐控股公布2026年第二季營收年增16%至191億美元，稅前盈餘101.5億美元、年增60%，優於市場預期，並把全年淨利息收益目標調高至最少460億美元；第二季預期信貸損失為10.5億美元。台廠方面，豐祥-KY（5288）2026年上半年稅後純益5.57億元、年增54.72%，EPS 8.03元，第二季營收24.1億元創單季新高，董事會並通過投資2,300萬美元在越南興建約8.04萬平方公尺新廠，以擴充電子新業務產能。勤凱2026年7月營收2.69億元，月增8.4%、年增78.4%，連續第二個月創歷史新高；第二季營收7.1億元、EPS 2.71元均創單季新高，上半年EPS為5.26元，AI需求及MLCC客戶拉貨帶動第三季營運可望續旺。此外，SK海力士與晟碟發布HBF標準規格，越南央行籌備220兆越南盾優惠貸款；亞馬遜市值達3.06兆美元，貝佐斯申報出售1,500萬股，漢莎航空則將全年EBIT下修至17億至22億歐元。", "facts": ["豐田買回1兆日圓庫藏股", "豐田營益預估升至3.4兆日圓", "滙豐Q2稅前盈餘101.5億美元", "滙豐淨利息收益目標至少460億美元", "豐祥-KY上半年EPS 8.03元", "豐祥-KY投資2,300萬美元建越南新廠", "勤凱Q2 EPS 2.71元創高", "亞馬遜市值達3.06兆美元"], "watch": "留意勤凱第三季營運是否續旺，以及滙豐全年淨利息收益是否最少達到460億美元。", "etype": "財報", "codes": ["5288"], "n": 4, "subs": [{"t": "豐祥上半年獲利增54.72％", "arts": [{"t": "豐祥擁雙題材 H1靚", "u": "https://www.ctee.com.tw/news/20260805700287-430503", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "勤凱Q2每股純益2.71元", "arts": [{"t": "Q2締新猷 勤凱Q3營運續旺", "u": "https://www.ctee.com.tw/news/20260805700180-430502", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "滙豐控股Q2獲利101.5億美元", "arts": [{"t": "滙豐控股Q2獲利 優預期", "u": "https://www.ctee.com.tw/news/20260805700150-430804", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "豐田汽車上調獲利至3.4兆日圓", "arts": [{"t": "1分鐘看世界／豐田上調年度獲利預測 將買63億美元庫藏股", "u": "https://money.udn.com/money/story/5599/9671004", "s": "經濟日報", "d": "2026-08-05"}]}]}, "23": {"id": 23, "title": "台廠AI需求升溫，成熟製程漲45%", "synthesis": "花旗環球證券看好台積電（2330）、聯電（2303）、日月光投控、聯發科（2454）、創意及台達電，認為AI基礎建設仍在多年擴張周期早期；聯電矽光子與先進封裝未來幾年總投資額將達50億美元，台達電AI相關營收占比可達25%。2026年8月4日，世界先進（5347）稱AI需求使成熟製程供不應求，2027年漲價幅度將不低於2026年；力積電（6770）自2026年7月起調高記憶體代工價45%、8吋與12吋邏輯代工價10%至15%，法人估產能利用率逾九成、毛利率朝45%甚至50%靠攏。法人預估聯電第三季出貨季增7%至9%、利用率約90%，2026年AI營收近3億美元；聯發科評等升至買進、目標價6,000元，資料中心ASIC預計2026年第四季量產，2026及2027年營收估6,565億元與1.12兆元。富世達（6805）2026年AI營收占比約60%，上半年伺服器營收占55.7%，第二季EPS12.39元，2027年QD與滑軌產能均較目前倍增。城堡證券估美國科技業至2028年底AI融資逾5,000億美元；亞馬遜AWS產能已預定至2027年底並延伸至2028年，2026年資本支出2,200億美元、AI年化營收250億美元。世界先進維持600億至700億元資本支出，VSMC新加坡12吋廠預計2027年第一季量產；另有明年度中央總歲出3.6兆元、零舉債，DRAM現貨單周漲14%，緯創（3231）AI伺服器出貨旺至2027年並規劃GDR籌資450億元。", "facts": ["力積電記憶體代工價調漲45%", "聯發科目標價上調至6,000元", "富世達2026年AI營收占比60%", "城堡估AI融資逾5,000億美元", "AWS產能預定至2027年底", "世界先進資本支出600億至700億元", "DRAM現貨單周上漲14%", "緯創規劃GDR籌資450億元"], "watch": "留意2026年第四季聯發科資料中心ASIC量產、2027年第一季VSMC新加坡12吋廠量產，以及2027年成熟製程漲價幅度。", "etype": "法人動向", "codes": ["2303", "2330", "2454", "3231", "4938", "5347", "6770", "6805"], "n": 12, "subs": [{"t": "花旗看多六檔台廠，成熟製程漲價45%", "arts": [{"t": "AI基建投資提速 台積電等半導體五天王外資力挺 「這些族群」也沾光", "u": "https://www.ctee.com.tw/news/20260805700065-430201", "s": "工商時報", "d": "2026-08-05"}, {"t": "成熟製程報價 明年漲更兇 世界、聯電、力積電齊喊 AI 需求強", "u": "https://money.udn.com/money/story/5612/9671027", "s": "經濟日報", "d": "2026-08-05"}, {"t": "半導體六雄 花旗喊買", "u": "https://money.udn.com/money/story/5607/9670671", "s": "經濟日報", "d": "2026-08-05"}, {"t": "8月5日 五件財經大事搶先看", "u": "https://money.udn.com/money/story/5607/9671192", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "聯電AI營收近3億美元、聯發科目標價6,000元", "arts": [{"t": "聯電、和碩 營運動能正向", "u": "https://www.ctee.com.tw/news/20260805700305-430203", "s": "工商時報", "d": "2026-08-05"}, {"t": "聯發科 二檔有戲", "u": "https://money.udn.com/money/story/5739/9671074", "s": "經濟日報", "d": "2
