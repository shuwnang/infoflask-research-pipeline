sis": "橘焱胡同旗下開丼、四代目菊川等品牌持續拓點，其中開丼預計在12月31日前於美國開出第二家門市，並開放加盟；集團1月1日至6月30日合併營收7.25億元，年增12.12％，燒肉事業群同步測試新店型與服務模式。喬山董事長羅崑泉於8月4日表示，公司健身器材、按摩椅及助聽器等業務穩定發展，並透過成立喬山生機跨足健康食品市場，產品涵蓋食用油、陳釀醋、醇飲、醇宴、零食飲品、素食及代理葡萄酒，共7類。", "facts": ["開丼12月31日前美國增至第2店", "橘焱胡同上半年營收7.25億元", "上半年營收年增12.12％", "喬山成立喬山生機拓健康食品", "喬山健康食品涵蓋7類產品"], "watch": "留意開丼在12月31日前於美國開出第二家門市及開放加盟進度。", "etype": "訂單產能", "codes": [], "n": 2, "subs": [{"t": "橘焱胡同美國拓店2家", "arts": [{"t": "橘焱胡同拓新客源 衝刺海外展店", "u": "https://www.ctee.com.tw/news/20260805700196-430503", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "喬山健康食品布局7類產品", "arts": [{"t": "打造新營運引擎 喬山跨足健康食品搶市", "u": "https://www.ctee.com.tw/news/20260805700194-430503", "s": "工商時報", "d": "2026-08-05"}]}]}, "126": {"id": 126, "title": "台新併新光資產4.7兆，安聯貝恩跨境收購", "synthesis": "2026年8月4日，金管會同意台新銀行與新光銀行合併，台新銀行為存續主體，合併基準日暫定為2027年1月1日。合併後總資產估達4.7兆元，國銀排名第七，資本額1,703億元；國內營業據點增至204處，為國銀第二多、民營銀行第一多。整合涵蓋存款、放款、信用卡及客戶資料，並須維持核心系統與客戶交易穩定。2026年8月5日，大華銀行（UBO）與安聯環球投資協議交易，安聯以5.55億星幣、約新台幣近140億元，收購大華資產管理公司在亞洲八大市場的資產管理業務，雙方另簽長期戰略分銷合作協議；大華銀行預估扣除一次性交易成本後，可認列約3.3億星幣稅前處分利益，交易預計於2027年完成，須取得新加坡金融管理局及各國主管機關核准，另一報導概括為待當地監管部門批准。同日，貝恩資本與TA Associates達成最終協議，計劃以超過6億3500萬美元、約新台幣202億2475萬元收購貢茶，預計2026年底前完成，貢茶將擴展日本、韓國門市並加速美國展店。", "facts": ["2026年8月4日金管會核准台新併新光", "合併後資產4.7兆元、國銀排名第七", "合併基準日暫定2027年1月1日", "安聯以5.55億星幣收購大華資管", "大華銀行估處分利益3.3億星幣", "貝恩逾6億3500萬美元收購貢茶", "貢茶拓展日韓並加速美國展店"], "watch": "留意台新新光於2027年1月1日合併、安聯交易於2027年完成及監管核准進度，以及貢茶於2026年底前完成交易。", "etype": "公司治理", "codes": [], "n": 6, "subs": [{"t": "台新銀併新光銀資產4.7兆元", "arts": [{"t": "台新銀併新光銀 金管會准了", "u": "https://www.ctee.com.tw/news/20260805700162-430301", "s": "工商時報", "d": "2026-08-05"}, {"t": "《金融》金管會准台新銀併新光銀 國內據點將躍居第2多", "u": "https://www.ctee.com.tw/news/20260805700611-430301", "s": "工商時報", "d": "2026-08-05"}, {"t": "台新銀、新光銀2027年元旦合併", "u": "https://money.udn.com/money/story/122376/9670905", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "安聯5.55億星幣收購大華資產管理", "arts": [{"t": "安聯砸近140億元併大華資產管理 預計2027年完成收購", "u": "https://www.ctee.com.tw/news/20260805702040-430301", "s": "工商時報", "d": "2026-08-05"}, {"t": "資產管理市場震撼彈！安聯環球投資5.55億星幣收購大華銀資產管理", "u": "https://money.udn.com/money/story/5613/9672675", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "貝恩資本收購貢茶逾202億元", "arts": [{"t": "日經亞洲：美國貝恩資本將以逾202億元收購貢茶", "u": "https://money.udn.com/money/story/120769/9671705", "s": "經濟日報", "d": "2026-08-05"}]}]}, "127": {"id": 127, "title": "記憶體缺貨推升手機漲價，中型房企兩年少21家", "synthesis": "記憶體供應緊張預期延續。長鑫存儲於7月27日在上海證券交易所科創板上市，首日上漲471%至人民幣49.5元；野村證券初評「買進」、目標價人民幣116元，並認為2027年至2028年記憶體供給短缺可能性偏高。創見（2451）董事長束崇萬於8月5日表示，缺貨與漲價可能延續至2027年底，且2026年供應恐比2025年更緊；另一報導則稱最快延續至「明年底」，但未標示年份。創見上半年EPS由1.85元增至46.63元、年增2421%，庫存金額超過200億元，仍優先供應既有客戶；束崇萬稱即使漲幅收斂，仍看不到價格反轉向下，三星等大廠退出MLC NAND也可能令供給進一步收斂。手機端方面，余承東8月5日表示記憶體高漲，後續手機可能大規模漲價；小米17系列於8月2日每台上調人民幣300元～500元，REDMI部分產品亦漲價300元。另據中國指數研究院，截至7月31日，銷售額300億元至1000億元人民幣的房企僅6家，較去年同期少4家、較2023年同期少21家；前10大房企銷售總額約9354.9億元，低於2023年同期約1.73兆元。", "facts": ["長鑫存儲首日漲471%至49.5元", "野村初評買進、目標價116元", "創見缺貨漲價估延至2027年底", "創見上半年EPS增至46.63元", "創見庫存金額超過200億元", "中型房企兩年減少21家", "前10大房企銷售額約9354.9億元", "小米17系列上調300元～500元"], "watch": "留意缺貨與漲價是否延續至2027年底，以及2026年供應是否比2025年更緊。", "etype": "產業供需", "codes": ["2451"], "n": 5, "subs": [{"t": "長鑫存儲上市首日飆漲471%；創見看缺貨至2027年底", "arts": [{"t": "記憶體熱潮再起！長鑫存儲首日飆471％還沒完？野村喊買 超狂目標價曝光", "u": "https://www.ctee.com.tw/news/20260805700825-430806", "s": "工商時報", "d": "2026-08-05"}, {"t": "創見束崇萬：記憶體缺貨恐延續至2027年底 明年供應將更緊", "u": "https://money.udn.com/money/story/5612/9672868", "s": "經濟日報", "d": "2026-08-05"}, {"t": "創見董座束崇萬：未來記憶體漲幅即使收斂 漲勢恐持續到明年底", "u": "https://money.udn.com/money/story/5612/9672826", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "中國中型房企兩年少21家", "arts": [{"t": "陸房市持續低迷！中型房企大縮水 2年少21家", "u": "https://www.ctee.com.tw/news/20260805701212-430801", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "小米17系列上調500元", "arts": [{"t": "華為余承東：記憶體飆漲 所有手機可能都要大規模漲價", "u": "https://www.ctee.com.tw/news/20260805701824-430804", "s": "工商時報", "d": "2026-08-05"}]}]}, "128": {"id": 128, "title": "力積電漲價45%、售廠逾500億押注3D AI", "synthesis": "8月4日，世界先進（5347）董事長方略表示，AI需求使成熟製程供不應求，2027年代工價格漲幅將大於2026年，聯電（2303）與力積電（6770）亦認同2027年漲價方向。力積電自7月起將記憶體代工價格調高45%，8吋與12吋邏輯代工價格調高10%至15%；法人看好產能利用率突破九成、毛利率朝45%甚至五成靠攏。力積電預期第二季至第四季營收每季雙位數成長，另一說法則明確指出第三季較第二季、第四季較第三季均可望雙位數季增，全年營收及獲利優於去年。出售銅鑼廠予美光完成後，將挹注逾500億元現金，降低負債比、折舊與固定成本壓力，並深化HBM後段製程及堆疊合作。公司表示黃崇仁家族繼承後控股結構不變，將維持既有團隊與穩健策略；3D AI營收占比目前約7%，目標3年內升至20%。同日另有報導指出，中國AI模型8周推出5款新品，DeepSeek V4 Flash複雜工作負載成本為0.03美元，Claude Fable 5為3.15美元。", "facts": ["記憶體代工價格自7月上調45%", "8吋、12吋邏輯代工漲10%至15%", "2027年代工漲幅料高於2026年", "銅鑼廠出售完成後挹注逾500億元", "3D AI營收占比約7%，目標20%", "力積電控股結構目前不變", "第二至第四季營收季增雙位數", "模型成本0.03美元對3.15美元"], "watch": "留意銅鑼廠出售完成後逾500億元現金挹注，以及未來3年3D AI營收占比由7%升至20%的進度。", "etype": "公司治理", "codes": ["2303", "2330", "5347", "6770"], "n": 6, "subs": [{"t": "力積電售銅鑼廠逾500億助攻成長", "arts": [{"t": "力積經營團隊：H2營運逐季走高", "u": "https://www.ctee.com.tw/news/20260805700177-430501", "s": "工商時報", "d": "2026-08-05"}, {"t": "力積電拚年年獲利 年年配息 總座朱憲國喊「三個不變」", "u": "https://money.udn.com/money/story/5612/9671047", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "力積電代工漲45%並押注3D AI", "arts": [{"t": "成熟製程報價 明年漲更兇 世界、聯電、力積電齊喊 AI 需求強", "u": "https://money.udn.com/money/story/5612/9671027", "s": "經濟日報", "d": "2026-08-05"}, {"t": "《半導體》力積電續亮燈攻頂 近4日強彈近38%", "u": "https://www.ctee.com.tw/news/20260805701109-430201", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "中國AI模型八周推出5款", "arts": [{"t": "美制裁失靈？陸8周狂推5款AI模型 價格僅美百分之一", "u": "https://www.ctee.com.tw/news/20260805700822-430801", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "力積電8月4日控股不變", "arts": [{"t": "力積電代理董事長謝再居：集團控股結構 不會異動", "u": "https://money.udn.com/money/story/5612/9671053", "s": "經濟日報", "d": "2026-08-05"}]}]}, "129": {"id": 129, "title": "新北預售餘屋破1.8萬戶、淡水賣壓最重", "synthesis": "央行第七波選擇性信用管制實施後，新北市預售市場銷售放緩，待售餘屋突破1.8萬戶，兩篇報導分別以「突破1.8萬戶」及「突破1萬8千戶」表述。淡水區待售餘屋3,507戶居冠，累計銷售率66.3%，其中淡海新市鎮周邊賣壓較重；三重、林口分別有2,189戶與1,903戶。土城、五股銷售率分別為80.2%與80.4%，另一篇概括兩區均突破8成。報導指出，信用管制收緊後投機客退場、自住客觀望，拖累整體銷況。另一方面，公股銀行將依5P強化購買店舖、一般事務所或辦公室且主張自用者的貸後查核，確認購屋目的並要求簽署自用切結，再依建物用途及收入負債比差異化訂價；公股銀認為房市將量縮價穩。", "facts": ["新北預售餘屋突破1.8萬戶", "淡水餘屋3,507戶、銷售率66.3%", "三重、林口餘屋2,189及1,903戶", "土城與五股銷售率逾8成", "公股銀依5P強化貸後查核", "自用購屋須確認目的並簽切結"], "watch": "央行第七波選擇性信用管制實施後，留意公股銀貸後查核及房市量縮價穩。", "etype": "房市", "codes": [], "n": 3, "subs": [{"t": "新北預售餘屋破1.8萬戶，淡水賣壓最重", "arts": [{"t": "新北待售餘屋突破1.8萬戶 淡水賣壓最大", "u": "https://www.ctee.com.tw/news/20260805701507-430602", "s": "工商時報", "d": "2026-08-05"}, {"t": "《傳產》信用管制降溫房市 新北預售餘屋破1.8萬戶", "u": "https://www.ctee.com.tw/news/20260805701852-430503", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "公股銀房貸徵審依5P", "arts": [{"t": "自用店鋪辦公室 公股銀加強貸後查核", "u": "https://www.ctee.com.tw/news/20260805700120-430304", "s": "工商時報", "d": "2026-08-05"}]}]}, "130": {"id": 130, "title": "研華Q2接單比1.44、布局AI一體機", "synthesis": "研華（2395）於8月5日表示，上半年營收與獲利續創新高，第二季接單／出貨比達1.44，顯示接單動能高於出貨。公司展望第三季，營收可望年比、季比持續成長，毛利率與營業利益率則維持上季水準。產品布局方面，研華推動IWS軟硬整合產品平台，主攻整合邊緣AI伺服器、軟體及服務的AI一體機，並布局代理式AI應用。邊緣AI伺服器上半年營收較去年同期翻倍成長，但公司預計IWS形成明顯業績貢獻仍需一到兩年。", "facts": ["第二季接單／出貨比1.44", "上半年營收與獲利續創新高", "第三季營收估年比、季比成長", "邊緣AI伺服器營收翻倍", "IWS明顯貢獻需一到兩年"], "watch": "留意IWS在一到兩年內形成明顯業績貢獻。", "etype": "訂單產能", "codes": ["2395"], "n": 2, "subs": [{"t": "研華Q2接單出貨比1.44", "arts": [{"t": "接單出貨比再創高 研華樂看Q3前景", "u": "https://www.ctee.com.tw/news/20260805701326-430502", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "研華布局AI一體機一到兩年", "arts": [{"t": "研華布局 AI 一體機 劉克振：「IWS」模式搶攻代理式 AI 商機", "u": "https://money.udn.com/money/story/5612/9672628", "s": "經濟日報", "d": "2026-08-05"}]}]}, "131": {"id": 131, "title": "台積電熊本復工，銀行吸存利率升至1.9%", "synthesis": "7月28日熊本發生規模7.1強震後，台積電（2330）位於熊本的JASM晶圓廠於7月29日復工；報導另指出，熊本一廠歷經六天重啟生產，已恢復至地震前運作，熊本二廠也恢復施工。台積電並捐贈2.5億日圓協助災後復原。其他半導體廠方面，索尼熊本影像感測器工廠於8月4日分階段復產，預估8月中恢復地震前產量；瑞薩熊本川尻廠預計8月5日復產，目標8月內全面恢復，三菱電機兩座功率半導體廠則已恢復運轉。另一方面，市場資金偏緊，郵局支應中油與台電合計6,000億元專案貸款後，銀行轉向台積電等大型企業吸收存款，7月底利率喊至1.9%；全體國銀平均LCR降至122.91%，另有銀行僅以100.6%達標。", "facts": ["熊本強震規模7.1", "台積電熊本一廠六天復工", "台積電捐贈2.5億日圓", "索尼工廠預估8月中復產", "銀行吸存利率喊至1.9%", "國銀平均LCR降至122.91%"], "watch": "留意8月中索尼熊本工廠產量恢復、8月5日瑞薩熊本川尻廠復產及8月內全面恢復進度。", "etype": "訂單產能", "codes": ["2330"], "n": 3, "subs": [{"t": "熊本強震後台積電六天復工", "arts": [{"t": "台積電熊本廠恢復運轉 不到一周就復原產線 展現強大應變力", "u": "https://money.udn.com/m ://www.ctee.com.tw/news/20260805701620-431202", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "源星生醫發表72小時監測系統", "arts": [{"t": "源星生醫發表 IWATCH® 夜間AI心律監測系統　72小時長時間監測拓展居家健康管理應用", "u": "https://money.udn.com/money/story/11800/9672721", "s": "經濟日報", "d": "2026-08-05"}]}]}, "134": {"id": 134, "title": "奧義賽博擴AI、宇樹科技募資42.02億", "synthesis": "奧義賽博（7823）董事會決議，將100%持股子公司奧義智慧科技的實收資本額由500萬元提高至2億元，並授權其設立兩家全資子公司，初始實收資本額各1億元，分別營運模型韌性AI與國防韌性AI業務。另一方面，宇樹科技科創板IPO於8月5日進入初步詢價，計畫募資人民幣42.02億元，公開發行新股4,044.64萬股；市場預估發行價約每股104元，對應市值將達400億元以上，申購日為8月10日、繳款日為8月12日。", "facts": ["奧義智慧科技資本額增至2億元", "兩家AI子公司各募資1億元", "宇樹科技IPO募資人民幣42.02億元", "宇樹科技發行新股4,044.64萬股", "市場預估發行價約每股104元", "宇樹科技市值將達400億元以上"], "watch": "留意宇樹科技8月10日申購、8月12日繳款。", "etype": "公司治理", "codes": ["7823"], "n": 2, "subs": [{"t": "宇樹科技IPO募資42.02億元", "arts": [{"t": "宇樹科技IPO發行價約人民幣104元 市值將達人民幣400億元以上", "u": "https://www.ctee.com.tw/news/20260805701393-430806", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "奧義賽博增資子公司至2億元", "arts": [{"t": "奧義賽博增資台灣子公司奧義智慧資本額至2億元 籌設兩家新公司", "u": "https://money.udn.com/money/story/5612/9673106", "s": "經濟日報", "d": "2026-08-05"}]}]}, "135": {"id": 135, "title": "美國科技業2028年前融資逾5,000億美元", "synthesis": "城堡證券預估，美國科技公司為支應AI晶片採購，至2028年將透過公開及私募市場累計發行超過5,000億美元債券；Citadel證券則稱，科技業截至2028年底前將進行超過5,000億美元債務融資，用於人工智慧園區晶片建設。兩篇均指出，晶片製造商可能在2028年單年新增發債超過2,500億美元，其中一篇表述為「2,500多億美元」。Citadel證券另稱，全球目前已吸納約5,700億美元AI相關債務；城堡證券認為，這波融資可能重塑美國投資級信用市場結構。2026年8月4日，馬斯克表示SpaceX決定完全採用輝達（Nvidia）Vera Rubin AI晶片架構，預期2026年底AI算力超過2 GW、2027年底接近10 GW；消息帶動輝達盤後股價上漲超過2%，至每股216.40美元。", "facts": ["2028年前科技業融資超過5,000億美元", "晶片商2028年新增發債超過2,500億美元", "全球已吸納約5,700億美元AI債務", "SpaceX決定採用Nvidia Vera Rubin架構", "SpaceX 2026年底算力超過2 GW", "輝達盤後報每股216.40美元"], "watch": "留意2028年底前科技業債務融資進度，以及SpaceX於2027年底接近10 GW算力的進展。", "etype": "產業供需", "codes": [], "n": 3, "subs": [{"t": "城堡估科技業2028年前融資逾5,000億美元", "arts": [{"t": "城堡證券估2028年AI融資衝破5千億美元", "u": "https://www.ctee.com.tw/news/20260805700113-430502", "s": "工商時報", "d": "2026-08-05"}, {"t": "科技業融資規模持續攀高", "u": "https://money.udn.com/money/story/5599/9671014", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "SpaceX年底算力超2GW", "arts": [{"t": "馬斯克讚爆輝達 Vera Rubin AI 晶片 宣告全面採用 輝達盤後急拉漲逾2%", "u": "https://money.udn.com/money/story/5599/9671342", "s": "經濟日報", "d": "2026-08-05"}]}]}, "136": {"id": 136, "title": "蘋果印度營收破百億、輝達CPO量產", "synthesis": "蘋果公司截至3月（原文未載年份）的12個月印度營收首次突破100億美元，較前一年度約90億美元呈兩位數成長；其中絕大部分由iPhone貢獻，iPad與MacBook需求亦增加。蘋果目前在印度五座工廠組裝iPhone，全球每四支iPhone就有一支在印度組裝。另一方面，輝達（NVIDIA）宣布共同封裝光學（CPO）進入量產，相關交換器已交付核心客戶；其垂直擴充所需頻寬為水平擴充的10倍，2026～2027年將是驗證與爬坡期。供應鏈方面，全新（2455）取得AXT基板料源，預期第三季營收大幅跳增。", "facts": ["蘋果印度營收首破100億美元", "印度營收較前年度約90億美元成長", "印度五座工廠組裝iPhone", "全球每四支iPhone一支印度組裝", "輝達CPO交換器已交付核心客戶", "垂直擴充頻寬為水平擴充10倍", "全新（2455）取得AXT基板料源", "2026～2027年為驗證與爬坡期"], "watch": "留意2026～2027年輝達CPO驗證與爬坡，以及全新（2455）第三季營收表現。", "etype": "產業供需", "codes": ["2455"], "n": 2, "subs": [{"t": "輝達CPO量產頻寬10倍", "arts": [{"t": "輝達CPO量產 光通訊族群開趴", "u": "https://www.ctee.com.tw/news/20260805700231-430201", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "蘋果印度銷售突破100億美元", "arts": [{"t": "蘋果印度年銷售逾百億美元", "u": "https://money.udn.com/money/story/123398/9671039", "s": "經濟日報", "d": "2026-08-05"}]}]}, "137": {"id": 137, "title": "美伊和談曙光油價重挫股市創高", "synthesis": "8月4日，美國財長貝森特稱美伊可能於8月4日至8月5日，另有報導指8月5日至8月6日達成協議，重開荷姆茲海峽；卡達稱草案已起草並傳閱，但雙方尚未直接會談，伊朗否認談判、僅承認與阿曼交涉。美方稱已協助逾1,000艘船通過南部航道。消息令WTI收跌5.69%至75.77美元，盤中報導分別指跌逾4%至76.77美元、跌4.7%至76.58美元；布蘭特收跌5.26%至79.36美元，盤中低見80.46或79.36美元。8月5日布蘭特再跌1.2%至78.44美元，本週累跌逾12%，WTI跌1.4%至74.70美元。8月4日道瓊漲907.47點至54,085.88點、標普500漲136.03點至7,736.53點，均創收盤新高；那斯達克漲2.59%、費半漲6.55%。8月5日亞洲股市續揚，首爾約3.8%、東京逾3%、台北近2.9%，台股盤中至44,980.31點，新台幣升至32.274元；美股早盤標普500、那斯達克再創高。Palantir、卡特彼勒上調展望，股價漲29.5%、5.6%；ADP公布7月私部門增4萬4000人，低於預估7萬5000人，9月升息機率降至56.9%。SpaceX第2季營收增92%、支出逾180億美元，股價一度跌逾10%、報導為跌12.5%；其另以196億美元向EchoStar取得65兆赫頻譜執照，規劃建設地面基礎設施，讓星鏈進軍行動服務，競爭對手包括威瑞森、AT&T及T-Mobile，分析人士稱需多年投資與執行。IMF預測伊朗2026年經濟成長萎縮6%、通膨約69%。", "facts": ["WTI收跌5.69%至75.77美元", "布蘭特8月5日跌至78.44美元", "道瓊8月4日漲907.47點", "費半8月4日上漲6.55%", "SpaceX以196億美元取得頻譜", "ADP新增就業4萬4000人", "IMF估伊朗2026年萎縮6%"], "watch": "留意8月5日至8月6日美伊協議 60805700189-430503", "s": "工商時報", "d": "2026-08-05"}, {"t": "《汽車股》機車7月銷量旺季雙增 三陽市占連20月摘冠", "u": "https://www.ctee.com.tw/news/20260805700614-430201", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "壽險業保費收入達3,179億元", "arts": [{"t": "壽險業6月締「三高」新紀錄 原因曝光", "u": "https://www.ctee.com.tw/news/20260805701967-430305", "s": "工商時報", "d": "2026-08-05"}]}]}, "140": {"id": 140, "title": "DRAM供應緊至2027，長鑫市占升至7%", "synthesis": "2026年8月4日，多家報導指AI伺服器需求排擠DRAM與NAND產能，世界先進預期供不應求至少延續至2027年，且2027年價格調整幅度不低於2026年；環球晶產線近滿載，南亞科與晶豪科2026年7月營收創高，空運運價每公斤上漲約10～20元。TrendForce預估2026年第三季PC DRAM合約價漲15％至20％，另有報導稱PC價格僅個位數增幅；DDR4 8Gb均價24美元、月增14.3％，NAND均價30.10美元，華強北主要DRAM單周漲約一成至14％。長鑫存儲2026年第二季市占7％、營收年增716％，躍居全球第四；惠普、華碩（2357）與宏碁部分平價筆電少量採用，其DDR5、LPDDR5X良率逾90％，但主要供非美國市場。蘋果尋求LPDDR5X且要求降價未果，華為、小米以高價長約鎖產能。長鑫存儲2026年7月底IPO籌資108.02億人民幣，合肥與北京產能開出後月產能逾50萬片12吋晶圓，約占全球DRAM供給20～25％，並擴張HBM與LPDDR6；TrendForce預估2027年HBM出貨位元年增50％至60％，輝達自2026年第三季起重新評估Rubin Ultra的HBM4e 8hi、HBM4 12hi及HBM4 8hi配置。2026年8月5日，三星電子與SK海力士評估中微半導體設備公司（AMEC）設備，作中國既有產線維護升級備援而非擴產；雙方約自2024年測試蝕刻設備，但三星否認測試或考慮採用，SK海力士拒置評且未決定大規模採用。美國管制或擴至維修保養，中國設備價格低20%至30%；美國2025年撤銷VEU授權並發放2026年度許可證。三星V10 BV-NAND超過400層、密度較V9增約58%；zHBM密度達傳統HBM5逾10倍，效能說法有HBM5的8倍與增3倍兩種，另能源效率增3倍、熱阻降逾一半，zHBM預計2029年前後量產、zNAND-O於2028年量產。SK海力士與SanDisk發布HBF規範，8或16層NAND最高512GB、速度每秒約0.4TB至3TB，Google與Tenstorrent加入聯盟，預計2030年商業化；Sandisk展示BiCS10 QLC 3D NAND、HBF及企業級SSD，支援PCIe Gen 6與E3.S。高盛重申三星電子、SK海力士買進，估2027年HBM ASP分別年增約87％及100％，庫存僅2至4周，SK海力士2026年第三季營業利益約77兆韓元。", "facts": ["供應緊張至少延續至2027年", "長鑫存儲市占7％、營收增716％", "長鑫IPO籌資108.02億人民幣", "DDR4 8Gb均價24美元", "zHBM預計2029年前後量產", "HBF最高512GB、2030年商業化", "SK海力士2027年HBM ASP增100％", "庫存僅約2至4周"], "watch": "留意2026年第三季PC DRAM價格、輝達Rubin Ultra的HBM配置重評，以及2028年zNAND-O、2029年前後zHBM與2030年HBF商業化進程。", "etype": "產業供需", "codes": ["2344", "2357", "2408"], "n": 21, "subs": [{"t": "長鑫DRAM市占7%供應吃緊延至2027", "arts": [{"t": "8／5盤前｜AI基建方興未艾 從晶圓代工、封測到IC設計 外資力挺半導體五天王", "u": "https://www.ctee.com.tw/news/20260805700437-430201", "s": "工商時報", "d": "2026-08-05"}, {"t": "研調：輝達評估下調Rubin Ultra HBM配置", "u": "https 顆", "富世達滑軌月產能3.5萬套", "技嘉訂單能見度延長至1年", "AWS產能預定至2027年底並延至2028年", "亞馬遜資本支出將達2,200億美元", "AWS AI年化營收達250億美元"], "watch": "留意富世達2027年兩項產品產能倍增進度，以及AWS產能預訂延伸至2028年的執行情況。", "etype": "訂單產能", "codes": ["6805"], "n": 3, "subs": [{"t": "亞馬遜AWS產能預定至2028年", "arts": [{"t": "亞馬遜 AWS產能預定到2028年", "u": "https://www.ctee.com.tw/news/20260805700142-430704", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "富世達擴產拚2027產能倍增", "arts": [{"t": "《電零組》富世達下半年營運樂觀 啟動擴產拚AI相關產能倍增", "u": "https://www.ctee.com.tw/news/20260805700682-430201", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "技嘉訂單能見度達一整年", "arts": [{"t": "AI市場需求旺盛 技嘉葉培城：看到明年沒問題", "u": "https://money.udn.com/money/story/5612/9672974", "s": "經濟日報", "d": "2026-08-05"}]}]}, "143": {"id": 143, "title": "達發、環宇-KY光通訊迎成長與轉單", "synthesis": "達發（6526）第二季毛利率及獲利低於市場預期，但受惠AI基礎建設、商用耳機與光通訊產品放量，法人仍調升投資評等及目標價；公司預期2026年全年光通訊營收貢獻較2025年大增四倍以上，2026年毛利率維持50%。環宇-KY（4991）則表示，磷化銦基板供應下半年好轉，預期2026年年底前供貨無虞，並降低對陸系供應依賴。公司第二季營收7.7億元、稅後純益1.05億元，第三季營收預估2,600～2,800萬美元，毛利率有望回升至44％～48％。總執行長暨總裁安寶信指出，若美國禁止進口大陸新型號光收發模組，環宇-KY現有業務不受影響，且美國大廠替換大陸供應商可能帶來轉單機會。", "facts": ["達發2026年光通訊營收增四倍以上", "達發2026年毛利率預期50%", "環宇-KY第二季營收7.7億元", "環宇-KY第二季稅後純益1.05億元", "環宇-KY第三季營收估2,600～2,800萬美元", "環宇-KY第三季毛利率估44％～48％", "美國禁令可能促成環宇-KY轉單"], "watch": "留意美國是否禁止進口大陸新型號光收發模組，以及環宇-KY磷化銦基板於2026年年底前的供貨情況。", "etype": "地緣政治", "codes": ["4991", "6526"], "n": 3, "subs": [{"t": "環宇-KY（4991）迎禁令機會", "arts": [{"t": "《半導體》環宇-KY：美禁陸光收發模組 對我們是機會", "u": "https://www.ctee.com.tw/news/20260805701496-430201", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "環宇-KY毛利率重回44％～48％", "arts": [{"t": "磷化銦基板缺貨緩解 環宇-KY：年底前供貨無虞", "u": "https://www.ctee.com.tw/news/20260805701328-430502", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "達發光通訊營收增四倍", "arts": [{"t": "光通訊展望更樂觀 法人調升 IC 設計股達發評等及目標價", "u": "https://money.udn.com/money/story/5607/9672142", "s": "經濟日報", "d": "2026-08-05"}]}]}, "144": {"id": 144, "title": "台韓股8月5日大漲，韓股收3.76%", "synthesis": "8月5日亞洲股市受到美股與晶片股大漲激勵，台日韓盤初全面走高。台股加權指數一度大漲超過1300點至44677點，台積電暫漲2.37%；日經225暫漲3.27%，南韓KOSPI盤初一度漲逾4%至6618.92點，收盤上漲3.76%或239.31點至6598.26點，盤中最高6674.66點。外資買超韓股由盤初的3254億韓元增至收盤1.45兆韓元，在岸韓元升值0.08%至1427.8兌1美元；三星電子漲2.5%、SK海力士漲5.77%。不過，7月台股自高點跌8834.02點、跌18.32%，KOSPI跌22.19%，即使兩家公司獲利亮麗，股價仍分別重挫58.2%與49.5%，兩倍槓桿被指為風暴核心。槓桿部位仍受關注：韓國5月27日掛牌的16檔槓桿ETF，規模增逾170%至約11.9兆韓元；台股7月27日融資擔保維持率為175%，證交所8月3日把處置期由10天縮至5天、撮合改為每2分鐘一次。貝萊德智庫則估AI供應鏈帶動新興市場企業盈餘於2026年成長35%，截至6月4日未來12個月估增36.7%，高於全球20.7%；台積電（2330）所在台灣估增34%，南韓220%，趨勢至少延續至2026年底。", "facts": ["KOSPI收漲3.76%至6598.26點", "外資收盤買超韓股1.45兆韓元", "三星電子漲2.5%、SK海力士漲5.77%", "韓國槓桿ETF規模增逾170%", "台股融資維持率7月27日為175%", "南韓2026年盈餘估增220%"], "watch": "留意AI供應鏈盈餘成長趨勢是否延續至2026年底，以及槓桿ETF與融資處置規則變化。", "etype": "盤勢資金", "codes": ["2330"], "n": 6, "subs": [{"t": "8月5日台韓股盤初大漲，韓股收漲3.76%", "arts": [{"t": "《國際經濟》美股賺爆 台日韓股噴漲 亞洲AI巨頭喊衝！", "u": "https://www.ctee.com.tw/news/20260805700798-430701", "s": "工商時報", "d": "2026-08-05"}, {"t": "《韓股》AI股點火 KOSPI指數漲逾4%", "u": "https://www.ctee.com.tw/news/20260805701074-430701", "s": "工商時報", "d": "2026-08-05"}, {"t": "《韓股》韓股漲近4% 6600得而復失", "u": "https://www.ctee.com.tw/news/20260805701645-430701", "s": "工商時報", "d": "2026-08-05"}, {"t": "謝金河：7月大狂殺之後 8月財報尋找亮點", "u": "https://money.udn.com/money/story/5607/9672635", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "韓國槓桿ETF規模增170%", "arts": [{"t": "台灣融資維持率真相？韓國做錯什麼，讓槓桿ETF變風暴中心？去槓桿風暴完全拆解", "u": "https://money.udn.com/money/story/12040/9673223", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "台韓股推升指數超過34%", "arts": [{"t": "貝萊德智庫：台韓半導體股發威 助新興市場今年大放異彩", "u": "https://money.udn.com/money/story/5599/9673487", "s": "經濟日報", "d": "2026-08-05"}]}]}, "145": {"id": 145, "title": "聯詠減碼目標414元、緯創升至275元", "synthesis": "美系外資對聯詠（3034）維持「減碼」評等，目標價414元，認為股價評價合理但AI市場曝險有限。聯詠第二季EPS為10.4元，季增68%、年增69%，主要受業外收益挹注；毛利率42.4%，存貨周轉天數增至67天，第三季營收估季增0%至5%。不過，聯詠受惠OLED面板滲透率提升、AI裝置升級需求及車用面板驅動IC出貨，外資自7月中旬起連續加碼17個交易日，股價站回500元大關。相較之下，美系外資上修緯創（3231）2026年至2028年機櫃出貨量與EPS預估，EPS分別為16.67元、23.32元及28.31元，目標價由210元升至275元，維持「買進」評等。緯創表示，2027年上半年AI伺服器需求強勁，但筆電需求預估於2026年下半年下降10%至20%。", "facts": ["聯詠（3034）目標價414元", "聯詠第二季EPS為10.4元", "聯詠外資連買17個交易日", "緯創（3231）目標價升至275元", "緯創2026年至2028年EPS估 仍是主要成長動能。同一報導指出，華碩（2357）受AI伺服器需求及筆電旺季帶動，第3季營收可望季增中個位數百分比。", "facts": ["鈊象第2季營收64.1億元", "授權營收年增24%", "鈊象單季稅前純益39.5億元", "法人估第3季授權增35%", "華碩第3季營收估季增中個位數"], "watch": "留意第3季鈊象授權及整體營收、華碩營收表現是否符合預期", "etype": "法人動向", "codes": ["2357", "3293"], "n": 1, "subs": [{"t": "鈊象授權營收年增24%", "arts": [{"t": "鈊象、華碩 四檔活跳跳", "u": "https://money.udn.com/money/story/5739/9671062", "s": "經濟日報", "d": "2026-08-05"}]}]}, "159": {"id": 159, "title": "通展精機九月取證成首家MR認證", "synthesis": "通展精機在財團法人精密機械研究發展中心輔導下，歷經九個月取得歐盟機械指令（MD）與新版機械法規（MR）雙證書，成為國內首家以CNC外圓磨床取得MR證書的廠商。新版機械法規將於2027年1月20日強制適用，並要求機械設備整合資訊安全與機械安全，通展精機此次取證涵蓋兩項歐盟規範。", "facts": ["通展精機歷經九個月取得雙證書", "取得歐盟MD與新版MR證書", "國內首家CNC外圓磨床MR認證", "新版法規2027年1月20日強制適用", "MR要求整合資訊安全與機械安全"], "watch": "2027年1月20日新版機械法規強制適用", "etype": "總經政策", "codes": [], "n": 1, "subs": [{"t": "通展精機歷時九個月取證", "arts": [{"t": "2027歐盟機械法規新制倒數 通展CNC磨床率先取得CE雙證書", "u": "https://money.udn.com/money/story/5635/9671357", "s": "經濟日報", "d": "2026-08-05"}]}]}, "160": {"id": 160, "title": "互宇向量陀螺儀隨石虎一號升空", "synthesis": "7月，「石虎一號」成功發射，互宇向量的光纖陀螺儀在軌開機，並穩定回傳數據。互宇向量與極星光電歷經16年研發，完成高階感測模組自製，並正式進入國際太空供應鏈。此次任務也顯示其產品已具備在軌運作與數據回傳成果，後續布局聚焦低軌衛星與無人載具需求。整體而言，事件涵蓋發射成功、設備在軌驗證，以及供應鏈與應用市場拓展三項進展。", "facts": ["石虎一號7月成功發射", "光纖陀螺儀在軌開機", "設備穩定回傳數據", "互宇向量與極星光電研發16年", "完成高階感測模組自製", "進入國際太空供應鏈", "布局低軌衛星與無人載具"], "watch": "", "etype": "產業供需", "codes": [], "n": 1, "subs": [{"t": "互宇向量研發歷經16年", "arts": [{"t": "台灣太空研發重要時刻！立方衛星「石虎一號」任務告捷 卡位低軌衛星商機", "u": "https://www.ctee.com.tw/news/20260805701296-430503", "s": "工商時報", "d": "2026-08-05"}]}]}, "161": {"id": 161, "title": "橋科匝道52億元動工2029年完工", "synthesis": "交通部高速公路局於8月5日舉行國道1號增設橋科匝道及集散道路工程動土典禮，工程經費為52.01億元，預計2029年7月完工。完工後，橋科園區重型車往返國道1號的行車時間，將由目前約10分鐘縮短至2分鐘，並預估每日可分流約1,500輛大型車，以改善園區聯外運輸效率與國道車流分布。", "facts": ["工程經費52.01億元", "預計2029年7月完工", "重車通行時間由10分鐘降至2分鐘", "預估每日分流1,500輛大型車"], "watch": "留意2029年7月工程是否如期完工。", "etype": "總經政策", "codes": [], "n": 1, "subs": [{"t": "橋科匝道動工2029年完工", "arts": [{"t": "橋科聯外交通再升級 國道1號橋科匝道動工、2029年完工縮短8成車程", "u": "https://money.udn.com/money/story/122328/9672671", "s": "經濟日報", "d": "2026-08-05"}]}]}, "162": {"id": 162, "title": "FUNNOW簽上市櫃輔導拓展東南亞", "synthesis": "FUNNOW集團於8月5日與台新證券簽訂股票上市櫃輔導契約，正式啟動進入台灣資本市場的規劃。集團目前海外市場營收占比已突破5成，並透過併購及合作持續拓展大東南亞市場。截至目前，FUNNOW已串聯超過16,000家商家，服務超過1,000萬名用戶，顯示其平台規模與海外營運布局持續擴大。", "facts": ["8月5日簽上市櫃輔導契約", "海外營收占比突破5成", "串聯超過16,000家商家", "服務超過1,000萬名用戶", "透過併購合作拓展東南亞"], "watch": "", "etype": "公司治理", "codes": [], "n": 1, "subs": [{"t": "FUNNOW串聯16,000家商家", "arts": [{"t": "《科技》FUNNOW與台新證券簽訂股票上市櫃輔導契約", "u": "https://www.ctee.com.tw/news/20260805701877-430503", "s": "工商時報", "d": "2026-08-05"}]}]}, "163": {"id": 163, "title": "花旗擴大看多AI鏈，聯發科目標6000元", "synthesis": "花旗環球證券認為AI基礎建設投資仍處多年擴張周期早期，受惠範圍涵蓋晶圓代工、封裝測試、AI晶片與客製化CPU。不同報告點名略有差異：一篇推薦台積電（2330）、聯電（2303）、日月光投控、聯發科（2454）與創意，另一篇擴大至六檔，新增台達電。花旗稱聯電矽光子與先進封裝未來幾年總投資額將達50億美元，台達電AI相關營收占比可達25%。法人預估聯電第三季晶圓出貨量季增7％～9％、產能利用率約90％，2026年AI相關營收近3億美元；投資專家另建議聚焦聯電（2303）與和碩（4938），並估和碩伺服器業務2026年營收年增8～10倍。聯發科（2454）獲調升至買進，目標價6000元，資料中心ASIC預計2026年第4季量產，2026年、2027年營收估為6565億元與1.12兆元。投顧法人另推薦14檔AI供應鏈股，但零組件成本上升，手機、筆電等傳統IT與消費電子出貨承壓。", "facts": ["聯發科目標價上調至6000元", "聯電2026年AI營收近3億美元", "聯電第三季出貨季增7％～9％", "台達電AI營收占比將達25%", "和碩伺服器營收年增8～10倍", "ASIC預計2026年第4季量產"], "watch": "留意聯發科資料中心ASIC於2026年第4季量產，以及聯電第三季出貨與產能利用率表現。", "etype": "法人動向", "codes": ["2303", "2330", "2385", "2409", "2454", "3008", "3017", "3081"], "n": 5, "subs": [{"t": "花旗喊買六檔、AI鏈14檔獲推薦", "arts": [{"t": "AI基建投資提速 台積電等半導體五天王外資力挺 「這些族群」也沾光", "u": "https://www.ctee.com.tw/news/20260805700065-430201", "s": "工商時報", "d": "2026-08-05"}, {"t": "半導體六雄 花旗喊買", "u": "https://money.udn.com/money/story/5607/9670671", "s": "經濟日報", "d": "2026-08-05"}, {"t": "科技股7月營收表現分歧 法人推薦這些 AI 供應鏈", "u": "https://money.udn.com/money/story/5607/9672025", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "聯電AI營收近3億美元、聯發科目標價6000元", "arts": [{"t": "聯電、和碩 營運動能正向", "u": "https://www.ctee.com.tw/news/20260805700305-430203", "s": "工商時報", "d": "2026-08-05"}, {"t": "聯發科 二檔有戲", "u": "https://money.udn.com/money/story/5739/9671074", "s": "經濟日報", "d": "2026-08-05"}]}]}, "164": {"id": 164, "title": "台燿漲停，2028年產能拚530萬張", "synthesis": "2026年8月5日，台燿（6274）股價以1,470元漲停，法人看好公司下半年產品漲價、擴產及高階規格升級。法人預估，台燿產能將由2026年的260萬張，提升至2027年的380萬張，並於2028年進一步增至530萬張，擴產幅度與高階產品升級成為市場關注重點。", "facts": ["台燿（6274）1,470元漲停", "法人看好下半年產品漲價", "2026年產能預估260萬張", "2027年產能預估380萬張", "2028年產能預估530萬張", "法人看好擴產與高階升級"], "watch": "留意下半年產品漲價、擴產及高階規格升級進展", "etype": "訂單產能", "codes": ["6274"], "n": 1, "subs": [{"t": "台燿產能升至530萬張", "arts": [{"t": "台燿跳空鎖漲停1,470元！法人揭下半年迎「四大利多」", "u": "https://money.udn.com/money/story/5607/9671983", "s": "經濟日報", "d": "2026-08-05"}]}]}, "165": {"id": 165, "title": "KONST簽SMX01拓展東南亞算力", "synthesis": "KONST於2026年8月5日與SM+ Data Centers及LG Sinar Mas簽署SMX01資料中心合作協議，將取得新一代液冷高密度資料中心容量，並部署GPU基礎設施、Neo Cloud與AI應用。此次合作將協助KONST建立東南亞據點，亦是公司首度跨出台灣布局算力，合作重點集中於資料中心容量取得及AI相關基礎設施部署。", "facts": ["KONST簽署SMX01合作協議", "合作方為SM+ Data Centers、LG Sinar Mas", "取得新一代液冷高密度容量", "部署GPU、Neo Cloud與AI應用", "首度跨出台灣布局東南亞算力"], "watch": "留意GPU基礎設施、Neo Cloud與AI應用的部署進度", "etype": "業務合作", "codes": [], "n": 1, "subs": [{"t": "KONST簽署SMX01協議", "arts": [{"t": "KONST 攜手 SM＋ Data Centers 與 LG Sinar Mas 簽署 SMX01 資料中心合作協議", "u": "https://www.ctee.com.tw/news/20260805702012-431202", "s": "工商時報", "d": "2026-08-05"}]}]}, "166": {"id": 166, "title": "群電擴充電源新品、佳世達布局無人機量產", "synthesis": "群電（6412）第二季合併營收84.43億元，季增8.5％，稅後純益8.29億元，EPS 2.03元。產品布局方面，美系通訊設備及衛星通訊電源新品自第四季起量產，多項AI及傳統伺服器電源新品則預計2027年第一季起量產。佳世達同步布局商用無人機事業，投資翔隆航太約19％、擎壤科技約18％；相關核心團隊約20人，整體規模接近百人，預計兩年內量產，並已與一家海外客戶簽署合作備忘錄，首階段出貨規模上百台。", "facts": ["群電（6412）Q2營收84.43億元", "群電Q2 EPS 2.03元", "群電通訊電源新品第四季量產", "伺服器電源新品2027年Q1量產", "佳世達投資翔隆航太約19％", "佳世達投資擎壤科技約18％", "無人機預計兩年內量產", "首階段出貨規模上百台"], "watch": "留意第四季群電通訊及衛星通訊電源新品量產，以及2027年第一季伺服器電源新品量產。", "etype": "訂單產能", "codes": ["6271", "6412"], "n": 3, "subs": [{"t": "群電Q4新品量產、同欣電Q3增4%至6%", "arts": [{"t": "群電新品Q4量產 AI電源明年接棒", "u": "https://www.ctee.com.tw/news/20260805700280-430502", "s": "工商時報", "d": "2026-08-05"}, {"t": "同欣電法說會／今年營運已恢復疫情前季節性走勢 AI 布局逐步開花結果", "u": "https://money.udn.com/money/story/5612/9672970", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "佳世達無人機兩年內量產", "arts": [{"t": "佳世達集團艦隊「無人機小隊起飛」 總座親督軍養大精兵：鎖定美日頂級客戶切入", "u": "https://money.udn.com/money/story/5612/9673201", "s": "經濟日報", "d": "2026-08-05"}]}]}, "167": {"id": 167, "title": "NVIDIA與SK合作逾5,000億美元", "synthesis": "NVIDIA與SK集團簽署意向書，雙方將展開超過5,000億美元的合作，範圍涵蓋AI記憶體、AI工廠及國家級AI基礎建設。投資布局方面，大華韓國KOSPI 50（009829）成分股包括SK海力士與三星電子等企業；該產品募集期間為8月3日至8月7日。", "facts": ["NVIDIA與SK簽署合作意向書", "合作金額超過5,000億美元", "涵蓋AI記憶體與AI工廠", "涵蓋國家級AI基礎建設", "009829布局SK海力士、三星電子", "募集期間為8月3日至8月7日"], "watch": "留意8月3日至8月7日大華韓國KOSPI 50（009829）募集進度。", "etype": "業務合作", "codes": ["009829"], "n": 1, "subs": [{"t": "NVIDIA與SK合作超過5,000億美元", "arts": [{"t": "美韓 AI 大聯盟成形 大華韓國 KOSPI 50 ETF 獲基本面利多", "u": "https://money.udn.com/money/story/5618/9672261", "s": "經濟日報", "d": "2026-08-05"}]}]}, "168": {"id": 168, "title": "太陽誘電上調全年利潤至450億日圓", "synthesis": "太陽誘電於2026年8月5日公布，截至6月底止的2027年度首季業績由虧轉盈，營業利益年增53％至48.2億日圓。公司同時上調全年營業利益預測，從原先300億日圓提高至450億日圓，主要反映AI伺服器需求強勁，以及多層陶瓷電容器（MLCC）使用量增加。此次財測調升與首季轉盈同步公布，顯示公司對全年獲利展望較原先預期樂觀。", "facts": ["2026年8月5日公布首季財報", "2027年度首季由虧轉盈", "首季營業利益年增53％至48.2億日圓", "全年預測由300億上調至450億日圓", "AI伺服器需求強勁、MLCC使用量增加"], "watch": "後續留意AI伺服器需求及MLCC使用量變化。", "etype": "財報", "codes": [], "n": 1, "subs": [{"t": "太陽誘電上調財測450億日圓", "arts": [{"t": "AI需求強 MLCC業者太陽誘電調高全年財測", "u": "https://www.ctee.com.tw/news/20260805702081-430704", "s": "工商時報", "d": "2026-08-05"}]}]}, "169": {"id": 169, "title": "力成受惠封測需求，目標價上看470元", "synthesis": "力成（6239）受惠記憶體封測需求、先進封裝放量，以及布局光通訊與AI高階封測，本土投顧看好其2026年下半年營運逐季走高，目標價上看470元。力成並與Broadcom在新加坡成立合資公司，預計於2026年底小量生產3D Optical Engine封裝，成為其拓展光通訊封裝業務的進展。", "facts": ["力成（6239）目標價上看470元", "受惠記憶體封測需求", "先進封裝持續放量", "布局光通訊與AI高階封測", "與Broadcom在新加坡成立合資公司", "預計年底小量生產3D Optical Engine封裝"], "watch": "留意2026年底3D Optical Engine封裝是否小量生產。", "etype": "法人動向", "codes": ["6239"], "n": 1, "subs": [{"t": "力成目標價上看470元", "arts": [{"t": "力成 三大引擎加持", "u": "https://www.ctee.com.tw/news/20260805700308-430203", "s": "工商時報", "d": "2026-08-05"}]}]}, "170": {"id": 170, "title": "和陞導入回收膠膜，環境部加碼綠色費率優惠", "synthesis": "和陞推出膠膜回收服務，將回收料重新導入產品製造，目前可提供添加35%回收料的產品，部分產品添加比例更達50%，並布局半導體、電子及高科技供應鏈市場。政策面上，環境部於8月5日公告修正物品回收清除處理費費率，添加25%以上塑膠再生料的電子產品，綠色費率優惠將由一般費率95折調整為約85折；同時，部分產品的徵收費率也將調整，修正內容自2027年1月1日起生效。", "facts": ["和陞產品回收料添加35%", "部分和陞產品添加比例達50%", "和陞布局半導體與電子供應鏈", "環境部綠色費率優惠調至約85折", "再生料添加門檻為25%以上", "部分產品徵收費率同步調整"], "watch": "留意2027年1月1日費率修正正式生效。", "etype": "產業供需", "codes": [], "n": 2, "subs": [{"t": "和陞推出回收膠膜35%", "arts": [{"t": "和陞打造膠膜回收新模式　搶攻永續供應鏈商機", "u": "https://www.ctee.com.tw/news/20260804701991-431203", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "環境部調高綠色優惠至約85折", "arts": [{"t": "明年調高循環電子產品綠色費率優惠 環部修正物品回收清除處理費費率", "u": "https://money.udn.com/money/story/7307/9673084", "s": "經濟日報", "d": "2026-08-05"}]}]}, "171": {"id": 171, "title": "立院三讀虛擬資產法、智慧局發布AI指引", "synthesis": "6月30日，立法院三讀通過「虛擬資產服務法」，將虛擬資產服務商監管由登記制推進至許可制，並規範穩定幣十足準備及資產隔離。配合數位資產業務發展，和泰產險與凱基銀行推出數位資產託管風險保障保險；富邦產險則為MaiCoin集團旗下現代財富科技規劃數位資產專業責任與犯罪保險整合方案。另一方面，經濟部智慧財產局完成「生成式人工智慧著作權指引」1.0版，列出不受保護標的、著作權逾期著作及CC0三類合理使用範疇；對其餘利用受著作權保護的資料，原則上應取得著作財產權人授權。", "facts": ["6月30日立院三讀虛擬資產服務法", "虛擬資產服務商由登記制改許可制", "穩定幣須十足準備與資產隔離", "和泰產險、凱基銀行推託管保險", "富邦產險為現代財富科技規劃保險", "智慧局發布生成式AI著作權指引1.0版", "三類合理使用範疇，其餘原則須授權"], "watch": "", "etype": "總經政策", "codes": [], "n": 2, "subs": [{"t": "立法院三讀通過專法6月30日", "arts": [{"t": "虛擬資產專法通過 部分產險已啟動託管與責任保障布局", "u": "https://www.ctee.com.tw/news/20260805701115-430303", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "智慧局發布指引1.0版", "arts": [{"t": "生成式AI著作權指引1.0出爐 列三大類合理使用 餘都要授權", "u": "https://www.ctee.com.tw/news/20260805701974-430503", "s": "工商時報", "d": "2026-08-05"}]}]}, "172": {"id": 172, "title": "寄居蟹6800戶轉銜；坤悅砸10.5億買地", "synthesis": "兆基集團相關企業財務風波延燒，寄居蟹承作的社會住宅包租代管案件可能全面轉銜，住都中心將依程序比對資料，再由兆基或其他合法業者承接，全台約6800戶受影響。另一方面，坤悅開發（5206）於2026年8月5日公告，向董事長陳丕岳之父陳世坤購買台中市西屯區惠民段76地號土地，基地約348.25坪，交易總價10億5,171.5萬元，每坪約302萬元；該地未來可與78地號合併開發，兩筆土地合計約722.36坪。", "facts": ["社宅包租代管約6800戶可能轉銜", "住都中心將比對資料安排承接", "坤悅開發（5206）砸10億5,171.5萬元買地", "惠民段76地號基地約348.25坪", "每坪交易價格約302萬元", "76、78地號合計約722.36坪"], "watch": "留意住都中心資料比對及兆基或其他合法業者承接程序。", "etype": "房市", "codes": ["5206"], "n": 2, "subs": [{"t": "寄居蟹社宅案件轉銜6800戶", "arts": [{"t": "寄居蟹恐退出社宅包租代管 全台6,800戶轉銜方向曝光", "u": "https://money.udn.com/money/story/5621/9672028", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "坤悅開發砸10.5億元買地", "arts": [{"t": "坤悅開發再砸10億元整併台中七期惠民段76地號土地 每坪單價達302萬元", "u": "https://money.udn.com/money/story/5621/9673368", "s": "經濟日報", "d": "2026-08-05"}]}]}, "173": {"id": 173, "title": "中華電信IDC市占78%並擴建36MW", "synthesis": "中華電信（2412）8月5日表示，截至第二季與子公司是方電訊合計提供的資料中心容量，已占台灣整體IDC市占78%，並啟用桃園崙坪AIDC園區，容量最高36MW且已有大CSP客戶預約。法說會另稱，林口及台中AIDC建置後合計最高提供36MW，報導對36MW所指園區有所不同。AI需求帶動美國及東南亞AI基礎建設、海纜與AIDC商機，美國AI供應鏈專案未來兩至三年潛在商機達數十億美元；上半年資通訊業務簽約金額年增八成，已達2025年全年水準，美國營收年增1,157%，在手訂單超過數十億元。上半年每股純益2.68元、ICT營收年增32%，第2季每股純益1.38元。中華資安（7765）看好AI資安需求，目標雙位數成長。另據8月4日消息，馬祖新海纜預計9月上線，澎湖、金門新海纜也將上線；中華電信過去一年新增投資兩條國際海纜，並完成下行1.3Gbps、上行400Mbps技術驗證。", "facts": ["IDC市占率達78%", "崙坪AIDC容量最高36MW", "上半年簽約金額年增八成", "美國營收年增1,157%", "上半年每股純益2.68元", "AI供應鏈商機達數十億美元", "新增投資兩條國際海纜"], "watch": "留意馬祖新海纜9月上線，以及澎湖、金門新海纜上線進度。", "etype": "訂單產能", "codes": ["2412", "7765"], "n": 5, "subs": [{"t": "中華電信IDC市占78%並擴建36MW", "arts": [{"t": "中華電：集團在國內IDC中心市占已達78％", "u": "https://www.ctee.com.tw/news/20260805701672-430502", "s": "工商時報", "d": "2026-08-05"}, {"t": "《通網股》中華電搶吃AI大餅！海外商機數十億美元、AIDC容量衝36MW", "u": "https://www.ctee.com.tw/news/20260805701796-430201", "s": "工商時報", "d": "2026-08-05"}, {"t": "中華電信法說會／崙坪 AIDC 將加入營運 大 CSP 預約進駐", "u": "https://money.udn.com/money/story/5612/9673070", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "中華電信新增投資兩條海纜", "arts": [{"t": "2026前瞻次世代通訊論壇》中華電信總經理林榮賜：通訊躍國家戰略資產", "u": "https://www.ctee.com.tw/news/20260805700096-430502", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "中華電信簽約金額年增八成", "arts": [{"t": "中華電攻 AI 傳捷報", "u": "https://money.udn.com/money/story/5710/9673175", "s": "經濟日報", "d": "2026-08-05"}]}]}, "174": {"id": 174, "title": "國票金民股副董年薪2000萬引治理介入", "synthesis": "國票金5月董事會改選後，支持耐斯集團陳冠舟出任民股推派副董事長，任期3年、年薪2000萬元，任期薪酬總額達6000萬元。此安排引發外界對公公併規劃及公股治理的關注。8月4日，立法院通過藍委提案，要求財政部所屬公股在正、副董事長選舉時，不得支持非公股代表；財政部已接受提案，並將進行專案報告。", "facts": ["陳冠舟任國票金民股副董3年", "副董年薪2000萬元", "任期薪酬總額6000萬元", "5月董事會完成改選", "8月4日立院通過藍委提案", "財政部接受提案並將專案報告"], "watch": "留意財政部後續專案報告及公股正副董事長選舉規範落實。", "etype": "公司治理", "codes": [], "n": 2, "subs": [{"t": "國票金副董年薪2000萬引公股介入", "arts": [{"t": "公股正副董改選 財部不得挺非公股代表", "u": "https://www.ctee.com.tw/news/20260805700118-430101", "s": "工商時報", "d": "2026-08-05"}, {"t": "【重磅快評】國票金轉骨生出昂貴雞肋是執行誰的意志？", "u": "https://money.udn.com/money/story/7307/9671918", "s": "經濟日報", "d": "2026-08-05"}]}]}, "175": {"id": 175, "title": "億光控告日亞化侵害美國LED專利", "synthesis": "億光電子（2393）於7月30日向美國密西根東區聯邦地方法院提起專利侵權訴訟，對象為Nichia Corporation。億光指控，Nichia Corporation製造及銷售的高功率LED產品，侵害其美國覆晶專利US 7,554,126。該專利涉及車用LED、照明及顯示等應用領域。現有報導未提供求償金額、涉案產品具體型號或法院後續審理時程。", "facts": ["億光電子（2393）7月30日提告", "被告為Nichia Corporation", "涉案專利為US 7,554,126", "標的涵蓋高功率LED產品", "應用涉及車用、照明及顯示"], "watch": "留意美國密西根東區聯邦地方法院後續訴訟進展。", "etype": "公司治理", "codes": ["2393"], "n": 1, "subs": [{"t": "億光控告日亞化US 7,554,126", "arts": [{"t": "億光繼控告 Lumileds、SSC 在美國針對日亞化提起 LED 專利侵權訴訟", "u": "https://money.udn.com/money/story/5648/9672239", "s": "經濟日報", "d": "2026-08-05"}]}]}, "176": {"id": 176, "title": "聯亞（3081）連續漲停收2,160元", "synthesis": "美國政府傳出擬禁止中國大陸製光收發模組進口，矽光子與CPO概念股成為資金焦點。輝達宣布CPO進入量產，上游磷化銦則傳出供不應求，推升相關題材受到市場關注。股價方面，聯亞（3081）連續多天漲停，8月5日收2,160元；華星光、波若威同日分別收492元、722元。上述進口限制目前仍是美國政府「傳出擬」推動的措施。", "facts": ["美國擬禁中國製光收發模組進口", "輝達宣布CPO進入量產", "磷化銦傳出供不應求", "聯亞（3081）8月5日收2,160元", "華星光收492元、波若威收722元"], "watch": "留意美國政府是否落實禁止中國大陸製光收發模組進口。", "etype": "產業供需", "codes": ["3081"], "n": 1, "subs": [{"t": "聯亞股價收2,160元", "arts": [{"t": "矽光子、CPO 概念股 吸金", "u": "https://money.udn.com/money/story/5607/9673128", "s": "經濟日報", "d": "2026-08-05"}]}]}, "177": {"id": 177, "title": "東佑達8月6日登錄興櫃、營收增41%", "synthesis": "凱基證券輔導東佑達（7942）預計於2026年8月6日登錄興櫃交易。公司受惠AI伺服器與半導體設備需求，2026年上半年營收年增41%，毛利率為32.6%，每股盈餘7.46元；產品售價則調升約10%到15%。此次登錄興櫃將成為東佑達進入公開交易市場的重要進程，市場可同步關注需求動能、價格調整對毛利率與獲利表現的影響。", "facts": ["8月6日登錄興櫃交易", "2026上半年營收年增41%", "2026上半年毛利率32.6%", "2026上半年EPS 7.46元", "產品售價調升約10%到15%"], "watch": "2026年8月6日東佑達（7942）登錄興櫃交易。", "etype": "訂單產能", "codes": ["7942"], "n": 1, "subs": [{"t": "東佑達8月6日登錄興櫃", "arts": [{"t": "掌握 AI 與半導體雙引擎成長商機 凱基證券輔導東佑達登錄興櫃", "u": "https://money.udn.com/money/story/121887/9672179", "s": "經濟日報", "d": "2026-08-05"}]}]}, "178": {"id": 178, "title": "NVIDIA開源儲存堆疊，Vera效能達3.21倍", "synthesis": "NVIDIA在Future of Memory and Storage大會宣布，將cuFile應用程式介面（API）與底層儲存軟體堆疊開源，讓GPU能直接讀寫儲存裝置，降低資料在GPU與儲存系統間搬移的限制。NVIDIA並透過Storage-Next計畫串聯逾40家業者，推動高速且具互通性的AI儲存生態系；同時推出SCADA框架，以降低大型資料集搬移造成的負擔。效能測試顯示，NVIDIA Vera CPU在兩階段壓縮與加密管道中的輸送量最高達x86 CPU的3.21倍。", "facts": ["cuFile API及底層儲存軟體堆疊開源", "GPU可直接讀寫儲存裝置", "Storage-Next串聯逾40家業者", "SCADA降低大型資料集搬移負擔", "Vera CPU輸送量最高達x86的3.21倍"], "watch": "", "etype": "產業供需", "codes": [], "n": 2, "subs": [{"t": "NVIDIA開源儲存堆疊，Vera效能達3.21倍", "arts": [{"t": "NVIDIA加速AI儲存布局 cuFile開源、串聯逾40家業者突破資料瓶頸", "u": "https://www.ctee.com.tw/news/20260805701444-430704", "s": "工商時報", "d": "2026-08-05"}, {"t": "NVIDIA於FMS大會 展示用AI應用程式直接存取儲存裝置", "u": "https://money.udn.com/money/story/5612/9672500", "s": "經濟日報", "d": "2026-08-05"}]}]}, "179": {"id": 179, "title": "通寶半導體擴編至180人布局ASIC", "synthesis": "通寶半導體（7913）專注事務機與高速影像處理SoC，已取得全球第三方事務機晶片約6.6％市占率，並獲Arm策略投資。公司持續布局ASIC客製化設計，預估自2027年開始認列NRE收入；為支應相關研發需求，研發人力將提升至150至180人。", "facts": ["全球第三方事務機晶片市占約6.6％", "通寶半導體獲Arm策略投資", "布局ASIC客製化設計", "2027年起預估認列NRE收入", "研發人力將增至150至180人"], "watch": "留意2027年ASIC客製化設計NRE收入開始認列。", "etype": "訂單產能", "codes": ["7913"], "n": 1, "subs": [{"t": "通寶半導體擴編至180人", "arts": [{"t": "智慧經營／通寶半導體董事長沈軾榮 長期投入 站上制高點", "u": "https://money.udn.com/money/story/122331/9673326", "s": "經濟日報", "d": "2026-08-05"}]}]}, "180": {"id": 180, "title": "高端疫苗完成首批EV71疫苗出口越南", "synthesis": "高端疫苗（6547）8月4日宣布，自主研發的腸病毒71型（EV71）疫苗已完成品質檢驗及批次放行，並啟動首批出口越南作業。越南藥品管理局已核發當地首張腸病毒疫苗上市許可，產品將陸續運抵越南供應市場。高端疫苗8月5日進一步完成首批疫苗出口，後續將持續運送各批次疫苗。消息公布後，8月5日股價漲停至52.1元，盤面有超過1100張買單排隊。", "facts": ["8月4日宣布啟動首批出口越南", "EV71疫苗完成品質檢驗及批次放行", "越南核發首張腸病毒疫苗上市許可", "8月5日完成首批疫苗出口", "股價漲停至52.1元", "超過1100張買單排隊"], "watch": "留意高端疫苗後續各批次疫苗運送及越南市場供應進度。", "etype": "訂單產能", "codes function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
      <span class="chip">已讀 ${seen.size}/${Object.keys(C).length}</span></div>
    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';
  renderGrid();
}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
</body></html>
