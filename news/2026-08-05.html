": "8月5日SpaceX公布上市後首份財報，第二季營收78.1億美元，年增92%、高於預期69.3億美元；淨損5.41億美元、每股虧損0.09美元，另有報導列營業虧損1.43億美元。資本支出183.7億美元，其中158.3億美元投向AI基礎建設、星艦及星鏈；AI業務營業虧損12.6億美元，網路服務營業利益16.6億美元，盤後股價跌約8.8%至9%，IPO後跌8%。超微（AMD）第二季營收115.4億美元（另載115億美元）、年增50%近50%，調整後EPS1.66美元；資料中心營收67億至67.2億美元、年增107%至逾一倍，第三季財測130億美元±3億美元仍令市場失望，股價跌約7%至8.9%；公司預期2026財年下半年伺服器營收增逾80%，蘇姿丰稱2027年資料中心營收增逾一倍。台股方面，亞德客-KY（1590）7月營收39.94億元、年增50.78%，前7月261.72億元、增32.67%；達發（6526）Q2營收62.9億元、EPS5.25元，2026年營收估增逾4倍、2027年再增逾3倍；德微科技（3675）7月營收2.91億元、增29.78%，上半年EPS3.51元、淨利增611%。聯詠（3034）Q2營收286.6億元、EPS10.4元，外資維持減碼、目標價414元；瑞鼎（3592）Q2營收68.21億至68.2億元，但預期Q3動能放緩。宏捷科（8086）前7月營收增39.99%，Q3估持平或小幅衰退；宏碁資訊（6811）上半年營收59.23至59.24億元、EPS9.49元創高。台特化（4772）上半年淨利增90.26%、EPS2.83元；晶技（3042）上半年EPS2.96元。永擎（7711）Q2 EPS9.76元創高；熙特爾新能源上半年營收72.74億元、增1,508%；Palantir全年營收上修至81.6億美元，帶動8月4日股價漲25%；勤凱Q2 EPS2.71元，受AI與MLCC拉貨帶動Q3可望續旺。", "facts": ["SpaceX Q2營收78.1億美元、增92%", "超微Q3財測130億美元±3億美元", "聯詠外資減碼、目標價414元", "亞德客-KY前7月營收增32.67%", "德微上半年EPS3.51元、增611%", "Palantir全年營收上修81.6億美元", "熙特爾上半年營收增1,508%"], "watch": "留意超微第三季營收能否達130億美元上下3億美元，以及SpaceX重投AI後AI業務虧損能否收斂。", "etype": "財報", "codes": ["1590", "3034", "3042", "3592", "3675", "4772", "6526", "6811"], "n": 25, "subs": [{"t": "SpaceX首份財報營收增92%但重投AI", "arts": [{"t": "SpaceX IPO後首份財報亮相！營收增92％但AI燒錢加劇 盤後一度跌9％", "u": "https://www.ctee.com.tw/news/20260805700489-430704", "s": "工商時報", "d": "2026-08-05"}, {"t": "SpaceX IPO首個季度財報出爐 營收成長超出預期", "u": "https://www.ctee.com.tw/news/20260805700788-430704", "s": "工商時報", "d": "2026-08-05"}, {"t": "SpaceX 財報／上季營收翻倍 星鏈業務狂飆 但 AI 支出暴增拖累盤後重挫7%", "u": "https://money.udn.com/money/story/5599/9671381", "s": "經濟日報", "d": "2026-08-05"}, {"t": "SpaceX與超微公布財報　盤後交易股價走低", "u": "https://money.udn.com/money/story/5599/9671294", "s": "經濟日報", "d": "2026-08-05"}, {"t": "SpaceX首份財報營收優於預期　受惠星鏈AI事業成長", "u": "https://money.udn.com/money/story/123398/9671289", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "超微Q2營收增50%但Q3展望失望", "arts": [{"t": "超微Q2財報優預期 資料中心營收暴增107％ 盤後為何暴跌9％？", "u": "https://www.ctee.com.tw/news/20260805700404-430704" 業外收益近30億元挹注。線纜本業則受惠台電強韌電網計畫及民間企業訂單，在手訂單超過百億元。股價於4日以34.25元漲停收市，市場同步反映獲利創高與訂單能見度。", "facts": ["上半年EPS達7.04元創新高", "第二季EPS為6.67元", "轉投資業外挹注近30億元", "在手訂單超過百億元", "4日股價34.25元漲停收市"], "watch": "後續留意台電強韌電網計畫及民間企業訂單消化情況。", "etype": "財報", "codes": ["1608"], "n": 1, "subs": [{"t": "華榮上半年EPS7.04元", "arts": [{"t": "華榮 站上所有均線", "u": "https://www.ctee.com.tw/news/20260805700274-430204", "s": "工商時報", "d": "2026-08-05"}]}]}, "23": {"id": 23, "title": "三陽工業7月市占46.2%連冠20月", "synthesis": "暑假購車旺季帶動台灣機車市場，7月總領牌量兩篇報導分別稱為7.09萬輛與7萬899台，均指月增5.30%、年增8.59%；前七月累計43.43萬輛，年增9.81%。三陽工業（2206）7月銷量3萬2749台，市占46.2%，連續20個月居市場第一；另一篇則概述銷量為3.27萬輛。車系表現方面，JET系列銷售突破6400台，迪爵系列銷售1萬3050台。多數業者看好8月台灣機車市場維持高水位。", "facts": ["7月機車領牌量7.09萬輛或7萬899台", "7月機車市場年增8.59%", "前七月累計43.43萬輛，年增9.81%", "三陽工業（2206）市占46.2%", "三陽工業連續20個月市占第一", "迪爵系列7月銷售1萬3050台"], "watch": "留意8月台灣機車市場是否維持高水位。", "etype": "產業供需", "codes": ["2206"], "n": 2, "subs": [{"t": "三陽7月市占46.2%連冠20月", "arts": [{"t": "暑假旺 7月機車領牌數回春", "u": "https://www.ctee.com.tw/news/20260805700189-430503", "s": "工商時報", "d": "2026-08-05"}, {"t": "《汽車股》機車7月銷量旺季雙增 三陽市占連20月摘冠", "u": "https://www.ctee.com.tw/news/20260805700614-430201", "s": "工商時報", "d": "2026-08-05"}]}]}, "24": {"id": 24, "title": "環球晶Q2獲利創高、簽美光10年約", "synthesis": "環球晶（6488）8月4日公布第二季合併營收152.1億元或152.14億元，季增8.8%、年減5%；稅後純益37.8億元或37.79億元，EPS均為7.9元，獲利季增約99.3%。報導對獲利表現的描述不同，一篇稱年增1.24倍、創近十季新高，另一篇稱創近2年半高。上半年營收291.99億元、年減7.6%，稅後淨利56.74億元、年增80.84%，但新廠折舊與成本壓抑毛利率。公司表示AI及HPC需求改善，12吋、8吋、6吋及GaN產線接近或幾乎滿載，並將調度產能降低義大利Novara廠火災衝擊；徐秀蘭表示火警限於8吋產線局部區域，已進行損害評估、復原及保險理賠，並以跨廠支援及加速驗證降低交付影響。環球晶已與美光簽署10年長約、取得逾5億美元預付款，力拚2026年第三季營收優於第二季；公司預期全年業績持平到成長，2027年新產能、SOI及矽光子產品放量，矽晶圓現貨價可望上漲。", "facts": ["Q2營收152.1億至152.14億元", "Q2稅後純益37.8億至37.79億元", "EPS 7.9元，獲利季增約99.3%", "與美光簽10年長約，預收逾5億美元", "Novara火警限於8吋產線局部區域", "上半年淨利56.74億元，年增80.84%"], "watch": "留意2026年第三季營收是否優於第二季，以及2027年新產能、SOI與矽光子產品放量。", "etype": "財報", "codes": ["6488"], "n": 5, "subs": [{"t": "環球晶Q2獲利創高、簽美光10年長約", "arts": [{"t": "環球晶：矽晶圓產線近滿載", "u": "https://www.ctee.com.tw/news/20260805700101-430501", "s": "工商時報", "d": "2026-08-05"}, {"t": "《半導體》環球晶Q3營收拚勝Q2 市況好轉添2027成長動能", "u": "https://www.ctee.com.tw/news/20260805700584-430201", "s": "工商時報", "d": "2026-08-05"}, {"t": "《半導體》環球晶Q2獲利近2年半高 H1每股賺11.87元", "u": "https://www.ctee.com.tw/news/20260805700585-430201", "s": "工商時報", "d": "2026-08-05"}, {"t": "環球晶Q2獲利攀近十季新高", "u": "https://money.udn.com/money/story/5612/9670981", "s": "經濟日報", "d": "2026-08-05"}]}, {"t": "環球晶義大利廠火警影響8吋產線", "arts": [{"t": "環球晶本季營運變數增 義大利廠火警影響 惟全年業績有望持平到成長", "u": "https://money.udn.com/money/story/5612/9670978", "s": "經濟日報", "d": "2026-08-05"}]}]}, "25": {"id": 25, "title": "大立光漲停4355元、光寶科連3漲停", "synthesis": "8月4日，大立光（3008）受惠下半年蘋果新機拉貨與CPO題材，股價攻上漲停4,355元並鎖至收盤，漲停委買近2,400張。董事長林恩平表示，7月出貨優於6月、8月優於7月，可變光圈產品第三季逐漸放量，首條自動化試產線預計第三季底完成。光寶科（2301）以233.5元開出後攻上漲停252元，連3日漲停，成交量爆增逾6.5萬張。公司策略投資DenseLight，導入連續波分布回饋雷射及MicroLED應用，法人預期相關布局將於2027年下半年至2028年貢獻。", "facts": ["大立光漲停至4355元", "大立光漲停委買近2400張", "可變光圈產品第三季放量", "自動化試產線第三季底完成", "光寶科連3日漲停至252元", "光寶科成交量逾6.5萬張", "DenseLight布局2027下半年至2028年貢獻"], "watch": "留意第三季可變光圈產品放量、第三季底自動化試產線完成，以及2027年下半年至2028年DenseLight布局貢獻。", "etype": "業務合作", "codes": ["2301", "3008"], "n": 2, "subs": [{"t": "大立光漲停4355元、光寶科連3日漲停", "arts": [{"t": "大立光 題材加持攻漲停", "u": "https://www.ctee.com.tw/news/20260805700255-430204", "s": "工商時報", "d": "2026-08-05"}, {"t": "光寶科 醞釀挑戰前高", "u": "https://www.ctee.com.tw/news/20260805700253-430204", "s": "工商時報", "d": "2026-08-05"}]}]}, "26": {"id": 26, "title": "高端疫苗首批EV71疫苗出口越南", "synthesis": "高端疫苗8月4日宣布，自主研發的腸病毒71型（EV71）疫苗已完成品質檢驗及批次放行，正式啟動首批出口越南作業。該產品取得越南藥品管理局核發的首張腸病毒疫苗上市許可，後續將陸續運抵越南，供應當地市場。", "facts": ["8月4日宣布啟動首批出口", "EV71疫苗完成品質檢驗及批次放行", "取得越南首張腸病毒疫苗上市許可", "疫苗將陸續運抵越南供應市場"], "watch": "留意疫苗陸續運抵越南並供應當地市場的進度。", "etype": "訂單產能", "codes": [], "n": 1, "subs": [{"t": "高端疫苗啟動首批出口", "arts": [{"t": "里程碑！高端EV71疫苗出口越南", "u": "https://www.ctee.com.tw/news/20260805700195-430504", "s": "工商時報", "d": "2026-08-05"}]}]}, "27": {"id": 27, "title": "中國服務PMI降至50.4、台灣製造升至61.5", "synthesis": "RatingDog與標普全球公布，中國7月服務業PMI降至50.4，較6月回落3.7個百分點，創2024年9月以來最低；綜合PMI降至50.8，為一年低點。服務業仍處擴張區間，但新業務增速與企業信心均放緩。相較之下，台灣7月製造業PMI升至61.5，創近五年最快擴張，新訂單與生產指數分別為63.3、62.7；科技型ETF前十強今年以來均漲逾60%，富邦台灣半導體ETF（00892）報酬率為88.61%，市場看好AI帶動半導體需求。中國投資占GDP比重超過40%，但經濟增速僅4％到5％，IMF在2025年報告形容中國「過度投資」。過剩產能推升出口，德國企業同時面臨中國需求疲弱與海外低價競爭，富埃斯特預期各國提高關稅壁壘。", "facts": ["中國服務業PMI降至50.4", "綜合PMI降至50.8，創一年低點", "台灣製造業PMI升至61.5", "新訂單、生產指數為63.3、62.7", "富邦台灣半導體ETF（00892）報酬率88.61%", "中國投資占GDP超過40%，增速4％到5％", "IMF 2025年報告稱中國過度投資", "富埃斯特預期各國提高關稅壁壘"], "watch": "留意各國提高關稅壁壘的進展。", "etype": "產業供需", "codes": ["00892"], "n": 3, "subs": [{"t": "台灣製造業PMI升至61.5", "arts": [{"t": "台股科技ETF十強 今年漲逾6成", "u": "https://www.ctee.com.tw/news/20260805700324-430403", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "中國服務業PMI降至50.4", "arts": [{"t": "標普7月份大陸服務業PMI大降至50.4", "u": "https://www.ctee.com.tw/news/20260805700814-430803", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "中國投資占GDP超過40％", "arts": [{"t": "陸GDP虛胖？IMF揭「過度投資」真相 德企憂營運前景", "u": "https://www.ctee.com.tw/news/20260805700811-430801", "s": "工商時報", "d": "2026-08-05"}]}]}, "28": {"id": 28, "title": "威加涉假油偉訓力韡破產可迴轉11億", "synthesis": "威加國際疑進口大陸劣質苦茶籽，混充台灣原料製油，導致永豐餘等品牌苦茶油被檢出苯駢芘超標。調查局於8月4日搜索並約談7人；一篇報導稱其中5人深夜移送台北地檢署，另一篇則指台北地檢署認定陳沅農、陳鐘秀惠涉製作假油，依違反食安法聲押禁見，威加國際負責人涂傑生以100萬元交保。涉案永豐餘生技苦茶油已停售、下架及回收，源春製油廠等案件由嘉義地檢署偵辦。另方面，偉訓（3032）8月4日董事會通過，持股78%的子公司力韡停止營業並聲請破產，因電動家用床產品瑕疵爭議面臨約4,859萬美元仲裁賠償。待法院完成破產程序後，力韡將排除偉訓合併報表，先前超額認列的損失可望迴轉逾11億元，後續也不須再認列相關損失。", "facts": ["威加8月4日遭搜索並約談7人", "5人深夜移送台北地檢署", "兩人聲押禁見、涂傑生100萬交保", "苦茶油停售、下架並回收", "偉訓（3032）持股78%力韡聲請破產", "力韡仲裁賠償約4,859萬美元", "破產後可迴轉逾11億元"], "watch": "留意法院完成力韡破產程序，以及威加案件後續偵辦結果。", "etype": "公司治理", "codes": ["3032"], "n": 4, "subs": [{"t": "偉訓力韡破產可迴轉逾11億元", "arts": [{"t": "產品瑕疵爭議賠償金付不起 偉訓子公司力韡聲請破產", "u": "https://www.ctee.com.tw/news/20260805700282-430502", "s": "工商時報", "d": "2026-08-05"}, {"t": "利空意外變利多 偉訓揮別子公司仲裁賠償利空衝漲停", "u": "https://www.ctee.com.tw/news/20260805700778-430201", "s": "工商時報", "d": "2026-08-05"}]}, {"t": "威加國際疑混充劣質苦茶籽5人移送", "arts": [{"t": "影／毒油風暴延燒…苦茶籽油爆陸製黑心貨 威加國際負責人5被告送辦", "u": "https://money.udn.com/money/story/5648/9671160", "s": "經濟日報", "d": "2026-08-05"}, {"t": "影／苦茶癌油漏洞浮現 威加國際混陸製劣油 2人聲押、負責人百萬交保", "u": "https://money.udn.com/money/story/5648/9671246", "s": "經濟日報", "d": "2026-08-05"}]}]}, "29": {"id": 29, "title": "信邦7月營收創高年增28.97%", "synthesis": "信邦（3023）公布2026年7月營收31.67億元，月增2.41%、年增28.97%，連續第四個月創下新高。累計2026年前7月營收205.54億元，年增11.44%。公司預估，無人機業務2026年將呈倍數成長，並看好未來兩年維持強勁動能。", "facts": ["7月營收31.67億元", "7月營收月增2.41%", "7月營收年增28.97%", "前7月營收205.54億元", "無人機業務今年估倍數成長"], "watch": "留意未來兩年無人機業務是否維持強勁動能。", "etype": "財報", "codes": ["3023"], "n": 1, "subs": [{"t": "信邦7月營收31.67億元", "arts": [{"t": "信邦7月營收 連四個月登峰", "u": "https://www.ctee.com.tw/news/20260805700251-430502", "s": "工商時報", "d": "2026-08-05"}]}]}, "30": {"id": 30, "title": "中砂7月營收增26.5%並調升砂輪報價", "synthesis": "中砂（1560）公布7月合併營收為8.86億元，月增6.4%、年增26.5%；累計2026年前七月營收56.72億元，年增23.5%。公司持續擴充鑽石碟與晶圓再生產能，並自7月起調整砂輪報價，幅度大致約15%，營收成長與產品報價調整進度為後續觀察重點。", "facts": ["7月營收8.86億元，年增26.5%", "前七月營收56.72億元，年增23.5%", "7月營收月增6.4%", "7月起砂輪報價調整約15%", "持續擴充鑽石碟與晶圓再生產能"], "watch": "留意7月起砂輪報價調整約15%後的營收表現，以及鑽石碟與晶圓再生產能擴充進度。", "etype": "財報", "codes": ["1560"], "n": 1, "subs": [{"t": "中砂7月營收8.86億元", "arts": [{"t": "中砂財報／7月8.86億元、年增26.5％ 續創新高", "u": "https://money.udn.com/money/story/5710/9671792", "s": "經濟日報", "d": "2026-08-05"}]}]}, "31": {"id": 31, "title": "通展精機九個月取得歐盟機械雙證書", "synthesis": "通展精機在財團法人精密機械研究發展中心輔導下，歷經九個月取得歐盟機械指令（MD）與新版機械法規（MR）雙證書，成為國內首家以CNC外圓磨床取得MR證書的廠商。新版機械法規將於2027年1月20日強制適用，要求機械設備整合資訊安全與機械安全，通展精機此次取證反映其產品已完成相關法規要求。", "facts": ["通展精機歷時九個月取得雙證書", "取得歐盟MD與新版MR證書", "國內首家CNC外圓磨床取得MR", "MR將於2027年1月20日強制適用", "新版法規要求整合資安與機械安全"], "watch": "留意2027年1月20日新版機械法規強制適用。", "etype": "總經政策", "codes": [], "n": 1, "subs": [{"t": "通展精機歷時九個月取證", "arts": [{"t": "2027歐盟機械法規新制倒數 通展CNC磨床率先取得CE雙證書", "u": "https://money.udn.com/money/story/5635/9671357", "s": "經濟日報", "d": "2026-08-05"}]}]}, "32": {"id": 32, "title": "頎邦Q2毛利率升至30.3%外資上調目標價", "synthesis": "頎邦（6147）第二季營收季增15%，毛利率升至30.3%，帶動外資調整評價。花旗環球證券因此將頎邦推測合理股價由原評估調升至230元；瑞銀則維持「買進」評等，目標價為290元。展望第三季，頎邦營收可望再季增7%，其中矽光子營收預估季增30%，成為後續營運成長重點。", "facts": ["頎邦Q2營收季增15%", "Q2毛利率升至30.3%", "花旗目標價調升至230元", "瑞銀維持買進、目標價290元", "Q3營收可望季增7%", "矽光子營收估季增30%"], "watch": "留意第三季營收季增7%及矽光子營收季增30%的預估是否實現。", "etype": "法人動向", "codes": ["6147"], "n": 1, "subs": [{"t": "外資調升頎邦目標價230元", "arts": [{"t": "股價跌6成能重返榮耀？頎邦Q2毛利率大反彈 新目標價出爐外資喊買", "u": "https://www.ctee.com.tw/news/20260805700233-430201", "s": "工商時報", "d": "2026-08-05"}]}]}, "33": {"id": 33, "title": "朝和生醫2027年進軍馬來西亞", "synthesis": "世紀*（5314）旗下朝和生醫規劃進軍馬來西亞，並預計於2027年推動上市，作為拓展東南亞市場的布局。公司目前公布的產品表現顯示，其口服外泌體系列在台灣累計銷售量已突破百萬件，消費者回購率也突破8成。此次計畫將既有在台銷售成果延伸至馬來西亞，並以當地上市安排作為進入東南亞市場的具體節點。原文未提供馬來西亞上市的產品範圍、時程細節或預期營收，後續仍應以公司公告為準。", "facts": ["朝和生醫預計2027年馬來西亞上市", "世紀*（5314）旗下朝和生醫", "口服外泌體在台銷售突破百萬件", "消費者回購率突破8成"], "watch": "留意朝和生醫2027年在馬來西亞推動上市的進展。", "etype": "業務合作", "codes": ["5314"], "n": 1, "subs": [{"t": "朝和生醫進軍馬來西亞2027年", "arts": [{"t": "世紀＊搶攻東南亞億萬保健紅利 朝和生醫揮軍馬來西亞啟動海外版圖", "u": "https://www.ctee.com.tw/news/20260805700893-430504", "s": "工商時報", "d": "2026-08-05"}]}]}, "34": {"id": 34, "title": "東擎iEP-5010G取得全球首款O-PAS認證", "synthesis": "8月5日，東擎（7710）宣布，工業物聯網控制器iEP-5010G-010通過The Open Group O-PAS開放流程自動化認證，成為全球首款取得該認證的產品。公司表示，該產品支援跨供應商整合，並可降低供應商綁定，顯示其產品符合O-PAS開放流程自動化架構的認證要求。此次認證聚焦於工業物聯網控制器在開放流程自動化環境中的互通與整合能力，東擎未公布其他數字或後續商業計畫。", "facts": ["東擎（7710）宣布iEP-5010G-010獲認證", "成為全球首款O-PAS認證產品", "支援跨供應商整合", "可降低供應商綁定"], "watch": "", "etype": "訂單產能", "codes": ["7710"], "n": 1, "subs": [{"t": "東擎iEP-5010G全球首款認證", "arts": [{"t": "東擎iEP-5010G領先全球獲 O-PAS 認證 推動開放流程自動化發展", "u": "https://money.udn.com/money/story/7307/9671856", "s": "經濟日報", "d": "2026-08-05"}]}]}, "35": {"id": 35, "title": "中鋼9月盤價料持平，部分產品看漲", "synthesis": "中鋼（2002）9月盤價在連續兩個月降價後，市場預期將以平盤為主，部分產品不排除小幅調漲。支撐盤價的因素包括大陸鋼廠減產、寶鋼每公噸上調人民幣50元，以及外銷接單回溫；上述變化被認為有助亞洲鋼價築底，並改善鋼鐵族群的營運展望。", "facts": ["中鋼連續兩個月降價", "9月盤價預期以平盤為主", "部分產品不排除小幅調漲", "寶鋼每公噸上調人民幣50元", "大陸鋼廠減產、外銷接單回溫"], "watch": "中鋼9月盤價公布時，留意是否維持平盤及部分產品調漲。", "etype": "產業供需", "codes": ["2002"], "n": 1, "subs": [{"t": "中鋼9月盤價有望平盤", "arts": [{"t": "中鋼9月盤價有望止跌 市場預期以平盤為主", "u": "https://money. .ctee.com.tw/news/20260805700290-430503", "s": "工商時報", "d": "2026-08-05"}]}]}, "43": {"id": 43, "title": "帆宣上半年EPS增126.7%、Q2獲利創高", "synthesis": "帆宣（6196）董事會於2026年8月4日通過2026年第二季合併財報。第二季營收211.99億元、稅後淨利18億元、每股盈餘約8.18元，三項數據均創新高。上半年營收355.08億元，年增39.48%；稅後純益29.13億元，年增126.7%；每股盈餘13.26元，改寫同期新高。關於上半年EPS，另一篇報導列為6.36元，與13.26元的說法不一致。訂單方面，報導口徑亦不同：一篇稱在手訂單1,347億元、能見度延伸至2028年，另一篇則稱在手訂單逾1千億元。公司並預期2026年下半年營收優於上半年。", "facts": ["Q2營收211.99億元創高", "Q2稅後淨利18億元創高", "上半年EPS 13.26元", "上半年純益年增126.7%", "在手訂單1,347億元或逾1千億元", "訂單能見度延伸至2028年"], "watch": "留意2026年下半年營收是否優於上半年，以及訂單能見度至2028年的執行情況。", "etype": "財報", "codes": ["6196"], "n": 2, "subs": [{"t": "帆宣上半年EPS增逾倍、Q2獲利創高", "arts": [{"t": "帆宣訂單旺 上半年獲利年增逾倍", "u": "https://www.ctee.com.tw/news/20260805700182-430501", "s": "工商時報", "d": "2026-08-05"}, {"t": "《其他電》帆宣Q2獲利衝18億新高 H1每股大賺13.26元齊登峰", "u": "https://www.ctee.com.tw/news/20260805700847-430201", "s": "工商時報", "d": "2026-08-05"}]}]}, "44": {"id": 44, "title": "金管會推台股儀表板與虛幣實名制", "synthesis": "金管會8月4日宣布強化投資與虛擬資產監理：台股槓桿資訊儀表板將揭露信用交易融資餘額、整戶擔保維持率、借券賣出占比及券商不限用途借貸等數據，由證交所提供資料；上線時程一說力拚第三季，另一說為9月底。本國銀行自10月起須按月申報個人投資理財周轉金，涵蓋理財型房貸、股票質押、信用貸款及其他個人周轉金，預計10月申報9月資料。虛幣Travel Rule與實名規則分兩階段推動，10月起適用境內VASP間移轉，須提供姓名與金額，逾3萬元另須揭露身分資料；2027年年底擴至境內外VASP，違規罰鍰為50萬元至1,000萬元。證交所8月10日起將一般處置縮短至5個營業日，當沖過高者為7個營業日，處置股約每2分鐘撮合一次，高價股注意門檻調升至股價1,000元以上且六日價差達300元。另配合2028會計年度導入IFRS 18，金管會擬修準則，適用壽險20家、產險20家及再保險3家共43家，2028年首季呈現新格式，2027年第一季起財報全面電子化。", "facts": ["儀表板時程：第三季或9月底", "10月起申報個人周轉金", "虛幣逾3萬元須揭露身分資料", "虛幣違規罰鍰50萬至1,000萬元", "一般處置縮短至5個營業日", "IFRS 18適用保險業43家"], "watch": "留意8月10日處置新制、9月底儀表板、10月虛幣規則與周轉金申報，以及2027年第一季、2027年年底和2028年首季的後續時程。", "etype": "總經政策", "codes": [], "n": 8, "subs": [{"t": "金管會9月底推台股槓桿儀表板", "arts": [{"t": "通通秀給你看！金管會擬推融資資訊儀表板 槓桿、斷頭等全都露 慎重澄清「蓋牌說」", "u": "https://www.ctee.com.tw/news/20260805700061-430301", "s": "工商時報", "d": "2026-08-05"}, {"t": "理財周轉金 銀行須按月申報", "u": "https://money.udn.com/money/story/5613/9671048", "s": "經濟日報", "d": "2026-08-05"}, {"t": "台股槓桿儀表板拚9月上線 將由證交所提供融資餘額等數據", "u": "https://money.udn.com/money/story/5 <script>const PAGE="2026-08-05";const XDATE={};
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.clusters, E = DATA.edges;
const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
      <span class="chip">已讀 ${seen.size}/${Object.keys(C).length}</span></div>
    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';
  renderGrid();
}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
