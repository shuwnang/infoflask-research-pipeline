 "", "etype": "財報", "codes": ["6182"], "n": 1, "subs": [{"t": "華榮上半年EPS創高7.04元", "arts": [{"t": "華榮靠業外收益挹注 上半年EPS達7.04元創新高 股價漲停開出", "u": "https://www.ctee.com.tw/news/20260804700667-430201", "s": "工商時報", "d": "2026-08-04"}]}]}, "30": {"id": 30, "title": "帆宣Q2純益18億創高、上半年EPS13.26元", "synthesis": "帆宣（6196）於8月4日通過並公告第2季財報，合併營收212億元、稅後純益18億元，營收與獲利均創單季歷史新高；第2季純益季增61.8%，較去年同期大增逾3.5倍。上半年營收355.08億元、稅後純益29.13億元，每股純益13.26元。兩篇報導對第2季每股純益的數字有差異，分別為8.18元與8.17元。公司在手訂單逾1,000億元，主要受惠晶圓廠建廠工程及先進封裝設備出貨，訂單預計可消化至2027年之後。", "facts": ["8月4日公告第2季財報", "Q2營收212億元創單季新高", "Q2純益18億元、季增61.8%", "上半年EPS13.26元", "在手訂單逾1,000億元", "Q2 EPS報導為8.18元或8.17元"], "watch": "留意在手訂單逾1,000億元預計消化至2027年之後的出貨進度。", "etype": "財報", "codes": ["6196"], "n": 2, "subs": [{"t": "帆宣Q2純益18億創高、上半年EPS13.26元", "arts": [{"t": "帆宣財報／第2季稅後純益18億元、EPS 8.18元 雙創單季歷史新高", "u": "https://money.udn.com/money/story/5710/9670421", "s": "經濟日報", "d": "2026-08-04"}, {"t": "帆宣上半年 EPS 13.26元", "u": "https://money.udn.com/money/story/5710/9670715", "s": "經濟日報", "d": "2026-08-04"}]}]}, "31": {"id": 31, "title": "明遠精密上半年獲利增149%撤回減資", "synthesis": "明遠精密（7704）董事會於2026年8月3日通過上半年財報，合併營收為3.69億元，年增7.7%，毛利率38.19%。稅後淨利一篇報導列為0.65億元，另一篇則列為6,568.4萬元；獲利年增幅分別稱為1.49倍及149.4%，每股稅後純益為1.95元。公司董事會同時決議撤回現金減資案，原案規劃減資15%，改將現金保留作為擴充產能、研發，以及評估投資與併購標的。明遠精密預計於2026年10月19日召開股東臨時會。", "facts": ["上半年營收3.69億元，年增7.7%", "上半年毛利率38.19%", "稅後淨利0.65億元或6,568.4萬元", "獲利年增1.49倍或149.4%", "每股稅後純益1.95元", "原現金減資案規劃減資15%", "2026年10月19日召開股東臨時會"], "watch": "留意2026年10月19日股東臨時會對撤回現金減資案的決議。", "etype": "財報", "codes": ["7704"], "n": 2, "subs": [{"t": "明遠精密上半年獲利增149%撤減資", "arts": [{"t": "《半導體》Q2獲利衝新高、H1倍增登次佳 明遠精密亮燈攻頂", "u": "https://www.ctee.com.tw/news/20260804701030-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "明遠上半年每股純益1.95元 撤銷減資", "u": "https://money.udn.com/money/story/11074/9668375", "s": "經濟日報", "d": "2026-08-04"}]}]}, "32": {"id": 32, "title": "定穎投控Q2營收增48%仍虧損", "synthesis": "定穎投控（3715）於2026年8月3日公布第二季財報，營收68.69億元，年增48.4%；但歸屬母公司稅後淨損2.3億元，EPS為-0.81元。累計上半年營收125億元，年增36.1%，歸屬母公司稅後淨損4.4億元。公司預計於2026年8月10日召開法說會。", "facts": ["Q2營收68.69億元，年增48.4%", "Q2歸母淨損2.3億元", "Q2 EPS為-0.81元", "上半年營收125億元，年增36.1%", "上半年淨損4.4億元"], "watch": "2026年8月10日定穎投控召開法說會", "etype": "財報", "codes": ["3715"], "n": 1, "subs": [{"t": "定穎第2季虧損0.81元", "arts": [{"t": "定穎第2季營收年增近五成仍虧損 EPS 為負0.81元", "u": "https://money.udn.com/money/story/5607/9669215", "s": "經濟日報", "d": "2026-08-04"}]}]}, "33": {"id": 33, "title": "昶瑞機電上半年EPS降至1.25元，Q3美國旺季可望回升", "synthesis": "昶瑞機電於8月4日召開董事會承認第二季財報，第二季每股盈餘（EPS）近0.76元，優於去年同期的0.65元。累計上半年EPS為1.25元，則低於去年同期的2.13元，顯示上半年整體獲利仍較去年同期衰退。公司表示，第三季為DC吊扇外銷美國旺季，營運有機會優於去年同期，後續表現將取決於旺季出貨情況。", "facts": ["8月4日董事會承認第二季財報", "第二季EPS近0.76元", "上半年EPS為1.25元", "去年同期上半年EPS為2.13元", "Q3 DC吊扇外銷美國旺季"], "watch": "留意第三季DC吊扇外銷美國旺季的出貨與營運表現。", "etype": "財報", "codes": [], "n": 1, "subs": [{"t": "昶瑞機電上半年EPS1.25元", "arts": [{"t": "昶瑞機電 上半年EPS為1.25元", "u": "https://www.ctee.com.tw/news/20260804701795-430503", "s": "工商時報", "d": "2026-08-04"}]}]}, "34": {"id": 34, "title": "勤凱Q2 EPS創新高至2.71元", "synthesis": "勤凱（4760）8月4日公告，7月營收2.69億元，月增8.37%、年增78.38%。董事會同日通過第2季財報，單季EPS為2.71元，創歷史新高；上半年稅後純益1.66億元，年增120%，EPS為5.26元。公司營運受到AI需求及MLCC客戶拉貨帶動，部分大客戶並要求勤凱（4760）於8月擴大供貨。", "facts": ["7月營收2.69億元", "7月營收年增78.38%", "Q2 EPS 2.71元創新高", "上半年純益1.66億元", "上半年EPS 5.26元", "部分大客戶要求8月擴大供貨"], "watch": "留意8月部分大客戶擴大供貨的實際進度。", "etype": "財報", "codes": ["4760"], "n": 2, "subs": [{"t": "全家餐飲獲利增、勤凱營收創高", "arts": [{"t": "勤凱財報／第2季獲利每股賺2.71元創新高 客戶擴大拉貨", "u": "https://money.udn.com/money/story/11074/9670173", "s": "經濟日報", "d": "2026-08-04"}, {"t": "勤凱7月營收、2Q獲利同創新高 後市動能續強", "u": "https://money.udn.com/money/story/5612/9670335", "s": "經濟日報", "d": "2026-08-04"}]}]}, "35": {"id": 35, "title": "泓格上半年EPS3.28元、獲利年增150%", "synthesis": "泓格（3577）於8月3日公布半年報，第2季稅後純益1.16億元，季增23.4%、年增241.2%，每股純益1.81元；上半年稅後純益2.1億元，年增150%，每股純益3.28元。公司營運持續增長，主要受惠半導體應用放量，以及塑化龍頭訂單回流。", "facts": ["Q2稅後純益1.16億元", "Q2每股純益1.81元", "Q2獲利季增23.4%", "Q2獲利年增241.2%", "上半年EPS達3.28元", "上半年純益年增150%"], "watch": "留意半導體應用放量及塑化龍頭訂單回流能否延續", "etype": "財報", "codes": ["3577"], "n": 1, "subs": [{"t": "泓格上半年EPS達3.28元", "arts": [{"t": "泓格上半年 EPS 3.28元 訂單回流", "u": "https://money.udn.com/money/story/11074/9668372", "s": "經濟日報", "d": "2026-08-04"}]}]}, "36": {"id": 36, "title": "凌華下半年營收拚雙位數、機器人2027量產", "synthesis": "凌華（6166）於8月4日法說會表示，下半年營收目標較去年同期成長10%以上，優於上半年，營收與毛利率可望略佳，接單動能也維持雙位數成長。公司上半年營收79.03億元、年增41%，稅後純益約6.8億元、年增逾12倍，EPS 3.12元，已超越2025全年EPS 2.35元；第二季營收44.59億元，季增29%、年增52%，EPS 1.57元。受惠邊緣AI及半導體測試設備需求，凌華自第二季起因應記憶體、SSD等零組件漲價啟動成本轉嫁，預期下半年毛利率回升，全年毛利率目標維持約35%。公司並計畫擴大美國中部與東部布局；機器人事業目前有10個專案，預計2027年底至2028年陸續量產，屆時帶來顯著營收貢獻。", "facts": ["上半年營收79.03億元、年增41%", "上半年EPS 3.12元", "第二季營收44.59億元、年增52%", "下半年營收拚年增10%以上", "全年毛利率目標約35%", "機器人目前有10個專案"], "watch": "留意2027年底至2028年機器人專案陸續量產，以及下半年營收與毛利率表現。", "etype": "財報", "codes": ["6166"], "n": 4, "subs": [{"t": "凌華下半年營收拚雙位數，機器人2027量產", "arts": [{"t": "《電週邊》凌華H2營收拚年增逾10% 機器人明年底量產添翼", "u": "https://www.ctee.com.tw/news/20260804701670-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "凌華 上半年EPS賺贏去年全年", "u": "https://www.ctee.com.tw/news/20260804700220-430502", "s": "工商時報", "d": "2026-08-04"}, {"t": "凌華接單穩定 下半年雙位數成長、擬擴大美國布局", "u": "https://money.udn.com/money/story/5612/9670237", "s": "經濟日報", "d": "2026-08-04"}, {"t": "凌華接單穩 展望樂觀", "u": "https://money.udn.com/money/story/5710/9670723", "s": "經濟日報", "d": "2026-08-04"}]}]}, "37": {"id": 37, "title": "融程電上半年營收增30.4%創高", "synthesis": "融程電（3416）於8月4日公布，第二季營收11.77億元，年增42.3%，稅後純益約2億元、EPS 2.48元，營收與獲利均創單季新高。第二季稅後純益年增率，各篇報導引用數字略有不同，分別為111.1%與110.5%；另有報導指出稅後純益季增37.9%。上半年合併營收21.23億元，年增30.4%，稅後淨利約3.45億元，年增42.0%，EPS 4.28元，營收、淨利與EPS均創歷史新高。因應美國長單及無人載具需求暴增，公司加快擴大美國生產製造布局，並維持全年營收兩位數增長目標。", "facts": ["Q2營收11.77億元，年增42.3%", "Q2稅後純益約2億元", "Q2 EPS 2.48元創單季新高", "Q2淨利年增111.1%或110.5%", "上半年營收21.23億元，年增30.4%", "上半年淨利約3.45億元，年增42.0%", "上半年EPS 4.28元創歷史新高", "加快美國生產製造布局"], "watch": "留意美國長單與無人載具需求，以及全年營收兩位數增長目標的進展。", "etype": "財報", "codes": ["3416"], "n": 5, "subs": [{"t": "融程電上半年營收增30.4%創高", "arts": [{"t": "聚焦AI軍工應用 融程電上半年營收、淨利、EPS 同步登頂", "u": "https://www.ctee.com.tw/news/20260804701721-430502", "s": "工商時報", "d": "2026-08-04"}, {"t": "《電週邊》融程電H1寫三高 加速布局美國產能", "u": "https://www.ctee.com.tw/news/20260804701715-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "融程電財報／第2季獲利創新高 EPS 達2.48元", "u": "https://money.udn.com/money/story/5710/9670412", "s": "經濟日報", "d": "2026-08-04"}, {"t": "融程電上半年每股賺4.28元創新高 加速擴大美國製造", "u": "https://money.udn.com/money/story/5612/9670438", "s": "經濟日報", "d": "2026-08-04"}, {"t": "融程電第2季 EPS 2.48元 搶軍工商機", "u": "https://money.udn.com/money/story/5710/9670735", "s": "經濟日報", "d": "2026-08-04"}]}]}, "38": {"id": 38, "title": "振大環球上半年獲利增95%配息10.8元", "synthesis": "振大環球（4441）於2026年8月4日公布2026年第二季及上半年財報。上半年合併營收37.90億元，年增10.64%，稅後純益6.20億元，年增95.11%，EPS 9.08元。第二季稅後純益2.91億元，年增784.77%、EPS 4.27元；其中一篇報導將增幅表述為7.84倍。第二季合併營收未披露，毛利率26.99%，創掛牌以來新高。董事會決議配發每股現金股利10.8元；馬達加斯加新廠預計2027年投產，將新增40條產線。", "facts": ["上半年純益6.20億元，年增95.11%", "上半年EPS 9.08元、營收37.90億元", "第二季純益2.91億元，年增784.77%", "第二季EPS 4.27元，毛利率26.99%", "每股現金股利10.8元", "馬達加斯加新廠2027年投產"], "watch": "留意馬達加斯加新廠2027年投產及新增40條產線進度。", "etype": "財報", "codes": ["4441"], "n": 4, "subs": [{"t": "振大環球上半年獲利增95%至6.2億元", "arts": [{"t": "《紡纖股》振大Q2獲利暴增近8倍 上半年賺近1股本", "u": "https://www.ctee.com.tw/news/20260804701501-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "振大環球上半年稅後淨利6.20億元、年增95.11％ EPS 9.08元", "u": "https://www.ctee.com.tw/news/20260804701202-430503", "s": "工商時報", "d": "2026-08-04"}, {"t": "振大環球上半年獲利年增95% 每股純益9.08元", "u": "https://money.udn.com/money/story/11162/9670439", "s": "經濟日報", "d": "2026-08-04"}, {"t": "振大上半年 EPS 9.08元", "u": "https://money.udn.com/money/story/5710/9670693", "s": "經濟日報", "d": "2026-08-04"}]}]}, "39": {"id": 39, "title": "聚陽7月營收29.99億元年增7.86%", "synthesis": "聚陽（1477）於8月4日公布7月合併營收29.99億元，年增7.86%，創今年單月次高。累計今年前7月合併營收達200.62億元，較去年同期減少1.63%。展望後續，公司表示第三季出貨排程已滿，訂單能見度達6個月以上；在運動產品與美系客戶追加單帶動下，下半年營運可望獲得推升。整體而言，聚陽7月單月營收維持年增，但前7月累計仍為年減，後續表現將取決於第三季既有出貨及追加訂單的執行狀況。", "facts": ["8月4日公布7月營收29.99億元", "7月營收年增7.86%", "前7月營收200.62億元，年減1.63%", "第三季出貨排程已滿", "訂單能見度達6個月以上", "運動產品及美系客戶有追加單"], "watch": "留意第三季出貨排程執行，以及運動產品與美系客戶追加單對下半年營運的推升情況。", "etype": "財報", ://money.udn.com/money/story/5612/9668643", "s": "經濟日報", "d": "2026-08-04"}]}]}, "104": {"id": 104, "title": "奧義賽博-KY創設兩子公司各1億元", "synthesis": "奧義賽博-KY創（7823）第二季每股稅後淨損0.65元，較去年同期虧損幅度收斂。2026年8月4日，董事會通過增資奧義智慧科技，並規劃在台灣設立兩家子公司，初始實收資本額各1億元，分別布局模型韌性AI與國防韌性AI；董事會同日也通過三項策略投資，但原文未提供投資標的與金額等細節。", "facts": ["第二季每股稅後淨損0.65元", "2026年8月4日董事會通過增資", "規劃設立兩家台灣子公司", "兩子公司初始資本各1億元", "布局模型與國防韌性AI", "同日通過三項策略投資"], "watch": "", "etype": "公司治理", "codes": ["7823"], "n": 1, "subs": [{"t": "奧義賽博-KY創設兩子公司各1億元", "arts": [{"t": "奧義賽博-KY創第二季虧損收斂 董事會增資子公司 啟動三項策略投資布局", "u": "https://www.ctee.com.tw/news/20260804701941-430201", "s": "工商時報", "d": "2026-08-04"}]}]}, "105": {"id": 105, "title": "SK海力士獎金分歧、國票金副董年薪爭議", "synthesis": "SK海力士與韓國工會於2026年8月4日在清州市廠區進行第五輪獎金談判，管理層提議超過一半獎金以股票發放並設限制出售期，且公司虧損時可調整獎金；工會則拒絕承擔股價波動風險，要求資方提出具體修訂方案，否則將採取必要行動。報導指出，2026年每位員工平均獎金為7.79億韓元。另一方面，國票金控5月底改選董事會時，公股代表支持耐斯集團大股東陳冠舟出任副董事長，其年薪2,000萬元；另一篇報導寫作2000萬元，引發立法院對公司治理及公股代表選任原則的爭議。立委賴士葆提案要求，財政部所屬公股事業選舉正、副董事長時，不得支持非公股代表。財政部表示沒有意見，提案經朝野協商及表決後通過，後續將進行專案報告。", "facts": ["SK海力士2026年8月4日進行第五輪談判", "每位員工平均獎金為7.79億韓元", "超過一半獎金擬改發股票並設限售期", "國票金副董年薪2,000萬元", "立委要求不得支持非公股代表", "提案通過，後續進行專案報告"], "watch": "", "etype": "公司治理", "codes": [], "n": 4, "subs": [{"t": "SK海力士獎金談判分歧、7.79億韓元", "arts": [{"t": "SK海力士獎金談判爆分歧！「半數發股票」和售股設限引發工會反彈", "u": "https://www.ctee.com.tw/news/20260804700945-430704", "s": "工商時報", "d": "2026-08-04"}, {"t": "半數獎金改發股票惹議　SK海力士迎第5輪勞資談判", "u": "https://money.udn.com/money/story/5599/9669741", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "國票金副董年薪2,000萬元引發治理爭議", "arts": [{"t": "國票金副董年薪2,000萬惹議 藍委提案要求財部不得支持非公股代表", "u": "https://www.ctee.com.tw/news/20260804701848-430104", "s": "工商時報", "d": "2026-08-04"}, {"t": "年薪2千萬 耐斯股東任國票金副董惹議 立委提案不得支持非公股代表", "u": "https://money.udn.com/money/story/7307/9670377", "s": "經濟日報", "d": "2026-08-04"}]}]}, "106": {"id": 106, "title": "喬山北寧廠年產值4億美元、手術機器人擴張", "synthesis": "喬山（1736）於8月3日啟用越南北寧新廠，8月4日宣布正式啟用；新廠投資7,000萬美元，導入自動化與數位化流程，預估年產值4億美元，與越南既有廠合計可達6億美元，年底員工將增至2,000人。喬山今年全球商用健身器材市占率目標由去年約40％提高至52％，並拓展國際大客戶 爆料 Google 籌組6兆元融資連環扣", "u": "https://money.udn.com/money/story/5599/9670147", "s": "經濟日報", "d": "2026-08-04"}]}]}, "109": {"id": 109, "title": "中國官方PMI降至49.2、台灣PMI升至61.5", "synthesis": "中國製造業景氣出現分歧，官方7月PMI降至49.2，低於6月50.3及市場預期50.1；標普全球與RatingDog調查則由51.7降至50.9，均反映內需不足、訂單增長放緩，並關注企業採購減少與庫存累積。相較之下，中經院台灣製造業PMI升至61.5，連續十個月擴張，創2021年9月以來最快；標普全球台灣PMI為55.1。中經院電子暨光學產業PMI達65.5，但缺料、漲價及交期拉長限制產出；台灣非製造業NMI由59.9降至57.3，資訊暨通訊傳播業展望降至45.5。美國7月製造業PMI終值為53.9、與6月一致，ISM為55.6；歐元區由51.4升至51.9，產出指數52.9創2022年3月以來新高，但新訂單成長緩慢、出口訂單下滑，德國升至52.2、法國降至49.8；南韓、日本及東南亞PMI分別為53.1、54.5及52.8。美系外資認為中國景氣短期可能壓抑工業自動化股情緒，若推出刺激政策，仍看好亞德客-KY（1590）及上銀（2049）中長期營運。台灣勞動市場方面，勞動部8月3日公布減班休息增至245家、3,026人，較7月中旬增加14家、258人，其中製造業2,732人；受美國對等關稅影響者為192家、2,564人，勞動部認為市場仍處平穩。另因金門海漂豬屍驗出非洲豬瘟病毒核酸陽性，農業部宣布8月4日至8月10日暫停金門豬肉及豬肉加工產品輸往台灣本島與其他離島，周邊21戶、5,558頭豬健康正常。", "facts": ["中國官方7月PMI降至49.2", "台灣中經院製造業PMI升至61.5", "台灣電子暨光學PMI達65.5", "減班休息245家、3,026人", "製造業減班休息2,732人", "金門豬肉8月4日至8月10日禁運", "亞德客-KY（1590）、上銀（2049）受關注"], "watch": "留意8月10日金門豬肉禁運措施到期，以及中國是否推出刺激政策。", "etype": "總經政策", "codes": ["1590", "2049"], "n": 9, "subs": [{"t": "中國製造業PMI跌破榮枯線，台灣PMI分歧走強", "arts": [{"t": "陸7月標普製造業PMI 遜預期", "u": "https://www.ctee.com.tw/news/20260804700158-430803", "s": "工商時報", "d": "2026-08-04"}, {"t": "《類股》亞德客、上銀後市 外資仍比讚", "u": "https://www.ctee.com.tw/news/20260804700911-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "歐美製造業PMI 7月同步擴張", "u": "https://www.ctee.com.tw/news/20260804700140-430701", "s": "工商時報", "d": "2026-08-04"}, {"t": "7月非製造業NMI 回跌至57.3", "u": "https://www.ctee.com.tw/news/20260804700114-430102", "s": "工商時報", "d": "2026-08-04"}, {"t": "7月台灣PMI 連十個月擴張", "u": "https://www.ctee.com.tw/news/20260804700051-430102", "s": "工商時報", "d": "2026-08-04"}, {"t": "全球製造業景氣持續擴張 台日韓7月產出加速成長", "u": "https://money.udn.com/money/story/5599/9668708", "s": "經濟日報", "d": "2026-08-04"}, {"t": "中經院調查 股市波動大 內需消費趨審慎", "u": "https://money.udn.com/money/story/10869/9668709", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "台灣無薪假突破3,000人", "arts": [{"t": "無薪假升溫 突破3,000人", "u": "https://money.udn.com/money/story/5648/9668580", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "農業部禁運豬肉至8月10日", "arts": [{"t": "金門海漂豬屍再驗出非洲豬瘟 豬肉禁運本島至8月10日", "u": "https://money.udn.com/money/story/7307/9670554", "s": "經濟日報", "d": "2026-08-04"}]}]}, "110": {"id": 110, "title": "富邦布局AI保險並持台積電10.4萬張", "synthesis": "富邦產險於8月3日宣布攜手慕尼黑再保推出AI專屬保險方案，保障範圍涵蓋模型效能風險、財務損失、額外營運成本、營運中斷及第三人責任。金管會統計，資安險保費收入已由2018年的8,908萬元增至2025年的5.12億元，市場預期AI保險有望推升簽單保費收入。投資配置方面，截至6月30日，富邦金（2881）持有台積電約10.4萬張，持倉市值約2,514億元；國泰金持有約4.4萬張，單季增加約2,000張，終結連續四季減碼。同期富邦金調整後獲利為1,884.1億元，國泰金為1,659億元。", "facts": ["富邦產險8月3日推AI專屬保險", "資安險保費2025年增至5.12億元", "富邦金（2881）持台積電10.4萬張", "富邦金台積電持倉市值2,514億元", "國泰金持股季增約2,000張", "富邦金調整後獲利1,884.1億元"], "watch": "留意AI保險是否推升簽單保費收入，以及國泰金後續是否延續加碼台積電。", "etype": "業務合作", "codes": ["2881"], "n": 2, "subs": [{"t": "富邦金加碼台積電10.4萬張", "arts": [{"t": "壽險金控雙雄 富邦金、國泰金加碼台積電", "u": "https://money.udn.com/money/story/5613/9668589", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "富邦產險推AI險市場保費5.12億元", "arts": [{"t": "富邦產攜慕尼黑再保 AI 專屬保險方案出爐", "u": "https://money.udn.com/money/story/5613/9668599", "s": "經濟日報", "d": "2026-08-04"}]}]}, "111": {"id": 111, "title": "政府提3.6兆零舉債並推百億生醫", "synthesis": "行政院於8月3日向總統府提報、8月4日完成籌編116年度（2027年度）中央政府總預算案，歲出達3.6兆餘元，規劃零舉債、收支平衡及債務餘額下降；報導稱歲入約3.8兆餘元、另編列還債1,930億元，卓榮泰表示依公債法以稅收5％～6％還本，預計8月底前送立法院審議。預算聚焦AI新十大建設、13項關鍵產業、科技、國防、產業升級、減稅、社福、教育與公共建設。國發基金管理會8月4日通過生醫方案，未來10年匡列100億元，支持具創新、臨床及國際市場潛力企業的研發、臨床驗證與商業化；美國融資保證機制分5期，首期由國發基金投入8億美元、15家銀行投入5.75億美元，形成13.75億美元專款，預計帶動約550億美元需求、最高2,500億美元。行政院另規劃2025年至2030年投入逾270億元或逾271億元布局6G、低軌衛星及自主通訊，目標2030年商用；太空3期計畫2019年至2031年投入710億元。美國關稅下台灣適用稅率10％且不疊加，賴清德推1,000億元振興計畫，輸出入銀行提供利息減碼及保險費減免；報導稱自8月7日至7月底受理9,508件、融資6,143.59億元，協助5,561家廠商，另有808家企業減免保險費1.35億元。", "facts": ["國發基金10年匡列100億元助生醫", "美國融資保證首期13.75億美元", "116年度歲出3.6兆餘元、零舉債", "6G等2025至2030年投入逾270/271億元", "2030年6G商用，50多家台廠入鏈", "美國關稅適用10％且不與既有疊加", "千億元計畫協助5,561家廠商", "融資6,143.59億元、受理9,508件"], "watch": "留意8月底前116年度總預算送立法院審議，以及2030年6G商用目標與美國融資保證機制後續各期辦理。", "etype": "總經政策", "codes": [], "n": 14, "subs": [{"t": "國發基金推生醫百億並啟動美國融資250 , "u": "https://money.udn.com/money/story/5710/9668339", "s": "經濟日報", "d": "2026-08-04"}]}]}, "129": {"id": 129, "title": "高端疫苗EV71首批出口越南、8月貢獻營收", "synthesis": "高端疫苗（6547）於8月4日宣布，自主研發的腸病毒71型（EV71）疫苗已完成品質檢驗及批次放行，啟動首批出口並正式運抵越南。該疫苗已取得越南藥品管理局上市許可，將投入當地市場供應，後續也將持續供貨。此案被指出為越南官方核發的首張腸病毒疫苗藥證，高端疫苗預計自8月起貢獻越南業績，並藉此拓展海外疫苗布局。", "facts": ["高端疫苗（6547）8月4日宣布出口", "EV71疫苗完成品質檢驗與批次放行", "首批疫苗已正式運抵越南", "取得越南藥品管理局上市許可", "被指出為越南首張腸病毒疫苗藥證", "預計8月起貢獻越南業績"], "watch": "留意高端疫苗自8月起在越南的供貨與營收貢獻。", "etype": "訂單產能", "codes": ["6547"], "n": 3, "subs": [{"t": "高端疫苗首批EV71疫苗出口越南8月貢獻營收", "arts": [{"t": "高端腸病毒疫苗首批出口越南 台灣首支EV71疫苗正式進軍海外市場", "u": "https://www.ctee.com.tw/news/20260804701157-430504", "s": "工商時報", "d": "2026-08-04"}, {"t": "高端腸病毒71型疫苗首發批次正式運抵越南 8月開始貢獻營收", "u": "https://money.udn.com/money/story/10871/9670557", "s": "經濟日報", "d": "2026-08-04"}, {"t": "高端腸病毒疫苗 進軍越南", "u": "https://money.udn.com/money/story/11074/9670702", "s": "經濟日報", "d": "2026-08-04"}]}]}, "130": {"id": 130, "title": "全球伺服器Q3破500萬台，緯創AI占營收95%", "synthesis": "DIGITIMES預估2026年第3季全球伺服器出貨量季增2.8%，首度突破500萬台，但受記憶體、CPU及IC載板供應吃緊影響，增速低於第2季；第4季預估季減2.4%。2026全年出貨量估達1949萬台、年增17.4%，創歷史新高。台廠中，廣達（2382）仍居出貨首位，緯穎（6669）受三大雲端客戶訂單帶動，第3季出貨占比可望提升，6月已開始出貨T3 AI ASIC伺服器，法人估第3季營收季增約30%。緯創（3231）於2026年8月4日表示，Vera Rubin伺服器已量產並取得企業級及CSP新客戶，下半年AI伺服器出貨可望強勁，AI伺服器占整體伺服器營收95%以上；另有法人估其第3季伺服器營收占比將由2026年上半年79%升至近90%，並看好2026年第2季獲利高於預期。緯創2026年8月4日股價最高198元、收195元，成交量145,848張。公司預估PC出貨較上半年衰退10～20%，但單價提升可降低營收衝擊，交換器業務今年營收成長10倍；緯穎生產的MI455與VR機櫃則被視為第4季營收推手。Trainium出貨量預估由去年160萬顆增至2026年240萬顆、2027年330至340萬顆。", "facts": ["2026年第3季伺服器出貨破500萬台", "2026全年出貨1949萬台、年增17.4%", "緯創AI伺服器營收占比逾95%", "緯創8月4日收195元、量145,848張", "緯穎第3季營收估季增約30%", "緯創交換器業務今年成長10倍", "緯穎MI455與VR機櫃推動第4季", "Trainium 2027年估330至340萬顆"], "watch": "留意2026年第3季伺服器出貨、緯創下半年AI伺服器出貨及2026年第4季MI455與VR機櫃營收表現。", "etype": "訂單產能", "codes": ["2382", "3231", "6669"], "n": 10, "subs": [{"t": "全球伺服器Q3首破500萬台，緯創AI占比95%", "arts": [{"t": "《科技》調研估：Q3全球伺服器出貨首破500萬台 全年拚戰新高", "u": "https://www.ctee.com.tw/news/20260804701563-430503", "s": "工商時報" esis": "台灣7月機車市場維持成長，總領牌數約7.09萬輛，月增5.3%；報導對年增率分別記載8.59%與8.6%，其中一篇列出精確數字70,899輛。前七月累計約43.43萬輛，年增9.81%或9.8%。三陽以3.27萬輛、市占46.2%居首，光陽與山葉分居二、三名；電動機車7月銷量3,662輛，年減28.7%。汽車7月新車掛牌約3.87萬輛，另有報導列為38,657輛，年增8.9%；前七月累計約24.09萬輛或240,935輛，年增2.8%。和泰車旗下TOYOTA、LEXUS合計掛牌約1.61萬輛或16,071輛，年增18%、市占41.6%，創今年單月新高。市場動能由新增需求轉向換購需求，多數機車業者看好8月維持高水位，但汽車市場預估約2.8萬輛，較去年同期減少約5%。大陸新能源車方面，花旗預估7月批發量年增23%、月增1%，出口及庫存改善推動信心回升；乘用車出口占批發比例6月升至37.2%，獲利改善仍待第二季財報確認。大陸7月狹義乘用車零售市場預計152萬輛，月增率下降5.1%、年增率下降16.8%；新能源車零售約98萬輛、滲透率約64.5%。比亞迪銷量41.92萬輛居冠，零跑月銷首破10萬輛，奇瑞汽車出口20.25萬輛居首。", "facts": ["三陽7月3.27萬輛、市占46.2%", "台灣7月機車領牌70,899輛", "電動機車7月銷量3,662輛", "和泰車市占41.6%創今年新高", "大陸新能源車批發量年增23%", "新能源車零售約98萬輛、滲透64.5%", "比亞迪7月銷量41.92萬輛", "奇瑞汽車出口20.25萬輛居首"], "watch": "留意8月機車市場是否維持高水位，以及第二季財報對大陸新能源車獲利改善的確認。", "etype": "產業供需", "codes": [], "n": 6, "subs": [{"t": "三陽7月機車市占46.2%居冠", "arts": [{"t": "暑期旺季發酵！7月機車領牌站回7萬輛 三陽市占衝46.2％穩居冠", "u": "https://www.ctee.com.tw/news/20260804701785-430503", "s": "工商時報", "d": "2026-08-04"}, {"t": "暑期促銷＋新車效益帶動…7月車市續旺 和泰車領頭衝", "u": "https://www.ctee.com.tw/news/20260804700094-430503", "s": "工商時報", "d": "2026-08-04"}, {"t": "台灣7月機車掛牌月增5.3% 暑期旺季買氣升溫", "u": "https://money.udn.com/money/story/10871/9670380", "s": "經濟日報", "d": "2026-08-04"}, {"t": "車市7月掛牌3.8萬輛 年增8.9% 市場動能轉由「換購需求」接棒", "u": "https://money.udn.com/money/story/5612/9668645", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "比亞迪7月銷量41.92萬輛", "arts": [{"t": "數字看中國│大陸7月汽車銷量前五大車企", "u": "https://www.ctee.com.tw/news/20260804700033-430805", "s": "工商時報", "d": "2026-08-04"}]}, {"t": "大陸新能源車批發量年增23％", "arts": [{"t": "新能源車銷售佳！華爾街投行 看好陸車市前景", "u": "https://www.ctee.com.tw/news/20260804700166-430804", "s": "工商時報", "d": "2026-08-04"}]}]}, "136": {"id": 136, "title": "統一佳佳9月3日退出健身市場", "synthesis": "統一超（2912）旗下統一佳佳董事會決議，BEING sport與BEING fit退出健身服務，旗下7間BEING sport及2處BEING fit據點將退場，並與健身工廠合作承接會員。統一佳佳8月4日公告，兩品牌全台館別營業至9月2日晚間11時後全面停止服務；另一篇報導則稱自9月3日起停止服務，兩種說法均指向9月2日晚間結束營業、9月3日退場。會員可於8月3日至9月2日辦理轉換服務及退費，尚未完成的教練課程可平轉至健身工廠；BEING Spa維持營運。", "facts": ["統一超（2912）旗下統一佳佳退場", "7間BEING sport  "兆基預計8月5日改選董事"], "watch": "8月5日兆基董事會改選及重新推舉董事長、總經理，並留意銀行團對營運與償債計畫的評估。", "etype": "公司治理", "codes": ["2353", "5392"], "n": 8, "subs": [{"t": "宏碁持兆基兩成、力挺新團隊", "arts": [{"t": "兆基大股東財務風暴延燒 施振榮仍正向看待未來發展機會", "u": "https://www.ctee.com.tw/news/20260804701706-430503", "s": "工商時報", "d": "2026-08-04"}, {"t": "兆基屋管爆債務危機 施振榮發聲力挺：看好新經營團隊", "u": "https://www.ctee.com.tw/news/20260804701581-430503", "s": "工商時報", "d": "2026-08-04"}, {"t": "兆基屋管傳財務危機 宏碁施振榮力挺：看好新經營團隊未來發展", "u": "https://money.udn.com/money/story/5612/9670007", "s": "經濟日報", "d": "2026-08-04"}, {"t": "國內包租代管龍頭兆基集團相關公司爆發財務危機 大股東宏碁動向引發關注", "u": "https://money.udn.com/money/story/5612/9668707", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "兆基集團爆百億缺口，8億元聯貸遭凍結", "arts": [{"t": "兆基屋管12億聯貸案 銀行團先凍結8億未動用款項 未來有條件恢復", "u": "https://money.udn.com/money/story/5612/9669059", "s": "經濟日報", "d": "2026-08-04"}, {"t": "包租代管龍頭捲入財務危機 住都中心：設專案小組全面清查", "u": "https://money.udn.com/money/story/7307/9668696", "s": "經濟日報", "d": "2026-08-04"}, {"t": "兆基爆債務風暴 傳有房東被騙？北市：包租代管303件今約兆基說明", "u": "https://money.udn.com/money/story/7307/9669681", "s": "經濟日報", "d": "2026-08-04"}, {"t": "兆基、寄居蟹承辦近3萬件社宅 花敬群：營運正常、房東房客可安心", "u": "https://money.udn.com/money/story/5612/9669221", "s": "經濟日報", "d": "2026-08-04"}]}]}, "143": {"id": 143, "title": "金管會推虛幣規則、瑞銀遭罰1.25億美元", "synthesis": "金管會副局長黃仲豪於8月4日表示，金管會預告修正虛擬資產服務防制洗錢辦法，規劃由VASP公會協助分兩階段導入Travel Rule。第一階段聚焦境內VASP間虛擬幣移轉，預計10月施行；第二階段擴及境內與境外VASP間移轉，多數報導稱預計2027年底實施，但另有報導稱預計年底施行，時間說法不一。規則要求提供交易雙方姓名或名稱、金額及錢包資訊；等值新台幣逾3萬元，還須補充出生日期、住所地址等個人或法人資料，違規罰鍰為50萬元至1,000萬元，VASP公會支持分階段導入。另於8月3日，瑞銀集團（UBS）因故意違反《銀行保密法》及反洗錢規定，遭美國監管機關重罰1.25億美元，涉及未執行反洗錢計畫、未提交可疑活動報告，以及未適當監控6萬筆、逾100億美元外幣匯款。央行則指出家庭借款總額達23.7兆，個人理財周轉金貸款占銀行總放款比重由2022年底約7.07%升至2025年約9.15%，今年中衝破11.29%，金管會並以「四貸同堂」專案金檢監測房貸、信貸與股票融資累積的槓桿風險。", "facts": ["Travel Rule第一階段預計10月施行", "第二階段多數稱2027年底實施", "逾3萬元須補充身分與地址資料", "違規罰鍰50萬元至1,000萬元", "瑞銀遭美國重罰1.25億美元", "家庭借款總額達23.7兆", "理財周轉金占比今年中達11.29%"], "watch": "留意10月第一階段Travel Rule施行，以及第二階段究竟於2027年底或年底實施。", "etype": "總經政策", "codes": [], "n": 7, "subs": [ sis": "東洋（4105）8月3日宣布，自8月起，其自行發展的肺癌標靶新藥Aumolertinib納入健保給付，成為台灣第一個由本土藥廠自製的第三代肺癌標靶口服新藥。製造方面，六堵廠投入一年進行製程研發；兩篇報導說法不同，一篇稱已完成製程研發，另一篇則指出已建置一體化產線。臨床試驗方面，兩篇均提到四項在地試驗、累計收案近400人，但一篇稱試驗已完成，另一篇稱已啟動，進度仍有不同說法。", "facts": ["東洋（4105）Aumolertinib納健保", "8月起納入健保給付", "台灣首個本土自製第三代口服標靶", "六堵廠投入一年研發製程", "四項在地試驗收案近400人", "試驗完成或已啟動說法不同"], "watch": "留意Aumolertinib自8月起納入健保給付後的實際執行進度。", "etype": "訂單產能", "codes": ["4105"], "n": 2, "subs": [{"t": "東洋Aumolertinib 8月納健保", "arts": [{"t": "《生醫股》東洋自製第三代EGFR-TKI肺癌標靶新藥8月納健保", "u": "https://www.ctee.com.tw/news/20260804700603-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "東洋肺癌藥納健保給付", "u": "https://money.udn.com/money/story/11074/9668370", "s": "經濟日報", "d": "2026-08-04"}]}]}, "146": {"id": 146, "title": "亞馬遜砸2200億美元，智邦受惠", "synthesis": "亞馬遜將今年全年資本支出上調至2,200億美元，重點投入AI基礎建設。AWS執行長卡曼表示，AWS大部分產能已預定至2027年底並延伸至2028年，客戶簽訂五年合約，AWS AI業務年化營收達250億美元；AI ASIC Trainium 3也持續量產出貨。法人與分析師因此看好智邦（2345）受惠算力與高速網路需求，800G乙太網路及北美CSP客戶第三代AI伺服器量產，預期成為下半年營運成長主力。智邦第2季營收955.4億元，上半年營收1,656.6億元、年增60.3%，外資預估第3季營收1,070億元。另一方面，Anthropic與Volta Infra Holdings達成100億美元、為期六年的算力協議，使用Volta管理的資料中心；Volta另完成3億美元融資，輝達與戴爾創辦人參與注資，協議將與比特小鹿（Bitdeer Technologies Group）合作。", "facts": ["亞馬遜全年資本支出上調至2,200億美元", "AWS AI業務年化營收達250億美元", "智邦上半年營收1,656.6億元、年增60.3%", "外資估智邦第3季營收1,070億元", "Anthropic簽100億美元六年算力協議", "Volta完成3億美元融資"], "watch": "留意AWS產能預定至2027年底並延伸至2028年，以及智邦第3季營收預估1,070億元。", "etype": "訂單產能", "codes": ["2345"], "n": 4, "subs": [{"t": "亞馬遜資本支出2,200億美元帶旺智邦", "arts": [{"t": "亞馬遜雲端產能預定到2028年", "u": "https://www.ctee.com.tw/news/20260804701955-430704", "s": "工商時報", "d": "2026-08-04"}, {"t": "亞馬遜績優 智邦跟著旺", "u": "https://money.udn.com/money/story/5710/9668361", "s": "經濟日報", "d": "2026-08-04"}, {"t": "亞馬遜上調資本支出 市場看好智邦營運將受惠", "u": "https://money.udn.com/money/story/5607/9669647", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "Anthropic簽算力協議100億美元", "arts": [{"t": "Anthropic與Volta達成100億美元算力協議", "u": "https://www.ctee.com.tw/news/20260804701989-430701", "s": "工商時報", "d": "2026-08-04"}]}]}, "147": {"id": 147, "title": "億光貼息、AZ洽併BMS與龍電華鑫赴美IPO", "synthesis": "億光（2393）於8月4日除息，每股配發現金股利4.5元，開盤57元，盤中最高57.9元、最低54.2元，股價呈現貼息。公司6月營收18.3億元，年增10.58%，預估下半年獲利改善，全年營收挑戰成長5-10%，獲利目標持平；另於7月30日向美國密西根東區聯邦地方法院南部分院提告Nichia Corporation（日亞化），指其高功率LED產品侵害US 7,554,126專利。另據傳阿斯特捷利康（AZ）洽談合併必治妥施貴寶（BMS），合併後市值或估值接近4,000億美元；8月3日AZ股價跌幅有7%及7.8%兩種說法，BMS美股盤前漲約6%，交易仍面臨反壟斷審查。龍電華鑫新能源科技集團則計劃在美國發行約360萬股ADS，每股20至22美元，最高估值17億美元、募資約7,860萬美元，並在紐約證券交易所掛牌。", "facts": ["億光8月4日除息4.5元並貼息", "億光最低54.2元，開盤57元", "億光6月營收18.3億元，年增10.58%", "億光7月30日控告日亞化侵權", "AZ洽併BMS，估值近4,000億美元", "AZ跌幅說法為7%或7.8%", "龍電華鑫擬發360萬股ADS", "龍電華鑫最高募資約7,860萬美元"], "watch": "留意AZ與BMS交易是否成形，以及後續反壟斷審查結果。", "etype": "公司治理", "codes": ["2393"], "n": 6, "subs": [{"t": "億光除息4.5元股價最低54.2元並控告日亞化", "arts": [{"t": "《光電股》億光除息首日陷貼息 下半年獲利看回升", "u": "https://www.ctee.com.tw/news/20260804700903-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "繼控告Lumileds、SSC後 億光在美對日亞化提起侵權之訴", "u": "https://www.ctee.com.tw/news/20260804700676-430502", "s": "工商時報", "d": "2026-08-04"}, {"t": "億光除息首日走勢擺脫低迷 盤中黑翻紅邁向填息", "u": "https://money.udn.com/money/story/5607/9669759", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "AZ洽併BMS估值近4000億美元", "arts": [{"t": "AZ傳併BMS 市值近4,000億美元", "u": "https://www.ctee.com.tw/news/20260804700146-430704", "s": "工商時報", "d": "2026-08-04"}, {"t": "AZ 傳結親美商 催生製藥巨頭 有望成為業界最大規模交易", "u": "https://money.udn.com/money/story/5599/9668674", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "龍電華鑫美IPO估值17億美元", "arts": [{"t": "計劃在美IPO 陸銅箔製造巨頭龍電華鑫估值最高17億美元", "u": "https://money.udn.com/money/story/5604/9669035", "s": "經濟日報", "d": "2026-08-04"}]}]}, "148": {"id": 148, "title": "啟碁EPS獲上修至11、13、16.4元", "synthesis": "AI基礎建設升級、高速傳輸、低軌衛星及CPO題材帶動網通需求，中磊（5388）6月與第二季營收同步創下歷史新高。啟碁（6285）方面，企業級800G交換器預計於2026年下半年大量出貨，美系外資因此上修啟碁2026年至2028年每股盈餘預估，分別由相關報導指向11元、13元及16.4元，顯示市場聚焦其高速交換器出貨進度。", "facts": ["中磊（5388）6月營收創歷史新高", "中磊（5388）第二季營收創新高", "啟碁（6285）800G交換器2026下半年出貨", "美系外資上修啟碁2026年EPS至11元", "啟碁2027、2028年EPS為13、16.4元"], "watch": "留意啟碁企業級800G交換器於2026年下半年大量出貨的進度。", "etype": "法人動向", "codes": ["5388", "6285"], "n": 1, "subs": [{"t": "啟碁獲上修EPS至11元", "arts": [{"t": "需求升溫 中磊、啟碁權證俏", "u": "https://www.ctee.com.tw/news/20260804700281-430203", "s": "工商時報", "d": "2026-08-04"}]}]}, "149": {"id": 149, "title": "五家減重藥公司更新臨床與訴訟進度", "synthesis": "減重藥市場多家公司同步更新。Novo Nordisk的CagriSema股東訴訟中，部分主張可繼續追訴；法院文件顯示，CagriSema平均減重約20.4%。商業化方面，Eli Lilly第一季Mounjaro與Zepbound合計銷售128.2億美元。臨床進度上，Viking Therapeutics已完成兩項Phase 3試驗收案，Amgen則推進6項Phase 3試驗。Altimmune公布約9.1%的安慰劑校正後體重下降幅度。上述資訊涵蓋訴訟進展、產品銷售與後期臨床開發，但未提供各項試驗或訴訟的後續時間表。", "facts": ["CagriSema平均減重約20.4%", "Eli Lilly第一季銷售128.2億美元", "Viking完成兩項Phase 3收案", "Amgen推進6項Phase 3", "Altimmune體重下降約9.1%"], "watch": "留意Novo Nordisk股東訴訟後續，以及Viking Therapeutics、Amgen與Altimmune的Phase 3進展。", "etype": "產業供需", "codes": [], "n": 1, "subs": [{"t": "減重藥五家公司更新進度", "arts": [{"t": "《美股主題週報》減重藥物—NVO、LLY、VKTX", "u": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E4%B8%BB%E9%A1%8C%E9%80%B1%E5%A0%B1-%E6%B8%9B%E9%87%8D%E8%97%A5%E7%89%A9-nvo-lly-vktx-065100666.html", "s": "Yahoo股市", "d": "2026-08-04"}]}]}, "150": {"id": 150, "title": "奇鋐水冷出貨增、接單看到2029年", "synthesis": "奇鋐（3017）水冷散熱產品出貨持續成長，ASIC平台零組件自6月起開始放量，並陸續出貨至輝達（NVIDIA）Blackwell與VR200相關產品。法人預期，奇鋐第三季營收將優於第二季，且目前接單能見度已看到2029年，顯示相關產品需求與訂單布局具延續性。", "facts": ["奇鋐（3017）水冷產品出貨成長", "ASIC零組件自6月起放量", "Blackwell、VR200產品陸續出貨", "法人估第三季營收優於第二季", "接單能見度看到2029年"], "watch": "留意奇鋐第三季營收是否優於第二季，以及ASIC零組件出貨放量進度。", "etype": "訂單產能", "codes": ["3017"], "n": 1, "subs": [{"t": "奇鋐接單能見度看至2029年", "arts": [{"t": "奇鋐 H2可望優H1", "u": "https://www.ctee.com.tw/news/20260804700290-430203", "s": "工商時報", "d": "2026-08-04"}]}]}, "151": {"id": 151, "title": "崇舜斥資10億擴產、長鑫擬建12吋廠", "synthesis": "崇舜（7763）因應AI高階材料需求，規劃斥資10億元在彰濱興建約4,000坪新廠，預計2029年投產，並同步推動兩岸擴產。公司已遞件申請上市，上市核准案於7月獲證交所核准，董事長鍾文清於8月3日表示，預估2026年底前有望掛牌。產品結構方面，兩篇報導均指電子材料或電子特化產品目前占營收約兩成，但對未來比重表述不同：一篇稱目標提升至50％，另一篇稱有望提高至四到五成。長鑫科技則計畫在北京亦莊興建12吋晶圓廠，擬協商融資最少人民幣6,000萬元；目前仍處磋商初步階段，融資規模、架構、產能及總投資金額均未確定。報導並指出，高階記憶體晶片廠成本通常超過100億美元。", "facts": ["崇舜（7763）斥資10億元建彰濱廠", "彰濱新廠約4,000坪、2029年投產", "崇舜預估2026年底前掛牌", "電子產品占比目標50％或四至五成", "長鑫科技擬建北京 證", "u": "https://www.ctee.com.tw/news/20260804701569-431202", "s": "工商時報", "d": "2026-08-04"}]}, {"t": "仁寶處分認股權證獲利2.97億元", "arts": [{"t": "仁寶賣聯想認股權證 進補", "u": "https://money.udn.com/money/story/5710/9668335", "s": "經濟日報", "d": "2026-08-04"}]}]}, "154": {"id": 154, "title": "DeepSeek V4-Flash測試成本不到Claude 1%", "synthesis": "Artificial Analysis數據顯示，DeepSeek V4-Flash每100萬個輸入詞元收費0.14美元，輸出詞元收費0.28美元，平均每次測試成本僅3美分，不到Claude Fable 5平均測試成本的1%。DeepSeek於7月31日發布V4-Flash；同時，OpenAI於7月底宣布GPT-5.6 Luna降價80%，顯示模型定價競爭持續加劇。", "facts": ["輸入詞元每100萬個收費0.14美元", "輸出詞元每100萬個收費0.28美元", "平均每次測試成本僅3美分", "成本不到Claude Fable 5的1%", "DeepSeek於7月31日發布模型", "GPT-5.6 Luna降價80%"], "watch": "留意OpenAI於7月底宣布GPT-5.6 Luna降價80%後的模型定價變化", "etype": "產業供需", "codes": [], "n": 1, "subs": [{"t": "DeepSeek模型成本低於1%", "arts": [{"t": "成本不到 Claude 1% DeepSeek 劃下 AI 性價比「斬殺線」", "u": "https://money.udn.com/money/story/5603/9668680", "s": "經濟日報", "d": "2026-08-04"}]}]}, "155": {"id": 155, "title": "晟田擴產五成、上半年營收增33.3%", "synthesis": "晟田（4541）因應AI帶動的半導體設備投資與訂單成長，啟動半導體產線擴產，滿載後產能可增加約五成。營收方面，4月半導體設備零組件營收為1.5億元，年增53.78%；6月營收1.99億元，年增58.7%。累計上半年營收達10億元，年增33.3%，顯示半導體設備零組件業務維持成長。", "facts": ["晟田（4541）啟動半導體產線擴產", "滿載後產能可增加約五成", "4月營收1.5億元，年增53.78%", "6月營收1.99億元，年增58.7%", "上半年營收10億元，年增33.3%"], "watch": "", "etype": "訂單產能", "codes": ["4541"], "n": 1, "subs": [{"t": "晟田擴產五成", "arts": [{"t": "晟田啟動半導體大擴產", "u": "https://money.udn.com/money/story/11074/9670687", "s": "經濟日報", "d": "2026-08-04"}]}]}, "156": {"id": 156, "title": "日本防衛省定調中國為最大戰略挑戰", "synthesis": "日本防衛省於2026年8月4日公布2026年版防衛白皮書，持續將中國定位為日本「前所未有最大的戰略挑戰」，並指出中國航艦在太平洋的活動範圍擴大。白皮書提到，中國海警演習涵蓋登船檢查、扣押及執法巡邏。相較過往表述，新版刪除台海情勢「攸關日本安全保障」的字句，僅保留台海對國際社會穩定的重要性。日本同時指出，中俄聯合轟炸機巡航、艦艇航行及演訓等軍事合作進一步深化，將依託美日同盟，深化與澳洲、印度等國的防衛合作。", "facts": ["2026年8月4日公布新版白皮書", "中國被列為最大戰略挑戰", "中國航艦擴大太平洋活動", "中國海警演習含登船檢查、扣押", "新版刪除台海攸關日本安全保障", "中俄軍事合作進一步深化"], "watch": "留意日本後續深化與澳洲、印度等國防衛合作的安排", "etype": "地緣政治", "codes": [], "n": 2, "subs": [{"t": "日本防衛省稱中國為最大戰略挑戰", "arts": [{"t": "日2026防衛白皮書出爐！指中國為「最大戰略挑戰」 台海論述微調", "u": "https:/ <script>const PAGE="2026-08-04";const XDATE={};
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.clusters, E = DATA.edges;
const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
      <span class="chip">已讀 ${seen.size}/${Object.keys(C).length}</span></div>
    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';
  renderGrid();
}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
