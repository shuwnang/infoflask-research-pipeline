260804700161-430804", "s": "工商時報", "d": "2026-08-04"}]}]}, "31": {"id": 31, "title": "仁寶處分權證獲利2.97億元、AI驗證提速", "synthesis": "仁寶（2324）於2026年8月3日公告，處分聯想集團公司認股權證664萬單位，交易金額3.37億元、處分利益2.97億元，資金規劃用於營運；公司上半年營收4,395.98億元，年增15.8%。另一方面，仁寶電腦（2324）開發「AI Agent for PC Test Automation」，將品質驗證的人工監控時間由平均約150小時縮短至約1小時。目前系統已吸引超過50家企業接洽，仁寶正評估對外商品化，並與大型軟體公司展開合作洽談。", "facts": ["處分認股權證664萬單位", "交易金額3.37億元", "處分利益2.97億元", "上半年營收4,395.98億元", "AI驗證由150小時縮至1小時", "系統吸引超過50家企業接洽"], "watch": "留意仁寶對外商品化評估及與大型軟體公司合作洽談進展。", "etype": "公司治理", "codes": ["2324"], "n": 2, "subs": [{"t": "仁寶AI驗證縮至1小時", "arts": [{"t": "仁寶打造 AI Agent 一鍵自動化完成品質驗證", "u": "https://www.ctee.com.tw/news/20260804701569-431202", "s": "工商時報", "d": "2026-08-04"}]}, {"t": "仁寶處分認股權證獲利2.97億元", "arts": [{"t": "仁寶賣聯想認股權證 進補", "u": "https://money.udn.com/money/story/5710/9668335", "s": "經濟日報", "d": "2026-08-04"}]}]}, "32": {"id": 32, "title": "台北房市量價回升、中國中型房企剩6家", "synthesis": "台北市地政局於2026年8月3日公布，第二季預售案申報備查20案、1,254戶，分別季減23.08%與44.73%，解約47件則季增11.9%，顯示建商採小規模推案試水溫。台北市第1季住宅價格指數回升至127.16、季增0.22%，終止連續4季下滑；預售屋平均成交單價每坪130.22萬元、季增3.38%，但住宅買賣交易量減少8.88%。六都7月建物買賣移轉棟數為20,506棟，另有報導以約2.05萬棟表述，月增12%、年增8.8%，創近19個月新高，月增率連續三個月正成長；前7個月累計117,942棟、年減0.9%。市場需求以自住及長期置產為主，信用管制與購屋負擔仍限制買氣，業者估全年全台交易量約26萬至27萬棟。政策上，中央銀行維持基準利率不變，並將自然人第2戶購屋貸款成數上限放寬至6成，但銀行放款仍審慎。中國房市低迷，2026年前7個月銷售額人民幣300億元至1000億元的中型房企僅6家，較2023年同期少21家；前10名房企平均銷售額較2023年同期減少約45.8%，土地投資下滑恐壓縮未來住宅供應。", "facts": ["台北預售戶數季減44.73%", "台北預售均價每坪130.22萬元", "六都7月交易量20,506棟", "六都前7月交易量年減0.9%", "第2戶房貸成數上限放寬至6成", "中國中型房企僅剩6家", "中國前10大房企銷售額減45.8%"], "watch": "留意信用管制與購屋負擔是否持續限制買氣，以及全年全台交易量約26萬至27萬棟的預估。", "etype": "房市", "codes": [], "n": 5, "subs": [{"t": "六都7月交易量2.05萬棟創19月高", "arts": [{"t": "《傳產》自住剛需撐起一片天 7月六都買賣移轉量年、月雙增", "u": "https://www.ctee.com.tw/news/20260804700564-430503", "s": "工商時報", "d": "2026-08-04"}, {"t": "月增率連三月正成長！六都7月買賣移轉棟數 登高", "u": "https://www.ctee.com.tw/news/20260804700102-430602", "s": "工商時報", "d": "2026-08-04"}]}, {"t": "北市預售戶數季減44.73%、房價回升", "arts": [{"t": "建商減量經營 北市預售屋 Q2推案腰斬、解約升溫", "u": "https://w  "d": "2026-08-04"}]}]}, "38": {"id": 38, "title": "德律7月營收增38%創同期新高", "synthesis": "德律（3030）7月合併營收10.33億元，月增35.4％、年增38.19％；前七月累計營收64.21億元，年增26.75％，創歷年同期新高。需求面上，HPC及先進封裝擴產帶動訂單，法人預期德律第三季營運維持高檔，並認為下半年營收及獲利有機會優於上半年。", "facts": ["7月營收10.33億元", "7月營收月增35.4％", "7月營收年增38.19％", "前七月營收64.21億元", "前七月營收年增26.75％", "HPC及先進封裝擴產帶動需求"], "watch": "留意德律第三季營運，以及下半年營收及獲利是否優於上半年。", "etype": "財報", "codes": ["3030"], "n": 1, "subs": [{"t": "德律7月營收10.33億元", "arts": [{"t": "德律7月營收奏捷 年增逾38％", "u": "https://www.ctee.com.tw/news/20260804700235-430502", "s": "工商時報", "d": "2026-08-04"}]}]}, "39": {"id": 39, "title": "高端疫苗首批EV71疫苗出口越南", "synthesis": "高端疫苗（6547）於8月4日宣布，自主研發的腸病毒71型（EV71）疫苗已完成品質檢驗與批次放行，首批產品啟動出口並已運抵越南。該疫苗已取得越南藥品管理局上市許可，其中一篇報導稱其為越南官方核發的首張腸病毒疫苗藥證。公司表示，產品將投入越南市場供應，後續持續供貨，預計自8月開始貢獻越南業績，作為拓展海外疫苗布局的一環。", "facts": ["高端疫苗（6547）8月4日宣布出口", "EV71疫苗完成品質檢驗與批次放行", "首批產品已運抵越南", "已取得越南藥品管理局上市許可", "報導稱為越南首張腸病毒疫苗藥證", "預計自8月開始貢獻越南業績"], "watch": "留意後續越南市場持續供貨及業績貢獻情況。", "etype": "訂單產能", "codes": ["6547"], "n": 3, "subs": [{"t": "高端疫苗首批EV71疫苗出口越南", "arts": [{"t": "高端腸病毒疫苗首批出口越南 台灣首支EV71疫苗正式進軍海外市場", "u": "https://www.ctee.com.tw/news/20260804701157-430504", "s": "工商時報", "d": "2026-08-04"}, {"t": "高端腸病毒71型疫苗首發批次正式運抵越南 8月開始貢獻營收", "u": "https://money.udn.com/money/story/10871/9670557", "s": "經濟日報", "d": "2026-08-04"}, {"t": "高端腸病毒疫苗 進軍越南", "u": "https://money.udn.com/money/story/11074/9670702", "s": "經濟日報", "d": "2026-08-04"}]}]}, "40": {"id": 40, "title": "尼得科超眾遭勒索攻擊暫無外洩證據", "synthesis": "尼得科超眾（6230）於8月4日公告，針對6月遭勒索軟體攻擊事件，已進行外部數位鑑識調查。調查目前未發現可證明資料已外流的明確技術證據，惟公司表示，仍無法完全排除資訊外洩的可能性，因此後續將持續監控相關情況。", "facts": ["尼得科超眾（6230）6月遭勒索攻擊", "8月4日公告外部鑑識結果", "未發現資料外流明確技術證據", "仍無法完全排除資訊外洩"], "watch": "持續監控後續是否發現資訊外洩證據。", "etype": "公司治理", "codes": ["6230"], "n": 1, "subs": [{"t": "尼得科超眾6月遭勒索攻擊", "arts": [{"t": "尼得科超眾：未發現資料外流明確證據 將持續監控", "u": "https://www.ctee.com.tw/news/20260804701731-430502", "s": "工商時報", "d": "2026-08-04"}]}]}, "41": {"id": 41, "title": "系微攜手Astera Labs、信驊展示AI機櫃管理", "synthesis": "系微（6231）將於2026 OCP APAC高峰會發表2 t": "越南鑽石走私逾3萬顆", "arts": [{"t": "越南爆史上最大鑽石走私案 逾3萬顆流入市場", "u": "https://money.udn.com/money/story/5599/9668678", "s": "經濟日報", "d": "2026-08-04"}]}]}, "75": {"id": 75, "title": "熙特爾-創上半年營收增1,508%拓日美儲能", "synthesis": "熙特爾-創（7740）在日本東京舉辦臺日能源技術交流座談會，分享GridLink EMS取得日本JC-STAR資安雙認證的經驗，並推動與日本能源產業、學術界及企業合作。公司2026年上半年合併營收為72.74億元，年增1,508%；同期間取得北美訂單，並成為臺灣首家取得該認證的儲能品牌。日本首座示範案場預計於2026年7月上線，並預期在2026年下半年開始挹注海外營收。", "facts": ["上半年營收72.74億元，年增1,508%", "GridLink EMS取得日本JC-STAR資安雙認證", "2026年上半年取得北美訂單", "日本首座示範案場2026年7月上線", "2026年下半年預期挹注海外營收"], "watch": "留意日本首座示範案場於2026年7月上線，以及2026年下半年海外營收貢獻。", "etype": "業務合作", "codes": ["7740"], "n": 2, "subs": [{"t": "熙特爾-創（7740）營收增1,508%", "arts": [{"t": "熙特爾赴日舉辦座談會 推動台日企業技術合作", "u": "https://money.udn.com/money/story/10871/9670333", "s": "經濟日報", "d": "2026-08-04"}, {"t": "熙特爾深化台日能源技術 下半年海外營收大增", "u": "https://money.udn.com/money/story/5612/9670662", "s": "經濟日報", "d": "2026-08-04"}]}]}, "76": {"id": 76, "title": "DeepSeek V4-Flash成本不到Claude 1%", "synthesis": "Artificial Analysis數據顯示，DeepSeek V4-Flash的API定價為每100萬個輸入詞元0.14美元、輸出詞元0.28美元，平均每次測試成本僅3美分，不到Claude Fable 5的1%。DeepSeek於7月31日發布該模型，凸顯其測試成本處於極低水準。另一方面，OpenAI於7月底宣布GPT-5.6 Luna降價80%，顯示模型服務商的價格競爭同步升溫。原文未提供OpenAI降價後的具體價格，因此只能與DeepSeek的單位詞元定價及平均測試成本並列比較。", "facts": ["輸入詞元每百萬0.14美元", "輸出詞元每百萬0.28美元", "平均每次測試成本3美分", "成本不到Claude Fable 5的1%", "DeepSeek於7月31日發布模型", "OpenAI宣布GPT-5.6 Luna降價80%"], "watch": "留意7月31日發布後DeepSeek V4-Flash與GPT-5.6 Luna的定價競爭。", "etype": "產業供需", "codes": [], "n": 1, "subs": [{"t": "DeepSeek模型成本低於1%", "arts": [{"t": "成本不到 Claude 1% DeepSeek 劃下 AI 性價比「斬殺線」", "u": "https://money.udn.com/money/story/5603/9668680", "s": "經濟日報", "d": "2026-08-04"}]}]}, "77": {"id": 77, "title": "力泰上半年獲利3.08億元年減", "synthesis": "力泰（5520）於8月4日公布上半年財報，1-6月合併營收19.32億元，年減3.4%；稅後淨利3.08億元，年減2.49%，每股盈餘（EPS）5.14元。公司表示，受國內房地產市場低迷及開工率下滑影響，出貨量減少，拖累營收與獲利。不過，高端、高磅數預拌混凝土出貨增加，使毛利率及營益率均較去年同期提升。", "facts": ["上半年營收19.32億元，年減3.4%", "稅後淨利3.08億元，年減2.49%", "EPS 5.14元", "高端、高磅數混凝土出貨增加", "毛利率及營益率均年增"], "watch": "", "etype": "財報", 8-04"}]}]}, "83": {"id": 83, "title": "環球晶Q2獲利增99%攜美光擴產", "synthesis": "環球晶（6488）於2026年8月4日公布第二季財報，營收各篇報導為152.1億至152.14億元，季增8.8%、年減5%；稅後純益37.8億至37.79億元，季增約99%，每股純益7.9元。上半年營收一說291.99億元、另一說約292億元，年減7.6%，每股純益11.87元；另有報導稱每股純益較去年同期成長超過80%。6月歸屬母公司業主淨損39.55億元、每股淨損8.27元，主因持有德國世創股票的評價損益變動。公司表示AI與HPC需求成長，12吋、8吋及6吋產能滿載；義大利諾瓦拉廠火警僅影響局部8吋產線，12吋產線未受影響，惟可能壓抑第三季部分營收增幅。公司已取得德州新廠多家Tier-1客戶認證，並與美光簽署10年供貨長約、取得5億美元策略性資金，下一步將推進德州廠第二階段擴產。", "facts": ["Q2營收152.1億至152.14億元", "Q2稅後純益37.8億至37.79億元", "Q2每股純益7.9元", "上半年營收291.99億至約292億元", "諾瓦拉火警影響局部8吋產線", "攜美光簽10年供貨長約", "美光提供5億美元策略性資金"], "watch": "留意第三季營收增幅是否受義大利諾瓦拉廠火警壓抑，以及德州廠第二階段擴產進展。", "etype": "財報", "codes": ["6488"], "n": 6, "subs": [{"t": "環球晶Q2獲利增、攜美光擴產", "arts": [{"t": "環球晶Q2營運回升 營收季增8.8％ 德州新廠奪多家Tier-1客戶認證", "u": "https://www.ctee.com.tw/news/20260804701337-430501", "s": "工商時報", "d": "2026-08-04"}, {"t": "環球晶財報／第2季獲利季增近一倍 每股賺7.9元", "u": "https://money.udn.com/money/story/11074/9670235", "s": "經濟日報", "d": "2026-08-04"}, {"t": "環球晶今日下午召開法說 盤中股價先漲停暖身", "u": "https://money.udn.com/money/story/5607/9669479", "s": "經濟日報", "d": "2026-08-04"}, {"t": "環球晶Q2每股純益7.9元 全球擴產進入收成期 日本廠表現最佳", "u": "https://money.udn.com/money/story/5612/9670501", "s": "經濟日報", "d": "2026-08-04"}, {"t": "環球晶：客戶庫存健康　矽晶圓產能滿載", "u": "https://money.udn.com/money/story/11162/9670699", "s": "經濟日報", "d": "2026-08-04"}, {"t": "美光10年長約成定心丸　環球晶徐秀蘭預告美國第二階段擴產", "u": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E5%85%8910%E5%B9%B4%E9%95%B7%E7%B4%84%E6%88%90%E5%AE%9A%E5%BF%83%E4%B8%B8-%E7%92%B0%E7%90%83%E6%99%B6%E5%BE%90%E7%A7%80%E8%98%AD%E9%A0%90%E5%91%8A%E7%BE%8E%E5%9C%8B%E7%AC%AC%E4%BA%8C%E9%9A%8E%E6%AE%B5%E6%93%B4%E7%94%A2-103900530.html", "s": "Yahoo股市", "d": "2026-08-04"}]}]}, "84": {"id": 84, "title": "晟田擴產五成迎半導體設備需求", "synthesis": "晟田（4541）因應AI帶動的半導體設備投資與訂單成長，已啟動半導體產線擴產，產能滿載後預計增加約五成。營運數據方面，4月半導體設備零組件營收為1.5億元，年增53.78%；6月營收1.99億元，年增58.7%。累計上半年營收達10億元，年增33.3%，顯示半導體設備零組件業務保持年增成長。", "facts": ["晟田啟動半導體產線擴產", "滿載後產能增加約五成", "4月營收1.5億元、年增53.78%", "6月營收1.99億元、年增58.7%", "上半年營收10億元、年增33.3%"], " 年供給可能吃緊或供不應求。景碩規畫2029年底將ABF月產能增至8,000萬顆，廠房投入約450億元，另規劃196億元專案資本支出。高盛8月4日重申買進，將目標價由1,120元上調至1,125元，股價潛在漲幅61.1%。", "facts": ["第2季營收124.96億元", "第2季稅後淨利13.11億元", "EPS說法為2.80元與2.57元", "2029年底ABF月產能8,000萬顆", "廠房投入約450億元", "高盛目標價上調至1,125元"], "watch": "留意2027至2028年ABF供給吃緊或供不應求，以及2029年底擴產進度。", "etype": "法人動向", "codes": ["3189"], "n": 3, "subs": [{"t": "景碩擴產450億，高盛喊1125元", "arts": [{"t": "蔡慶龍｜景碩AI載板供給轉緊 擴產與漲價推升獲利", "u": "https://www.ctee.com.tw/news/20260804701039-430205", "s": "工商時報", "d": "2026-08-04"}, {"t": "景碩連3根漲停攻回月線！高盛看好ABF供不應求 目標價喊上1,125元", "u": "https://www.ctee.com.tw/news/20260804701043-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "外資高喊這檔 PCB 廠還將漲逾六成 激勵股價漲停鎖死", "u": "https://money.udn.com/money/story/5607/9669608", "s": "經濟日報", "d": "2026-08-04"}]}]}, "88": {"id": 88, "title": "波音MAX 7獲FAA認證，月產量上看52架", "synthesis": "FAA於8月4日宣布，波音737 MAX 7完成認證，最多可容納172個座位。為取得認證，波音完成441次試飛，累計686個試飛小時。產能方面，FAA已核准MAX月產量由38架提高至42架、47架；波音則預期新產線月產能可達52架。消息公布後，波音股價一度大漲8%。", "facts": ["MAX 7完成FAA認證，可容納172座", "波音完成441次試飛", "累計686個試飛小時", "MAX月產量核准至42架、47架", "波音預期新產線月產52架", "波音股價一度大漲8%"], "watch": "留意波音新產線月產能是否達到每月52架。", "etype": "訂單產能", "codes": [], "n": 1, "subs": [{"t": "波音MAX 7完成認證172座", "arts": [{"t": "空難後首獲放行新機型　波音737 MAX 7獲認證", "u": "https://money.udn.com/money/story/5599/9669087", "s": "經濟日報", "d": "2026-08-04"}]}]}, "89": {"id": 89, "title": "愛普6月淨利年增785%大摩喊價1555元", "synthesis": "愛普*（6531）6月獲利表現優於預期，單月淨利達3.27億元，年增785%；單月EPS為2.01元，年增784%。摩根士丹利（大摩）維持「優於大盤」評等，並將目標價看至1,555元。", "facts": ["愛普*（6531）6月淨利3.27億元", "6月淨利年增785%", "單月EPS 2.01元，年增784%", "大摩維持「優於大盤」", "大摩目標價1,555元"], "watch": "", "etype": "法人動向", "codes": ["6531"], "n": 1, "subs": [{"t": "大摩看愛普目標價1,555元", "arts": [{"t": "愛普 瞄準逾100天", "u": "https://money.udn.com/money/story/5739/9668359", "s": "經濟日報", "d": "2026-08-04"}]}]}, "90": {"id": 90, "title": "熊本地震擾供應鏈，百家門市復業", "synthesis": "熊本地震衝擊企業供應鏈與交通運輸。截至8月3日，全家便利商店約40家因震災停業的門市已恢復營業；7-Eleven則有多達100家門市停業，近9成已復業。製造業復原進度較慢，本田工廠停工至8月7日，日產汽車部分生產預計持續停滯至8月5日。交通方面，JR九州表示，九州新幹線部分路段在8月內仍難恢復營 "], "watch": "", "etype": "公司治理", "codes": ["6938"], "n": 1, "subs": [{"t": "藍新資訊上櫃通過6938", "arts": [{"t": "《櫃買市場》藍新資訊上櫃案 審議通過", "u": "https://www.ctee.com.tw/news/20260804700570-430201", "s": "工商時報", "d": "2026-08-04"}]}]}, "100": {"id": 100, "title": "台玻擴產20億元因應玻纖布缺口", "synthesis": "8月4日玻纖布族群跌深反彈，富喬（1815）與德宏（5475）漲停，台玻（1802）盤中大漲逾8%，南亞（1303）股價則小漲約1%。產業方面，玻纖布目前仍供不應求，台玻宣布投入20億元，擴充Low DK與Low CTE產能；供需緊張預計延續至2027年，成為族群股價反彈的主要題材。", "facts": ["台玻投入20億元擴充產能", "Low DK、Low CTE仍供不應求", "供需緊張預計延續至2027年", "富喬（1815）、德宏（5475）漲停", "台玻（1802）盤中大漲逾8%", "南亞（1303）股價小漲約1%"], "watch": "留意玻纖布供需緊張是否延續至2027年。", "etype": "產業供需", "codes": ["1303", "1802", "1815", "5475"], "n": 1, "subs": [{"t": "台玻擴產投入20億元", "arts": [{"t": "玻纖布起死回生？富喬、德宏漲停 台玻重回50元", "u": "https://money.udn.com/money/story/5607/9669452", "s": "經濟日報", "d": "2026-08-04"}]}]}, "101": {"id": 101, "title": "精煉銅7月流入美國20萬噸創新高", "synthesis": "7月約20萬噸精煉銅運抵美國，創至少12年來單月新高；這批流入使美國境內囤銅超過100萬噸，並在庫存增加的同時，加劇全球供應緊張。報導指出，白宮仍在評估是否把50%關稅擴大至精煉銅，尚未確定的政策方向，持續影響精煉銅流向與短期供應。換言之，當前事件同時呈現美國單月大量進口、境內高庫存，以及關稅範圍待定三項變化；後續銅流向與短期供應仍受白宮評估結果牽動。", "facts": ["7月精煉銅流入美國約20萬噸", "創至少12年單月新高", "美國囤銅超過100萬噸", "加劇全球供應緊張", "白宮評估擴大50%關稅至精煉銅", "政策不確定性影響銅流向與短供"], "watch": "留意白宮是否將50%關稅擴大至精煉銅。", "etype": "原物料能源", "codes": [], "n": 1, "subs": [{"t": "精煉銅運抵美國20萬噸", "arts": [{"t": "交易商瘋狂套利！單月20萬噸精煉銅湧入美國　關稅未拍板掀全球搶運潮", "u": "https://tw.stock.yahoo.com/news/%E4%BA%A4%E6%98%93%E5%95%86%E7%98%8B%E7%8B%82%E5%A5%97%E5%88%A9-%E5%96%AE%E6%9C%8820%E8%90%AC%E5%99%B8%E7%B2%BE%E7%85%89%E9%8A%85%E6%B9%A7%E5%85%A5%E7%BE%8E%E5%9C%8B-%E9%97%9C%E7%A8%85%E6%9C%AA%E6%8B%8D%E6%9D%BF%E6%8E%80%E5%85%A8%E7%90%83%E6%90%B6%E9%81%8B%E6%BD%AE-081000555.html", "s": "Yahoo股市", "d": "2026-08-04"}]}]}, "102": {"id": 102, "title": "大立光CPO最快2027年中量產", "synthesis": "大立光（3008）受共同封裝光學（CPO）、蘋果新iPhone拉貨及政策題材帶動，2026年8月4日股價漲停。兩篇報導對價格說法不同，一篇稱收至4,355元，另一篇稱盤中漲停至4,300元。Nvidia宣布CPO將進入量產，大立光已有一家光纖陣列量產型客戶，預計2026年第3季底完成試量產線建置，最快2027年中量產；報導另提及公司已取得CPO首張訂單。營運方面，大立光2026年上半年稅後盈餘107.93億元、年增44%，第2季稅後純益46.69億元，較去年同期大增3.5倍；董事長林恩平表示，第3季產能利用率將滿載。", "facts": ["2026年8月4日股價漲停", "漲停價格說法為4,355元或4,300元", "最快2027年中CPO量產", "2026年第3季底完成試量產線", "上半年稅後盈餘107.93億元", "第2季純益46.69億元、年增3.5倍"], "watch": "2026年第3季底試量產線建置、最快2027年中CPO量產及第3季產能利用率滿載情況", "etype": "訂單產能", "codes": ["3008"], "n": 2, "subs": [{"t": "大立光CPO最快2027量產、股價漲停", "arts": [{"t": "《光電股》搶搭CPO商機 大立光鎖紅燈", "u": "https://www.ctee.com.tw/news/20260804701020-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "大立光衝漲停 多檔光電股跟著亮燈", "u": "https://money.udn.com/money/story/5607/9669313", "s": "經濟日報", "d": "2026-08-04"}]}]}, "103": {"id": 103, "title": "昶瑞機電上半年EPS降至1.25元", "synthesis": "8月4日，昶瑞機電、聯詠（3034）、瑞鼎與原相公布或承認第二季財報。昶瑞機電第二季EPS約0.76元，高於去年同期0.65元，但上半年EPS為1.25元，低於去年同期2.13元；公司表示，第三季DC吊扇外銷美國進入旺季，營運有機會優於去年同期。聯詠（3034）第二季EPS為10.4元，上半年EPS達16.59元。瑞鼎第二季EPS為4.54元、上半年為8.35元，並預期本季營運動能趨緩。原相僅列在8月4日公布第二季財報的公司名單中，報導未提供其獲利數字。", "facts": ["昶瑞機電上半年EPS為1.25元", "昶瑞機電Q2 EPS約0.76元", "聯詠（3034）上半年EPS 16.59元", "瑞鼎上半年EPS為8.35元", "原相獲利數字未提供"], "watch": "留意第三季昶瑞機電DC吊扇外銷美國旺季，以及瑞鼎本季營運動能趨緩。", "etype": "財報", "codes": ["3034"], "n": 2, "subs": [{"t": "昶瑞機電上半年EPS降、聯詠16.59元", "arts": [{"t": "昶瑞機電 上半年EPS為1.25元", "u": "https://www.ctee.com.tw/news/20260804701795-430503", "s": "工商時報", "d": "2026-08-04"}, {"t": "聯詠上半年 EPS 16.59元 瑞鼎8.35元", "u": "https://money.udn.com/money/story/5607/9670716", "s": "經濟日報", "d": "2026-08-04"}]}]}, "104": {"id": 104, "title": "長聖7月營收增20.7%創新高", "synthesis": "長聖（6712）於8月3日公告，7月合併營收9,925萬元，年增20.7%，創今年單月新高；前七月累計營收5.59億元，年增16%。公司表示，CDMO業務持續穩定放量，主要受再生醫療及細胞治療需求增加帶動。業務進展方面，CAR001已進入Phase IIa療效驗證試驗，成為目前重點項目。", "facts": ["7月營收9,925萬元，年增20.7%", "7月營收創今年單月新高", "前七月營收5.59億元，年增16%", "CDMO業務持續穩定放量", "CAR001進入Phase IIa試驗"], "watch": "留意CAR001 Phase IIa療效驗證試驗進展。", "etype": "財報", "codes": ["6712"], "n": 2, "subs": [{"t": "長聖7月營收增20.7%創新高", "arts": [{"t": "長聖7月營收 今年新高", "u": "https://www.ctee.com.tw/news/20260804700252-430504", "s": "工商時報", "d": "2026-08-04"}, {"t": "長聖7月合併營收年增20%", "u": "https://money.udn.com/money/story/11074/9668368", "s": "經濟日報", "d": "2026-08-04"}]}]}, "105": {"id": 105, "title": "富邦媒上半年營收536.9億元、獲利年減約16%", "synthesis": "富邦媒（8454）於2026年8月4日法說會公布，第二季合併營收270.9億元，年增4.1%，EPS 2.38元；上半年合併營收536.9億元，年增2.4%，稅後純益12.7億元，EPS 4.81元。稅後純益年減幅度，報導分別為15.8%與15.7%，數字略有差異。總經理谷元宏對2026年下半年電商旺季及營運逐季走揚持審慎樂觀看法，並表示市場競爭將由價格轉向服務力。富邦媒將說明AI、零售媒體聯播網及智慧物流布局，中區物流中心預計2027年投入營運。台灣電商滲透率升至14.2%；截至2026年6月底，mo店+精選商家突破1萬家、商品約370萬項。公司併購方向準備中，股利政策目前不變。", "facts": ["Q2營收270.9億元、年增4.1%", "Q2 EPS 2.38元", "上半年營收536.9億元", "上半年EPS 4.81元", "稅後純益年減15.8%或15.7%", "mo店+商家突破1萬家", "商品約370萬項", "物流中心預計2027年營運"], "watch": "留意富邦媒2027年中區物流中心投入營運，以及下半年AI、零售媒體聯播網與智慧物流布局說明。", "etype": "財報", "codes": ["8454"], "n": 3, "subs": [{"t": "富邦媒上半年營收536.9億元、獲利下滑", "arts": [{"t": "富邦媒 H2深化智慧物流", "u": "https://www.ctee.com.tw/news/20260804700189-430502", "s": "工商時報", "d": "2026-08-04"}, {"t": "富邦媒：電商價格戰降溫　下半年營運審慎樂觀", "u": "https://money.udn.com/money/story/5612/9670492", "s": "經濟日報", "d": "2026-08-04"}, {"t": "富邦媒營運拚季季高", "u": "https://money.udn.com/money/story/5710/9670729", "s": "經濟日報", "d": "2026-08-04"}]}]}, "106": {"id": 106, "title": "帆宣Q2獲利創高、上半年EPS13.26元", "synthesis": "帆宣（6196）於8月4日通過並公告第2季財報，合併營收212億元、稅後純益18億元，營收與獲利均創單季歷史新高。第2季稅後純益季增61.8%，較去年同期大增逾3.5倍；第2季每股純益兩篇報導分別記載為8.18元與8.17元。上半年營收355.08億元、稅後純益29.13億元，每股純益13.26元。公司在手訂單逾1,000億元，主要受惠晶圓廠建廠工程及先進封裝設備出貨，訂單預計消化至2027年之後。", "facts": ["Q2營收212億元創單季新高", "Q2稅後純益18億元", "Q2 EPS為8.18元或8.17元", "上半年EPS13.26元", "在手訂單逾1,000億元", "訂單預計消化至2027年後"], "watch": "留意在手訂單至2027年之後的消化進度，以及晶圓廠建廠工程與先進封裝設備出貨。", "etype": "財報", "codes": ["6196"], "n": 2, "subs": [{"t": "帆宣Q2獲利創高、上半年EPS13.26元", "arts": [{"t": "帆宣財報／第2季稅後純益18億元、EPS 8.18元 雙創單季歷史新高", "u": "https://money.udn.com/money/story/5710/9670421", "s": "經濟日報", "d": "2026-08-04"}, {"t": "帆宣上半年 EPS 13.26元", "u": "https://money.udn.com/money/story/5710/9670715", "s": "經濟日報", "d": "2026-08-04"}]}]}, "107": {"id": 107, "title": "南亞科7月營收增720%南電創43月高", "synthesis": "南亞科（2408）於2026年8月4日公布7月營收，報導數字有438.67億元與438.68億元兩種，月增均約49.27%、年增719.61%；累計前7月營收則為1755.03億元或1755.04億元，年增660.87%。報導分別稱其連續八個月、續創歷史新高。公司產能利用率接近滿載，短期出貨成長有限，2026年動能將來自平均售價提升與產品組合改善，並加速林口5A廠，規畫月產能4.5萬片、資本支出預估約4800億元。南電（8046）7月營收報54.39億元或54.40億元，月增16.13%、年增50.24%，創2022年12月以來近43個月高；前7月301.92億元，年增39.38%。公司預期2026年營收季季增，資本支出規模、強度及時間均創歷年新高；上半年BT載板產能接近滿載，法人估第三、四季價格漲幅可能超過20%～30%。另牧德7月營收3.59億元，月增1.2%、年增31.8%；晶豪科67.85億元，月增40.02%、年增491.06%，雙雙創新高，受記憶體需求及產品供需帶動。", "facts": ["南亞科7月營收年增719.61%", "南亞科前7月累計年增660.87%", "南亞科5A廠月產能4.5萬片", "南電7月營收年增50.24%", "南電創2022年12月後近43月高", "南電第三、四季價格漲幅或超20%～30%", "牧德、晶豪科7月營收雙創新高"], "watch": "留意2026年林口5A廠加速進度、南亞科平均售價與產品組合，以及南電第三、四季價格漲幅。", "etype": "財報", "codes": ["2408", "8046"], "n": 8, "subs": [{"t": "南亞科營收暴增719%南電創43月高", "arts": [{"t": "《電零組》7月營收衝近43月高 南電亮燈站回千元", "u": "https://www.ctee.com.tw/news/20260804700957-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "《半導體》南亞科營收連8月創史高 前7月成長6.6倍", "u": "https://www.ctee.com.tw/news/20260804701409-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "南電7月營收創43個月新高 BT載板產能近滿載 漲價勢不可擋", "u": "https://www.ctee.com.tw/news/20260804700085-430502", "s": "工商時報", "d": "2026-08-04"}, {"t": "南亞科營收／7月438億元再創歷史新高 月增49.27%、年增719.61%", "u": "https://money.udn.com/money/story/5710/9670126", "s": "經濟日報", "d": "2026-08-04"}, {"t": "南電7月合併營收月增16.1% 牧德增1.2%", "u": "https://money.udn.com/money/story/5607/9668328", "s": "經濟日報", "d": "2026-08-04"}, {"t": "南亞科晶豪科7月營收創新高　月增逾4成", "u": "https://money.udn.com/money/story/5612/9670728", "s": "經濟日報", "d": "2026-08-04"}, {"t": "DRAM漲不停 南亞科7月營收再飆升至438億元 年增逾七倍", "u": "https://money.udn.com/money/story/5710/9670713", "s": "經濟日報", "d": "2026-08-04"}, {"t": "南亞科狂飆！7月營收438億元　年增719%震撼市場", "u": "https://tw.stock.yahoo.com/news/%E5%8D%97%E4%BA%9E%E7%A7%91%E7%8B%82%E9%A3%86-7%E6%9C%88%E7%87%9F%E6%94%B6438%E5%84%84%E5%85%83-%E5%B9%B4%E5%A2%9E719-%E9%9C%87%E6%92%BC%E5%B8%82%E5%A0%B4-100851226.html", "s": "Yahoo股市", "d": "2026-08-04"}]}]}, "108": {"id": 108, "title": "信邦7月營收31.67億元創高、無人機拚倍增", "synthesis": "信邦（3023）於2026年8月4日公布，2026年7月合併營收31.67億元，月增2.41%、年增28.97%，創單月歷史新高，且為連續第四個月改寫單月新高。累計2026年前7月合併營收205.54億元，年增11.44%，同樣創同期新高。分產品應用來看，7月醫療、汽車及工業應用銷售分別月增14.80%、16.04%及4.05%。在美國聯邦航空 "工商時報", "d": "2026-08-04"}]}]}, "119": {"id": 119, "title": "中國製造業降溫台灣PMI近五年高", "synthesis": "中國製造業景氣出現分歧但整體降溫：標普全球與RatingDog聯合調查的7月PMI由6月51.7降至50.9；官方PMI則由50.3降至49.2，低於市場預期50.1並跌破榮枯線。兩項調查均反映內需不足、訂單增長放緩、企業採購減少及庫存累積。美系外資認為短期可能壓抑工業自動化股情緒，若中國推出刺激政策，仍看好亞德客-KY（1590）及上銀（2049）中長期營運。8月3日公布的台灣製造業PMI因調查來源不同，中經院為61.5、標普全球為55.1；前者連10個月擴張並創近5年新高，後者反映需求快速攀升，但缺料、漲價、物流干擾與交期延遲加劇。台灣非製造業NMI由59.9降至57.3，未經季調連17個月擴張，未來6個月展望降至58.9，資訊暨通訊傳播業展望降至45.5。海外方面，美國7月製造業PMI終值為53.9、ISM為55.6；歐元區升至51.9，產出指數創2022年3月以來新高，但新訂單及出口訂單偏弱，德國升至52.2、法國降至49.8；南韓、日本及東南亞分別為53.1、54.5及52.8。勞動部8月3日公布，台灣減班休息245家、3,026人，較7月中旬增加14家、258人，其中製造業2,732人；受美國對等關稅影響者為192家、2,564人，勞動部認為市場仍處平穩。", "facts": ["中國官方7月PMI降至49.2", "台灣製造業PMI最高61.5", "台灣減班休息達3,026人", "亞德客-KY（1590）及上銀（2049）", "歐元區PMI升至51.9", "美國ISM製造業指數55.6", "製造業減班休息涉及2,732人"], "watch": "留意中國是否推出刺激政策，以及台灣減班休息人數後續變化。", "etype": "總經政策", "codes": ["1590", "2049"], "n": 8, "subs": [{"t": "中國製造業PMI降溫台灣PMI創近五年高", "arts": [{"t": "陸7月標普製造業PMI 遜預期", "u": "https://www.ctee.com.tw/news/20260804700158-430803", "s": "工商時報", "d": "2026-08-04"}, {"t": "《類股》亞德客、上銀後市 外資仍比讚", "u": "https://www.ctee.com.tw/news/20260804700911-430201", "s": "工商時報", "d": "2026-08-04"}, {"t": "歐美製造業PMI 7月同步擴張", "u": "https://www.ctee.com.tw/news/20260804700140-430701", "s": "工商時報", "d": "2026-08-04"}, {"t": "7月非製造業NMI 回跌至57.3", "u": "https://www.ctee.com.tw/news/20260804700114-430102", "s": "工商時報", "d": "2026-08-04"}, {"t": "7月台灣PMI 連十個月擴張", "u": "https://www.ctee.com.tw/news/20260804700051-430102", "s": "工商時報", "d": "2026-08-04"}, {"t": "全球製造業景氣持續擴張 台日韓7月產出加速成長", "u": "https://money.udn.com/money/story/5599/9668708", "s": "經濟日報", "d": "2026-08-04"}, {"t": "中經院調查 股市波動大 內需消費趨審慎", "u": "https://money.udn.com/money/story/10869/9668709", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "台灣無薪假突破3,000人", "arts": [{"t": "無薪假升溫 突破3,000人", "u": "https://money.udn.com/money/story/5648/9668580", "s": "經濟日報", "d": "2026-08-04"}]}]}, "120": {"id": 120, "title": "亞馬遜市值突破3兆美元", "synthesis": "8月3日，中東地緣政治緊張局勢趨緩，伊朗暗示荷莫茲海峽船隻通行談判取得進展，美國總統 億美元，央行進場調節，避免匯價貶破32.5元。外部環境方面，美日聯手干預支撐日圓，美元指數一度跌破100；8月4日新台幣以32.46元開盤，於32.4至32.465元震盪，美元指數則再向100靠攏。美國7月ISM製造指數為55.6，創2022/5以來新高，荷莫茲海峽亦於周二重開。市場預估新台幣短線在32.2至32.5元區間整理。", "facts": ["8月3日新台幣收32.438元", "單日貶值1.46角", "成交量39.2億美元", "外資估計匯出約20億美元", "央行防止匯價貶破32.5元", "8月4日開盤32.46元", "美國7月ISM製造指數55.6"], "watch": "留意新台幣短線是否維持在32.2至32.5元區間。", "etype": "地緣政治", "codes": [], "n": 3, "subs": [{"t": "新台幣8月3日重貶1.46角", "arts": [{"t": "新台幣先盛後衰 回測32.5", "u": "https://www.ctee.com.tw/news/20260804700048-430302", "s": "工商時報", "d": "2026-08-04"}, {"t": "美元指數再向100靠攏 新台幣狹幅區間震盪", "u": "https://money.udn.com/money/story/10871/9669202", "s": "經濟日報", "d": "2026-08-04"}, {"t": "熱錢匯出 台幣重貶1.46角", "u": "https://money.udn.com/money/story/5616/9668600", "s": "經濟日報", "d": "2026-08-04"}]}]}, "123": {"id": 123, "title": "立院放寬政府間接持有廣電上限至1%", "synthesis": "立法院於8月4日三讀通過《廣播電視法》修法，將政府、其捐助成立的財團法人及受託人間接投資民營廣播、電視事業的持股上限放寬至1%，使相關規範與《有線廣播電視法》對齊。修法另規定，純財務投資可排除於持股上限計算之外。違法投資的責任也同步調整，由投資行為人負擔新台幣20萬元以上、200萬元以下罰鍰。兩篇報導對持股上限、適用對象、純財務投資排除及罰鍰區間的說法一致。", "facts": ["8月4日立院三讀通過修法", "政府間接持有廣電上限放寬至1%", "純財務投資可排除持股計算", "違法投資罰鍰20萬至200萬元", "規範與《有線廣播電視法》對齊"], "watch": "", "etype": "總經政策", "codes": [], "n": 2, "subs": [{"t": "立院放寬政府間接持有廣電上限至1%", "arts": [{"t": "黨政軍持股鬆綁上限1% 「廣電法」修法三讀", "u": "https://money.udn.com/money/story/10871/9669319", "s": "經濟日報", "d": "2026-08-04"}, {"t": "立院三讀廣播電視法　放寬政府間接投資持股上限至1%", "u": "https://money.udn.com/money/story/7307/9669142", "s": "經濟日報", "d": "2026-08-04"}]}]}, "124": {"id": 124, "title": "美伊談判未定油價重挫、霍爾木茲通航驟降", "synthesis": "8月3日，川普宣布取消對伊朗的大規模攻擊，稱美伊展開新一輪談判並已有協議框架，討論重新開放荷姆茲海峽；伊朗否認談判或已安排會晤，巴基斯坦則稱日期與地點未定。消息令WTI盤中一度下跌7.37%，收跌5.11%至80.34美元；其他報導分別指跌6.2%至79.42美元、盤中跌6.8%至78.93美元，布蘭特收跌4.73%至83.77美元、盤中跌5.68%至82.93美元，或重挫7.3%至81.55美元。美軍自7月中旬封鎖後已改變44艘商船航線。8月4日，美國財長貝森特稱可能於8月4日或8月5日達成協議，油價續跌，WTI報76.32美元或約77.9美元，布蘭特跌破80美元或約81.95美元；卡達稱調停有進展，伊朗並與阿曼磋商船隻通行，但海峽船隻遭砲擊，布蘭特反彈1.3%至84.89美元。Kpler數據顯示，8月2日通過海峽船舶僅8艘，8月3日再降至6艘且全走伊朗航線，亞洲原油船約每日4艘，遠低於戰前逾100艘；另一報導指8月3日布蘭特跌4.4%至84.05美元。OPEC+宣布9月每日增產18.8萬桶；同期道瓊創高、費半漲5%、Palantir漲21%，BDI升 <script>const PAGE="2026-08-04";const XDATE={};
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.clusters, E = DATA.edges;
const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
      <span class="chip">已讀 ${seen.size}/${Object.keys(C).length}</span></div>
    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';
  renderGrid();
}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
