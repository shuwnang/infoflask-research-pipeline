/9670349", "s": "經濟日報", "d": "2026-08-04"}]}]}, "16": {"id": 16, "title": "藥華藥拓澳門、朝和銷售破百萬件", "synthesis": "藥華藥（6446）的Ropeg新增ET適應症於8月2日獲澳門藥物監督管理局核准，可在澳門上市銷售；公司今年上半年營收累計119.8億元，年增75%，美國FDA審查目標日期為8月30日。減重藥市場方面，諾和諾德推出口服Wegovy，與禮來爭奪市場主導地位；專家估計美國市場到2030年可能超過1,000億美元，兩家公司將於8月5日公布第二季財報，市場關注轉型持續性與長期競爭力。另方面，世紀*（5314）董事長張祐銘表示，集團透過併購整合原料、CDMO、品牌與通路，旗下朝和生醫口服外泌體產品在台累計銷售突破百萬件、回購率突破8成，並鎖定馬來西亞拓展海外市場，整體營運有機會再創高峰。", "facts": ["藥華藥上半年營收119.8億元", "Ropeg澳門8月2日獲准上市", "FDA審查目標日為8月30日", "美國減肥藥市場2030年或逾1,000億美元", "諾和諾德與禮來8月5日公布財報", "朝和口服外泌體銷售突破百萬件", "朝和產品回購率突破8成"], "watch": "留意8月5日諾和諾德與禮來第二季財報，以及8月30日美國FDA審查結果。", "etype": "訂單產能", "codes": ["5314", "6446"], "n": 3, "subs": [{"t": "諾和諾德爭奪千億美元市場", "arts": [{"t": "諾和諾德、禮來 爭千億美元減肥藥市場", "u": "https://www.ctee.com.tw/news/20260804700149-430704", "s": "工商時報", "d": "2026-08-04"}]}, {"t": "藥華藥營收119.8億元", "arts": [{"t": "台股挑戰收復月季線 但生技股王藥華藥已率先大漲站上月線", "u": "https://money.udn.com/money/story/5710/9669310", "s": "經濟日報", "d": "2026-08-04"}]}, {"t": "朝和生醫銷售突破百萬件", "arts": [{"t": "世紀民生搶攻東南亞億萬保健紅利", "u": "https://money.udn.com/money/story/5612/9670626", "s": "經濟日報", "d": "2026-08-04"}]}]}, "17": {"id": 17, "title": "三陽7月機車市占46.2%居冠、六都交易創新高", "synthesis": "台灣7月機車總領牌數為7.09萬輛或70,899輛，月增5.3%、年增8.59%或8.6%；前7月累計43.43萬輛或434,321輛，年增9.81%或9.8%。三陽以3.27萬輛、市占46.2%居冠，光陽、山葉分列二、三名，但電動機車僅3,662輛、年減28.7%。汽車7月掛牌約3.87萬輛或38,657輛，年增8.9%；前7月24.09萬輛或240,935輛，年增2.8%。和泰車旗下TOYOTA、LEXUS合計16,071輛，年增18%、市占41.6%，創今年單月新高；業者看好8月機車維持高水位，汽車則估約2.8萬輛、年減約5%。聚陽（1477）8月4日公告7月營收29.99億元、年增7.86%，前7月200.62億元、年減1.63%；第三季出貨排程已滿，能見度說法從6個月以上、延至第4季，到法人估3至4個月不一，並預留10%～20%產能承接短急單。中鋼（2002）第二季出貨季增7%、年增5%，稅前盈餘33.1億元；7月出貨100.1萬噸，8月有機會再破百萬噸。台北第二季預售申報20案、1,254戶，季減23.08%、44.73%，住宅價格指數升至127.16，預售均價每坪130.22萬元；六都7月移轉20,506棟，創近19個月新高。大陸新能源車7月批發量估年增23%、月增1%，比亞迪銷量41.92萬輛居首，零跑首破10萬輛。", "facts": ["三陽7月市占46.2%居冠", "和泰車TOYOTA、LEXUS掛牌16,071輛", "聚陽7月營收29.99億元", "中鋼7月出貨100.1萬噸", "台北預售戶數季減44.73%", "六都7月移轉20,506棟", "大陸新能源車批發估年增23%", "比亞迪7月銷量41.92萬輛"], "watch": "留意8月機車與中鋼出貨、聚陽第三季至第4季訂單，以及大陸新能源車第二季財報對獲利改善的確認。", "etype": "產業供需", "cod <script>const PAGE="2026-08-04";const XDATE={};
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.clusters, E = DATA.edges;
const seen = new Set(JSON.parse(localStorage.getItem('newsread_'+PAGE)||'[]'));
function saveSeen(){ localStorage.setItem('newsread_'+PAGE, JSON.stringify([...seen])); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function cardHTML(c){
  return `<div class="card${seen.has(c.id)?' visited':''}" onclick="openC(${c.id})">
    <h3>${esc(c.title)}</h3>
    <div class="meta"><span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
    ${c.codes.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
}
function renderGrid(){
  const grid=document.getElementById('grid');
  const cs=Object.values(C).sort((a,b)=>b.n-a.n || a.id-b.id);
  grid.innerHTML=cs.map(cardHTML).join('');
}
function openC(id){
  const c=C[id]; if(!c) return;
  seen.add(id); saveSeen();
  document.getElementById('overview').style.display='none';
  const r=document.getElementById('reader'); r.style.display='block';
  const edges=(E[id]||[]);
  r.innerHTML=`<div class="topbar"><button class="btn" onclick="backGrid()">← 總覽</button>
      <span class="chip et">${esc(c.etype)}</span><span class="chip">${c.n} 篇</span>
      <span class="chip">已讀 ${seen.size}/${Object.keys(C).length}</span></div>
    <div class="rcard"><h2>${esc(c.title)}</h2>
      <div class="syn">${esc(c.synthesis)}</div>
      ${c.facts.length?`<ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      ${c.watch?`<div class="watch">👁 ${esc(c.watch)}</div>`:''}
      <div class="arts"><h4>原始報導（${c.n} 篇／${c.subs.length} 個子事件）</h4>
        ${c.subs.map(sub=>`<div class="subev"><h5>${esc(sub.t)}</h5>
          ${sub.arts.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}<span class="src">${esc(a.s)}｜${esc(a.d)}</span></a>`).join('')}</div>`).join('')}
      </div></div>
    <div class="next"><h4>接著讀</h4>
      ${edges.length?edges.map(e=>{
        const t=C[e.to];
        if(t) return `<button class="nextbtn${seen.has(e.to)?' visited':''}" onclick="openC(${e.to})">
            <span class="rel">${esc(e.rel)}</span>${esc(t.title)}
            <span class="why">${esc(e.why)}</span></button>`;
        const x=(XDATE[e.to]||null);
        return x?`<a class="nextbtn" href="${x.date}.html#c${e.to}">
            <span class="rel">${esc(e.rel)}</span>${esc(x.title)}
            <span class="why">${esc(e.why)}（${x.date}）</span></a>`:'';
      }).join(''):'<span class="chip">此群無標註關聯——回總覽挑下一群</span>'}
      <button class="btn" style="margin-top:6px" onclick="backGrid()">回總覽挑下一群</button></div>`;
  window.scrollTo(0,0);
}
function backGrid(){
  document.getElementById('reader').style.display='none';
  document.getElementById('overview').style.display='block';
  renderGrid();
}
renderGrid();
if(location.hash.startsWith('#c')){ const id=parseInt(location.hash.slice(2)); if(C[id]) openC(id); }
</script>
