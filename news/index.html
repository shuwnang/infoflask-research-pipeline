:root{--bg:#0A0C10;--surface:#12151C;--surface-2:#171B24;--surface-3:#1D2330;

*{box-sizing:border-box;margin:0;padding:0}

.syn{margin:10px 0;color:var(--text)}
.facts{margin:12px 0;padding-left:2px}
.facts li{list-style:none;padding:3px 0 3px 18px;position:relative;color:var(--text-2);font-size:.9rem}

.watch{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:10px 0}
.arts{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}

.subev{margin:8px 0 12px}

.arts .src{color:var(--text-3);font-size:.75rem;margin-left:6px}
.next h4{font-size:.85rem;color:var(--text-2);margin:16px 0 8px}
.nextbtn{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;color:var(--text);cursor:pointer;font-size:.9rem;font-family:inherit;transition:.15s}
.nextbtn:hover{background:var(--surface-3);border-color:var(--border-strong)}

.nextbtn.visited{opacity:.5}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.85rem;font-family:inherit}
.btn:hover{background:var(--surface-3);color:var(--text)}
.datecard{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.datecard:hover{background:var(--surface-3);text-decoration:none}
.datecard b{color:var(--text)}
